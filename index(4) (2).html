            <textarea placeholder="Motivo (opcional)" value={reason} onChange={e => setReason(e.target.value)} rows={3} style={{ ...fieldStyle, resize: "vertical", marginBottom: 14 }} />
          </>
        ) : (
          <p style={{ fontSize: 13, color: COLORS.inkSoft, margin: "0 0 14px" }}>O acesso será restaurado imediatamente.</p>
        )}
        <div style={{ display: "flex", gap: 8 }}>
          <GhostButton onClick={onClose} style={{ flex: 1, justifyContent: "center" }}>Cancelar</GhostButton>
          <PrimaryButton onClick={confirm} loading={saving} style={{ flex: 1, background: blocking ? `linear-gradient(155deg, ${COLORS.terra}, #7A2A2A)` : undefined }}>
            {blocking ? "Bloquear" : "Desbloquear"}
          </PrimaryButton>
        </div>
      </Card>
    </div>
  );
}

function SuperAdminEstablishments({ establishments, plans, saActions }) {
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("todos");
  const [editing, setEditing] = useState(null); // establishment being edited, or 'new'
  const [blockTarget, setBlockTarget] = useState(null);
  const [deleteTarget, setDeleteTarget] = useState(null);
  const [error, setError] = useState("");
  const [busyId, setBusyId] = useState(null);

  const filtered = establishments.filter(e => {
    if (statusFilter !== "todos" && e.status !== statusFilter) return false;
    if (query && !`${e.nomeEstabelecimento} ${e.nomeResponsavel}`.toLowerCase().includes(query.toLowerCase())) return false;
    return true;
  });

  async function handleCreate(form) {
    await saActions.createEstablishment(form);
    setEditing(null);
  }
  async function handleUpdate(form) {
    await saActions.updateEstablishment(editing.id, form);
    setEditing(null);
  }
  async function handleBlockToggle(status, reason) {
    setError("");
    try { await saActions.setStatus(blockTarget.id, status, reason); }
    catch (err) { setError(err.message); }
  }
  async function handleDelete() {
    setBusyId(deleteTarget.id); setError("");
    try { await saActions.removeEstablishment(deleteTarget.id); setDeleteTarget(null); }
    catch (err) { setError(err.message); }
    finally { setBusyId(null); }
  }

  return (
    <div className="fade-up">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", margin: "2px 0 16px" }}>
        <h1 className="font-display" style={{ fontSize: 27, margin: 0, fontWeight: 600 }}>Estabelecimentos</h1>
        <PrimaryButton onClick={() => setEditing("new")} style={{ padding: "10px 16px", fontSize: 13 }}>
          <Plus size={15} /> Novo
        </PrimaryButton>
      </div>

      <ErrorBanner message={error} onDismiss={() => setError("")} />

      <input placeholder="Buscar por nome..." value={query} onChange={e => setQuery(e.target.value)} style={{ ...fieldStyle, marginBottom: 10 }} />
      <div className="scrollbar-thin" style={{ display: "flex", gap: 6, marginBottom: 16, overflowX: "auto", background: COLORS.bgAlt, padding: 4, borderRadius: 13 }}>
        {[{ k: "todos", l: "Todos" }, { k: "ativo", l: "Ativos" }, { k: "bloqueado", l: "Bloqueados" }].map(f => (
          <button key={f.k} onClick={() => setStatusFilter(f.k)} className="font-body sd-tab" style={{
            flexShrink: 0, border: "none", background: statusFilter === f.k ? COLORS.surface : "transparent",
            color: statusFilter === f.k ? COLORS.primary : COLORS.inkSoft, boxShadow: statusFilter === f.k ? COLORS.shadowSm : "none",
            borderRadius: 10, padding: "8px 13px", fontSize: 12.5, fontWeight: 700, cursor: "pointer",
          }}>{f.l}</button>
        ))}
      </div>

      {filtered.length === 0 ? (
        <Card style={{ padding: 18, textAlign: "center", color: COLORS.inkFaint, fontSize: 13 }}>Nenhum estabelecimento encontrado.</Card>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {filtered.map(e => {
            const plan = plans.find(p => p.id === e.planId);
            return (
              <Card key={e.id} style={{ padding: 15, opacity: busyId === e.id ? 0.6 : 1 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 14.5 }}>{e.nomeEstabelecimento}</div>
                    <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>{e.nomeResponsavel} · {e.email}</div>
                    <div style={{ fontSize: 11.5, color: COLORS.inkFaint, marginTop: 2 }}>/{e.slug}</div>
                  </div>
                  <Pill fg={e.status === "ativo" ? COLORS.sage : COLORS.terra} bg={e.status === "ativo" ? COLORS.sageSoft : COLORS.terraSoft} dot>
                    {e.status === "ativo" ? "Ativo" : "Bloqueado"}
                  </Pill>
                </div>
                <div style={{ marginTop: 8 }}>
                  <Pill fg={COLORS.gold} bg={COLORS.goldSoft}>{plan ? `${plan.nome} · R$ ${plan.preco}/${plan.periodicidade}` : "Sem plano"}</Pill>
                </div>
                <div style={{ display: "flex", gap: 7, marginTop: 12, flexWrap: "wrap" }}>
                  <button onClick={() => setEditing(e)} className="font-body sd-btn" style={{ background: COLORS.primarySoft, color: COLORS.primary, border: "none", borderRadius: 999, padding: "7px 12px", fontSize: 11.5, fontWeight: 700, cursor: "pointer" }}>
                    <Pencil size={11} style={{ verticalAlign: -1, marginRight: 4 }} />Editar
                  </button>
                  <button onClick={() => setBlockTarget(e)} className="font-body sd-btn" style={{
                    background: "transparent", border: `1px solid ${e.status === "ativo" ? COLORS.terra : COLORS.sage}55`,
                    color: e.status === "ativo" ? COLORS.terra : COLORS.sage, borderRadius: 999, padding: "7px 12px", fontSize: 11.5, fontWeight: 700, cursor: "pointer",
                  }}>
                    {e.status === "ativo" ? "Bloquear" : "Desbloquear"}
                  </button>
                  <button onClick={() => setDeleteTarget(e)} className="font-body sd-btn" style={{ background: "transparent", border: "none", color: COLORS.inkFaint, borderRadius: 999, padding: "7px 8px", fontSize: 11.5, cursor: "pointer" }}>
                    <Trash2 size={13} />
                  </button>
                </div>
              </Card>
            );
          })}
        </div>
      )}

      {editing === "new" && <EstablishmentFormModal plans={plans} onSave={handleCreate} onClose={() => setEditing(null)} />}
      {editing && editing !== "new" && (
        <EstablishmentFormModal
          initial={{
            nome_estabelecimento: editing.nomeEstabelecimento, nome_responsavel: editing.nomeResponsavel,
            whatsapp: editing.whatsapp, email: editing.email, plan_id: editing.planId || "",
          }}
          plans={plans} onSave={handleUpdate} onClose={() => setEditing(null)}
        />
      )}
      {blockTarget && <BlockModal establishment={blockTarget} onConfirm={handleBlockToggle} onClose={() => setBlockTarget(null)} />}
      {deleteTarget && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(36,20,25,0.5)", zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }} onClick={() => setDeleteTarget(null)}>
          <Card className="pop-in" style={{ padding: 22, maxWidth: 340, width: "100%" }} onClick={e => e.stopPropagation()}>
            <h2 className="font-display" style={{ fontSize: 18, margin: "0 0 8px", fontWeight: 600 }}>Excluir {deleteTarget.nomeEstabelecimento}?</h2>
            <p style={{ fontSize: 12.5, color: COLORS.inkSoft, margin: "0 0 16px" }}>Isso apaga permanentemente todos os dados deste estabelecimento (agenda, clientes, serviços). Não pode ser desfeito.</p>
            <div style={{ display: "flex", gap: 8 }}>
              <GhostButton onClick={() => setDeleteTarget(null)} style={{ flex: 1, justifyContent: "center" }}>Cancelar</GhostButton>
              <PrimaryButton onClick={handleDelete} loading={busyId === deleteTarget.id} style={{ flex: 1, background: `linear-gradient(155deg, ${COLORS.terra}, #7A2A2A)` }}>Excluir</PrimaryButton>
            </div>
          </Card>
        </div>
      )}
    </div>
  );
}

function SuperAdminPlans({ plans, saActions }) {
  const [form, setForm] = useState({ nome: "", periodicidade: "mensal", preco: "" });
  const [editingId, setEditingId] = useState(null);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  async function submit(e) {
    e.preventDefault();
    if (!form.nome.trim()) return;
    setSaving(true); setError("");
    try {
      const payload = { nome: form.nome, periodicidade: form.periodicidade, preco: Number(form.preco) || 0 };
      if (editingId) await saActions.updatePlan(editingId, payload);
      else await saActions.addPlan(payload);
      setForm({ nome: "", periodicidade: "mensal", preco: "" });
      setEditingId(null);
    } catch (err) { setError(err.message); }
    finally { setSaving(false); }
  }

  function edit(p) { setEditingId(p.id); setForm({ nome: p.nome, periodicidade: p.periodicidade, preco: String(p.preco) }); }

  return (
    <div className="fade-up">
      <h1 className="font-display" style={{ fontSize: 27, margin: "2px 0 16px", fontWeight: 600 }}>Planos</h1>
      <ErrorBanner message={error} onDismiss={() => setError("")} />
      <Card style={{ padding: 16, marginBottom: 16 }}>
        <SectionLabel>{editingId ? "Editar plano" : "Novo plano"}</SectionLabel>
        <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <input placeholder="Nome do plano" value={form.nome} onChange={e => setForm(f => ({ ...f, nome: e.target.value }))} style={fieldStyle} />
          <select value={form.periodicidade} onChange={e => setForm(f => ({ ...f, periodicidade: e.target.value }))} style={fieldStyle}>
            <option value="mensal">Mensal</option>
            <option value="trimestral">Trimestral</option>
            <option value="semestral">Semestral</option>
            <option value="anual">Anual</option>
          </select>
          <input placeholder="Preço (R$)" type="number" value={form.preco} onChange={e => setForm(f => ({ ...f, preco: e.target.value }))} style={fieldStyle} />
          <PrimaryButton type="submit" loading={saving}><Plus size={15} /> {editingId ? "Salvar" : "Adicionar plano"}</PrimaryButton>
        </form>
      </Card>
      <Card style={{ padding: 4, overflow: "hidden" }}>
        {plans.map((p, i) => (
          <div key={p.id} className="sd-row" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "13px 12px", borderBottom: i < plans.length - 1 ? `1px solid ${COLORS.border}` : "none", borderRadius: 10 }}>
            <div>
              <div style={{ fontWeight: 700, fontSize: 14 }}>{p.nome}</div>
              <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>R$ {p.preco} · {p.periodicidade}</div>
            </div>
            <button onClick={() => edit(p)} className="sd-btn" style={{ background: COLORS.primarySoft, border: "none", borderRadius: 9, width: 32, height: 32, cursor: "pointer", color: COLORS.primary }}>
              <Pencil size={13.5} style={{ display: "block", margin: "0 auto" }} />
            </button>
          </div>
        ))}
      </Card>
    </div>
  );
}

function SuperAdminAnnouncements({ announcements, saActions }) {
  const [title, setTitle] = useState("");
  const [message, setMessage] = useState("");
  const [sending, setSending] = useState(false);
  const [error, setError] = useState("");

  async function send(e) {
    e.preventDefault();
    if (!title.trim() || !message.trim()) return;
    setSending(true); setError("");
    try { await saActions.sendAnnouncement({ title, message }); setTitle(""); setMessage(""); }
    catch (err) { setError(err.message); }
    finally { setSending(false); }
  }

  return (
    <div className="fade-up">
      <h1 className="font-display" style={{ fontSize: 27, margin: "2px 0 16px", fontWeight: 600 }}>Comunicados</h1>
      <ErrorBanner message={error} onDismiss={() => setError("")} />
      <Card style={{ padding: 16, marginBottom: 16 }}>
        <SectionLabel>Novo comunicado (visível para todos os estabelecimentos)</SectionLabel>
        <form onSubmit={send} style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <input placeholder="Título" value={title} onChange={e => setTitle(e.target.value)} style={fieldStyle} />
          <textarea placeholder="Mensagem" value={message} onChange={e => setMessage(e.target.value)} rows={4} style={{ ...fieldStyle, resize: "vertical" }} />
          <PrimaryButton type="submit" loading={sending}>Enviar comunicado</PrimaryButton>
        </form>
      </Card>
      {announcements.map(a => (
        <Card key={a.id} style={{ padding: 14, marginBottom: 10 }}>
          <div style={{ fontWeight: 700, fontSize: 13.5 }}>{a.title}</div>
          <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginTop: 4, lineHeight: 1.5 }}>{a.message}</div>
          <div style={{ fontSize: 10.5, color: COLORS.inkFaint, marginTop: 6 }}>{new Date(a.created_at).toLocaleString("pt-BR")}</div>
        </Card>
      ))}
    </div>
  );
}

function SuperAdminAudit({ logs }) {
  return (
    <div className="fade-up">
      <h1 className="font-display" style={{ fontSize: 27, margin: "2px 0 16px", fontWeight: 600 }}>Auditoria</h1>
      {logs.length === 0 ? (
        <Card style={{ padding: 18, textAlign: "center", color: COLORS.inkFaint, fontSize: 13 }}>Nenhum evento registrado ainda.</Card>
      ) : (
        <Card style={{ padding: 4, overflow: "hidden" }}>
          {logs.map((l, i) => (
            <div key={l.id} className="sd-row" style={{ padding: "12px", borderBottom: i < logs.length - 1 ? `1px solid ${COLORS.border}` : "none" }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5 }}>
                <span style={{ fontWeight: 700 }}>{l.action.toUpperCase()} · {l.entity_type}</span>
                <span style={{ color: COLORS.inkFaint, fontSize: 11 }}>{new Date(l.created_at).toLocaleString("pt-BR")}</span>
              </div>
            </div>
          ))}
        </Card>
      )}
    </div>
  );
}

function SuperAdminApp({ establishments, plans, announcements, logs, saActions, onSignOut }) {
  const [page, setPage] = useState("dashboard");
  return (
    <SuperAdminShell page={page} setPage={setPage} onSignOut={onSignOut}>
      {page === "dashboard" && <SuperAdminDashboard establishments={establishments} />}
      {page === "estabelecimentos" && <SuperAdminEstablishments establishments={establishments} plans={plans} saActions={saActions} />}
      {page === "planos" && <SuperAdminPlans plans={plans} saActions={saActions} />}
      {page === "comunicados" && <SuperAdminAnnouncements announcements={announcements} saActions={saActions} />}
      {page === "auditoria" && <SuperAdminAudit logs={logs} />}
    </SuperAdminShell>
  );
}

/* ---------------------------------------------------------
   ROOT APP — sessão, roteamento público e integração real
   com o Supabase (Auth + PostgREST + RPCs do schema).
--------------------------------------------------------- */
const emptyData = { clients: [], services: [], professionals: [], appointments: [], shoppingList: [], workingHours: [], timeOff: [], rewards: [] };

export default function App() {
  // URL público: ?token=<confirmation_token> (link de confirmação)
  //              ?estab=<slug> (página pública de agendamento)
  const urlParams = useMemo(() => new URLSearchParams(window.location.search), []);
  const urlToken = urlParams.get("token");
  const urlEstab = urlParams.get("estab");

  // Supabase redireciona o link de "esqueci minha senha" com
  // #access_token=...&type=recovery na URL (hash, não query string).
  const hashParams = useMemo(() => new URLSearchParams(window.location.hash.replace(/^#/, "")), []);
  const recoveryToken = hashParams.get("type") === "recovery" ? hashParams.get("access_token") : null;

  const [view, setView] = useState(
    recoveryToken ? "reset-password" : urlToken ? "confirm" : urlEstab ? "client-public" : "landing"
  );

  // Sessão (em memória — sem localStorage, conforme restrição do ambiente)
  const [session, setSession] = useState(null); // { accessToken, userId }
  const [authLoading, setAuthLoading] = useState(false);
  const [authError, setAuthError] = useState("");

  const [establishment, setEstablishment] = useState(null);
  const [data, setData] = useState(emptyData);
  const [dataLoading, setDataLoading] = useState(false);
  const [dataError, setDataError] = useState("");

  const [clientPreview, setClientPreview] = useState(false); // "Ver como cliente" dentro do painel

  const [publicEstablishment, setPublicEstablishment] = useState(null);
  const [publicCatalog, setPublicCatalog] = useState(null);
  const [publicCatalogLoading, setPublicCatalogLoading] = useState(false);
  const [publicCatalogError, setPublicCatalogError] = useState("");

  const [confirmInfo, setConfirmInfo] = useState(null);
  const [confirmLoading, setConfirmLoading] = useState(false);
  const [confirmError, setConfirmError] = useState("");

  // Nível 1 — Super Admin
  const [saSession, setSaSession] = useState(null); // { accessToken, userId }
  const [saEstablishments, setSaEstablishments] = useState([]);
  const [saPlans, setSaPlans] = useState([]);
  const [saAnnouncements, setSaAnnouncements] = useState([]);
  const [saLogs, setSaLogs] = useState([]);
  const [saDataLoading, setSaDataLoading] = useState(false);

  /* ---------------- Carregar dados do tenant autenticado ---------------- */
  const [announcements, setAnnouncements] = useState([]);

  const loadTenantData = useCallback(async (token) => {
    setDataLoading(true); setDataError("");
    try {
      const [profs, servs, cls, appts, shop, ann, wh, to, rw] = await Promise.all([
        rest.select("professionals", "?select=*&order=created_at.asc", token),
        rest.select("services", "?select=*&order=created_at.asc", token),
        rest.select("clients", "?select=*&order=created_at.asc", token),
        rest.select("appointments", "?select=*&order=data.asc,horario.asc", token),
        rest.select("shopping_list_items", "?select=*&order=created_at.asc", token),
        rest.select("announcements", "?select=*&order=created_at.desc&limit=3", token).catch(() => []),
        rest.select("working_hours", "?select=*", token),
        rest.select("time_off", "?select=*&order=start_at.asc", token),
        rest.select("loyalty_rewards", "?select=*&order=custo_pontos.asc", token).catch(() => []),
      ]);
      setData({
        professionals: profs.map(mapProfessional),
        services: servs.map(mapService),
        clients: cls.map(mapClient),
        appointments: appts.map(mapAppointment),
        shoppingList: shop.map(mapShopping),
        workingHours: wh.map(mapWorkingHour),
        timeOff: to.map(mapTimeOff),
        rewards: rw.map(mapReward),
      });
      setAnnouncements(ann);
    } catch (err) {
      setDataError(err.message);
    } finally {
      setDataLoading(false);
    }
  }, []);

  const loadSessionAndData = useCallback(async (accessToken, userId, refreshToken) => {
    const rows = await rest.select("establishments", `?user_id=eq.${userId}&select=*`, accessToken);
    if (!rows || rows.length === 0) {
      throw new Error("Não encontramos um estabelecimento vinculado a esta conta.");
    }
    const est = mapEstablishment(rows[0]);
    setEstablishment(est);
    setSession({ accessToken, userId });
    if (refreshToken) savePersistedSession({ kind: "tenant", accessToken, refreshToken, userId });
    if (est.status === "bloqueado") {
      setView("blocked");
      return;
    }
    await loadTenantData(accessToken);
    setView("admin");
  }, [loadTenantData]);

  /* ---------------- Login / Signup ---------------- */
  async function handleLogin(email, password) {
    setAuthLoading(true); setAuthError("");
    try {
      const resp = await auth.signIn(email, password);
      await loadSessionAndData(resp.access_token, resp.user.id, resp.refresh_token);
    } catch (err) {
      setAuthError(translateAuthError(err));
    } finally {
      setAuthLoading(false);
    }
  }

  async function handleResendConfirmation(email) {
    if (!email) return;
    try { await auth.resendConfirmation(email); } catch { /* silencioso: não vaza se o e-mail existe ou não */ }
  }

  async function handleForgotPassword(email) {
    setView("recover");
  }

  async function handleSendRecovery(email) {
    setAuthLoading(true); setAuthError("");
    try { await auth.recover(email); }
    catch (err) { setAuthError(translateAuthError(err)); }
    finally { setAuthLoading(false); }
  }

  async function handleResetPassword(newPassword) {
    setAuthLoading(true); setAuthError("");
    try {
      await auth.updatePassword(recoveryToken, newPassword);
    } catch (err) {
      setAuthError(translateAuthError(err));
      throw err;
    } finally {
      setAuthLoading(false);
    }
  }

  async function handleSignup(form) {
    setAuthLoading(true); setAuthError("");
    try {
      const resp = await auth.signUp(form.email, form.senha);
      let accessToken = resp.access_token;
      let refreshToken = resp.refresh_token;
      let userId = resp.user?.id || resp.id;

      if (!accessToken) {
        // Confirmação de e-mail pode estar ativada — tenta logar direto como fallback.
        try {
          const signInResp = await auth.signIn(form.email, form.senha);
          accessToken = signInResp.access_token;
          refreshToken = signInResp.refresh_token;
          userId = signInResp.user.id;
        } catch {
          setAuthError("Conta criada! Verifique seu e-mail para confirmar o acesso e depois faça login.");
          setView("login");
          setAuthLoading(false);
          return;
        }
      }

      const slug = `${slugify(form.estabelecimento)}-${Math.random().toString(36).slice(2, 6)}`;
      const [estRow] = await rest.insert("establishments", {
        user_id: userId,
        platform_name: "Secretária Digital",
        nome_estabelecimento: form.estabelecimento,
        nome_responsavel: form.responsavel,
        whatsapp: form.whatsapp.replace(/\D/g, ""),
        email: form.email,
        slug,
      }, accessToken);

      if (!estRow || !estRow.id) {
        throw new Error("O estabelecimento não foi criado. Verifique se o schema-completo.sql foi executado neste projeto Supabase.");
      }

      // Cria a profissional responsável automaticamente para a agenda já funcionar.
      await rest.insert("professionals", {
        establishment_id: estRow.id,
        nome: form.responsavel,
      }, accessToken);

      // Horário de funcionamento padrão (seg-sáb, 09h-19h, almoço 12h-13h)
      // para a agenda inteligente já calcular disponibilidade real.
      await rest.rpc("seed_default_working_hours", { p_establishment_id: estRow.id }, accessToken);

      setEstablishment(mapEstablishment(estRow));
      setSession({ accessToken, userId });
      if (refreshToken) savePersistedSession({ kind: "tenant", accessToken, refreshToken, userId });
      await loadTenantData(accessToken);
      setView("admin");
    } catch (err) {
      setAuthError(translateAuthError(err));
    } finally {
      setAuthLoading(false);
    }
  }

  function handleSignOut() {
    setSession(null);
    setEstablishment(null);
    setData(emptyData);
    setClientPreview(false);
    clearPersistedSession();
    setView("landing");
  }

  /* ---------------- Super Admin: sessão e dados ---------------- */
  const loadSuperAdminData = useCallback(async (token) => {
    setSaDataLoading(true);
    try {
      const [ests, plans, ann, logs] = await Promise.all([
        rest.select("establishments", "?select=*&order=created_at.desc", token),
        rest.select("plans", "?select=*&order=created_at.asc", token),
        rest.select("announcements", "?select=*&order=created_at.desc&limit=50", token),
        rest.select("audit_logs", "?select=*&order=created_at.desc&limit=100", token),
      ]);
      setSaEstablishments(ests.map(mapEstablishment));
      setSaPlans(plans.map(mapPlan));
      setSaAnnouncements(ann);
      setSaLogs(logs);
    } finally {
      setSaDataLoading(false);
    }
  }, []);

  async function handleSuperAdminLogin(email, password) {
    setAuthLoading(true); setAuthError("");
    try {
      const resp = await auth.signIn(email, password);
      const isAdmin = await rest.select("super_admins", `?user_id=eq.${resp.user.id}&select=user_id`, resp.access_token);
      if (!isAdmin || isAdmin.length === 0) {
        throw new Error("Esta conta não tem acesso ao painel administrativo.");
      }
      setSaSession({ accessToken: resp.access_token, userId: resp.user.id });
      if (resp.refresh_token) savePersistedSession({ kind: "superadmin", accessToken: resp.access_token, refreshToken: resp.refresh_token, userId: resp.user.id });
      await loadSuperAdminData(resp.access_token);
      setView("superadmin");
    } catch (err) {
      setAuthError(translateAuthError(err));
    } finally {
      setAuthLoading(false);
    }
  }

  function handleSuperAdminSignOut() {
    setSaSession(null);
    setSaEstablishments([]); setSaPlans([]); setSaAnnouncements([]); setSaLogs([]);
    clearPersistedSession();
    setView("landing");
  }

  const saActions = {
    createEstablishment: async (form) => {
      const signUpResp = await auth.signUp(form.email, form.senha || Math.random().toString(36).slice(2, 10));
      const newUserId = signUpResp.user?.id || signUpResp.id;
      if (!newUserId) throw new Error("Não foi possível criar o login desta cliente.");
      const slug = `${slugify(form.nome_estabelecimento)}-${Math.random().toString(36).slice(2, 6)}`;
      const [estRow] = await rest.insert("establishments", {
        user_id: newUserId,
        platform_name: "Secretária Digital",
        nome_estabelecimento: form.nome_estabelecimento,
        nome_responsavel: form.nome_responsavel,
        whatsapp: (form.whatsapp || "").replace(/\D/g, ""),
        email: form.email,
        plan_id: form.plan_id || null,
        slug,
      }, saSession.accessToken);
      await rest.rpc("seed_default_working_hours", { p_establishment_id: estRow.id }, saSession.accessToken);
      setSaEstablishments(list => [mapEstablishment(estRow), ...list]);
    },
    updateEstablishment: async (id, form) => {
      const [row] = await rest.update("establishments", `?id=eq.${id}`, {
        nome_estabelecimento: form.nome_estabelecimento,
        nome_responsavel: form.nome_responsavel,
        whatsapp: (form.whatsapp || "").replace(/\D/g, ""),
        plan_id: form.plan_id || null,
      }, saSession.accessToken);
      setSaEstablishments(list => list.map(e => e.id === id ? mapEstablishment(row) : e));
    },
    setStatus: async (id, status, reason) => {
      const [row] = await rest.update("establishments", `?id=eq.${id}`, {
        status, blocked_reason: reason, blocked_at: status === "bloqueado" ? new Date().toISOString() : null,
      }, saSession.accessToken);
      setSaEstablishments(list => list.map(e => e.id === id ? mapEstablishment(row) : e));
    },
    removeEstablishment: async (id) => {
      await rest.remove("establishments", `?id=eq.${id}`, saSession.accessToken);
      setSaEstablishments(list => list.filter(e => e.id !== id));
    },
    addPlan: async (payload) => {
      const [row] = await rest.insert("plans", payload, saSession.accessToken);
      setSaPlans(list => [...list, mapPlan(row)]);
    },
    updatePlan: async (id, payload) => {
      const [row] = await rest.update("plans", `?id=eq.${id}`, payload, saSession.accessToken);
      setSaPlans(list => list.map(p => p.id === id ? mapPlan(row) : p));
    },
    sendAnnouncement: async ({ title, message }) => {
      const [row] = await rest.insert("announcements", { title, message, created_by: saSession.userId }, saSession.accessToken);
      setSaAnnouncements(list => [row, ...list]);
    },
  };

  /* ---------------- Ações do painel (CRUD real) ---------------- */
  const actions = {
    setAppointmentStatus: async (id, status) => {
      const [row] = await rest.update("appointments", `?id=eq.${id}`, { status }, session.accessToken);
      setData(d => ({ ...d, appointments: d.appointments.map(a => a.id === id ? mapAppointment(row) : a) }));
    },
    addProfessional: async (payload) => {
      const [row] = await rest.insert("professionals", { ...payload, establishment_id: establishment.id }, session.accessToken);
      setData(d => ({ ...d, professionals: [...d.professionals, mapProfessional(row)] }));
    },
    updateProfessional: async (id, payload) => {
      const [row] = await rest.update("professionals", `?id=eq.${id}`, payload, session.accessToken);
      setData(d => ({ ...d, professionals: d.professionals.map(p => p.id === id ? mapProfessional(row) : p) }));
    },
    removeProfessional: async (id) => {
      await rest.remove("professionals", `?id=eq.${id}`, session.accessToken);
      setData(d => ({ ...d, professionals: d.professionals.filter(p => p.id !== id) }));
    },
    updateClient: async (id, payload) => {
      const [row] = await rest.update("clients", `?id=eq.${id}`, payload, session.accessToken);
      setData(d => ({ ...d, clients: d.clients.map(c => c.id === id ? mapClient(row) : c) }));
    },
    createManualAppointment: async (params) => {
      // Reaproveita a mesma RPC do agendamento público (create_booking):
      // garante a mesma verificação de disponibilidade e a mesma trava
      // anti-conflito, mesmo para um agendamento criado manualmente aqui.
      await rest.rpc("create_booking", params, session.accessToken);
      await loadTenantData(session.accessToken);
    },
    addReward: async (payload) => {
      const [row] = await rest.insert("loyalty_rewards", { ...payload, establishment_id: establishment.id }, session.accessToken);
      setData(d => ({ ...d, rewards: [...d.rewards, mapReward(row)] }));
    },
    updateReward: async (id, payload) => {
      const [row] = await rest.update("loyalty_rewards", `?id=eq.${id}`, payload, session.accessToken);
      setData(d => ({ ...d, rewards: d.rewards.map(r => r.id === id ? mapReward(row) : r) }));
    },
    removeReward: async (id) => {
      await rest.remove("loyalty_rewards", `?id=eq.${id}`, session.accessToken);
      setData(d => ({ ...d, rewards: d.rewards.filter(r => r.id !== id) }));
    },
    redeemReward: async (clientId, rewardId) => {
      await rest.rpc("redeem_loyalty_reward", { p_client_id: clientId, p_reward_id: rewardId }, session.accessToken);
      await loadTenantData(session.accessToken);
    },
    // Importação rápida em blocos. Se um bloco falhar, tenta os contatos
    // daquele bloco individualmente para mostrar o erro real sem perder
    // os demais contatos válidos.
    addClient: async (payload) => {
      const [row] = await rest.insert("clients", { ...payload, establishment_id: establishment.id }, session.accessToken);
      setData(d => ({ ...d, clients: [...d.clients, mapClient(row)] }));
    },
    importClients: async (rows) => {
      const token = session.accessToken;
      const seen = new Set(data.clients.map(c => normalizeImportedPhone(c.whatsapp)));
      const pending = [];
      let created = 0, skipped = 0, failed = 0, firstError = "";
      for (const row of rows) {
        const whatsapp = normalizeImportedPhone(row.whatsapp);
        const nome = (row.nome || "").trim();
        if (!nome || !whatsapp || seen.has(whatsapp)) { skipped++; continue; }
        seen.add(whatsapp);
        const contact = { establishment_id: establishment.id, nome, whatsapp };
        const nascimento = normalizeImportedDate(row.data_nascimento);
        // Não envia a coluna vazia: nome e telefone bastam para criar a cliente.
        if (nascimento) contact.data_nascimento = nascimento;
        pending.push(contact);
      }
      for (let i = 0; i < pending.length; i += 100) {
        const batch = pending.slice(i, i + 100);
        try {
          const inserted = await rest.insert("clients", batch, token);
          created += Array.isArray(inserted) ? inserted.length : batch.length;
        } catch (batchError) {
          for (const contact of batch) {
            try { await rest.insert("clients", contact, token); created++; }
            catch (err) { failed++; if (!firstError) firstError = err.message || "Falha ao salvar contato"; }
          }
        }
      }
      await loadTenantData(token);
      return { created, skipped, failed, firstError };
    },
    saveWorkingHours: async (professionalId, days) => {
      const token = session.accessToken;
      const existing = data.workingHours.filter(w => (w.professionalId || null) === (professionalId || null));
      const ops = days.map(day => {
        const existingRow = existing.find(w => w.weekday === day.weekday);
        if (day.open) {
          const payload = {
            establishment_id: establishment.id,
            professional_id: professionalId,
            weekday: day.weekday,
            start_time: day.start,
            end_time: day.end,
            break_start: day.hasBreak ? day.breakStart : null,
            break_end: day.hasBreak ? day.breakEnd : null,
          };
          return existingRow
            ? rest.update("working_hours", `?id=eq.${existingRow.id}`, payload, token)
            : rest.insert("working_hours", payload, token);
        }
        return existingRow ? rest.remove("working_hours", `?id=eq.${existingRow.id}`, token) : Promise.resolve(null);
      });
      await Promise.all(ops);
      const profFilter = professionalId ? `professional_id=eq.${professionalId}` : `professional_id=is.null`;
      const rows = await rest.select("working_hours", `?establishment_id=eq.${establishment.id}&${profFilter}&select=*`, token);
      setData(d => ({
        ...d,
        workingHours: [
          ...d.workingHours.filter(w => (w.professionalId || null) !== (professionalId || null)),
          ...rows.map(mapWorkingHour),
        ],
      }));
    },
    addTimeOff: async (payload) => {
      const [row] = await rest.insert("time_off", { ...payload, establishment_id: establishment.id }, session.accessToken);
      setData(d => ({ ...d, timeOff: [...d.timeOff, mapTimeOff(row)] }));
    },
    removeTimeOff: async (id) => {
      await rest.remove("time_off", `?id=eq.${id}`, session.accessToken);
      setData(d => ({ ...d, timeOff: d.timeOff.filter(t => t.id !== id) }));
    },
    addService: async (payload) => {
      const [row] = await rest.insert("services", { ...payload, establishment_id: establishment.id }, session.accessToken);
      setData(d => ({ ...d, services: [...d.services, mapService(row)] }));
    },
    updateService: async (id, payload) => {
      const [row] = await rest.update("services", `?id=eq.${id}`, payload, session.accessToken);
      setData(d => ({ ...d, services: d.services.map(s => s.id === id ? mapService(row) : s) }));
    },
    removeService: async (id) => {
      await rest.remove("services", `?id=eq.${id}`, session.accessToken);
      setData(d => ({ ...d, services: d.services.filter(s => s.id !== id) }));
    },
    addShoppingItem: async (payload) => {
      const [row] = await rest.insert("shopping_list_items", { ...payload, establishment_id: establishment.id }, session.accessToken);
      setData(d => ({ ...d, shoppingList: [...d.shoppingList, mapShopping(row)] }));
    },
    toggleShoppingItem: async (id, comprado) => {
      const [row] = await rest.update("shopping_list_items", `?id=eq.${id}`, { comprado }, session.accessToken);
      setData(d => ({ ...d, shoppingList: d.shoppingList.map(i => i.id === id ? mapShopping(row) : i) }));
    },
    removeShoppingItem: async (id) => {
      await rest.remove("shopping_list_items", `?id=eq.${id}`, session.accessToken);
      setData(d => ({ ...d, shoppingList: d.shoppingList.filter(i => i.id !== id) }));
    },
    updateEstablishment: async (payload) => {
      const [row] = await rest.update("establishments", `?id=eq.${establishment.id}`, payload, session.accessToken);
      setEstablishment(mapEstablishment(row));
    },
  };

  /* ---------------- Link de confirmação (?token=...) ---------------- */
  useEffect(() => {
    if (view !== "confirm" || !urlToken) return;
    setConfirmLoading(true); setConfirmError("");
    rest.rpc("get_appointment_by_token", { p_token: urlToken })
      .then(rows => setConfirmInfo(rows && rows[0] ? rows[0] : null))
      .catch(err => setConfirmError(err.message))
      .finally(() => setConfirmLoading(false));
  }, [view, urlToken]);

  async function resolveToken(token, status) {
    await rest.rpc("resolve_appointment_by_token", { p_token: token, p_new_status: status });
  }

  /* ---------------- Página pública de agendamento (?estab=slug) ---------------- */
  useEffect(() => {
    if (view !== "client-public" || !urlEstab) return;
    (async () => {
      setPublicCatalogLoading(true); setPublicCatalogError("");
      try {
        const rows = await rest.select("establishments", `?slug=eq.${encodeURIComponent(urlEstab)}&select=id,platform_name,nome_estabelecimento,wa_template,slug`);
        if (!rows || rows.length === 0) throw new Error("Estabelecimento não encontrado.");
        const est = mapEstablishment(rows[0]);
        setPublicEstablishment(est);
        const [profs, servs] = await Promise.all([
          rest.select("professionals", `?establishment_id=eq.${est.id}&ativo=eq.true&select=*`),
          rest.select("services", `?establishment_id=eq.${est.id}&ativo=eq.true&select=*`),
        ]);
        setPublicCatalog({ professionals: profs.map(mapProfessional), services: servs.map(mapService) });
      } catch (err) {
        setPublicCatalogError(err.message);
      } finally {
        setPublicCatalogLoading(false);
      }
    })();
  }, [view, urlEstab]);

  async function bookPublic(params) {
    await rest.rpc("create_booking", params);
  }

  /* ---------------- Restaura sessão salva ao atualizar a página ---------------- */
  const [sessionRestoring, setSessionRestoring] = useState(() => {
    if (recoveryToken || urlToken || urlEstab) return false;
    return !!loadPersistedSession();
  });

  useEffect(() => {
    if (!sessionRestoring) return;
    const saved = loadPersistedSession();
    if (!saved) { setSessionRestoring(false); return; }

    async function restoreWithToken(accessToken, refreshToken, userId) {
      if (saved.kind === "superadmin") {
        const isAdmin = await rest.select("super_admins", `?user_id=eq.${userId}&select=user_id`, accessToken);
        if (!isAdmin || isAdmin.length === 0) throw new Error("Sem acesso de administrador");
        savePersistedSession({ kind: "superadmin", accessToken, refreshToken, userId });
        setSaSession({ accessToken, userId });
        await loadSuperAdminData(accessToken);
        setView("superadmin");
      } else {
        await loadSessionAndData(accessToken, userId, refreshToken);
      }
    }

    (async () => {
      try {
        await restoreWithToken(saved.accessToken, saved.refreshToken, saved.userId);
      } catch {
        // Token de acesso pode ter expirado — tenta renovar com o refresh token.
        if (saved.refreshToken) {
          try {
            const resp = await auth.refresh(saved.refreshToken);
            await restoreWithToken(resp.access_token, resp.refresh_token, resp.user?.id || saved.userId);
          } catch {
            clearPersistedSession();
          }
        } else {
          clearPersistedSession();
        }
      } finally {
        setSessionRestoring(false);
      }
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  /* ---------------- Link de confirmação aberto de dentro do painel ---------------- */
  const [previewLinkToken, setPreviewLinkToken] = useState(null);

  /* ---------------- Render ---------------- */
  if (sessionRestoring) {
    return (
      <div style={{ minHeight: "100vh", background: COLORS.bg }}>
        {FONTS}
        <FullScreenLoader label="Carregando sua sessão..." />
      </div>
    );
  }
  if (view === "confirm") {
    return (
      <div style={{ minHeight: "100vh", background: COLORS.bg }}>
        {FONTS}
        <ConfirmationLinkPage token={urlToken} info={confirmInfo} loading={confirmLoading} error={confirmError} onResolve={resolveToken} />
      </div>
    );
  }

  if (previewLinkToken) {
    return (
      <div style={{ minHeight: "100vh", background: COLORS.bg }}>
        {FONTS}
        <PreviewLinkModal token={previewLinkToken} onClose={() => setPreviewLinkToken(null)} onResolve={resolveToken} />
      </div>
    );
  }

  if (view === "client-public") {
    let body;
    if (publicCatalogError && !publicEstablishment) {
      body = <div style={{ padding: 40, textAlign: "center" }}><ErrorBanner message={publicCatalogError} /></div>;
    } else if (!publicEstablishment) {
      body = <FullScreenLoader label="Carregando..." />;
    } else {
      body = (
        <ClientBooking
          establishment={publicEstablishment}
          catalog={publicCatalog}
          catalogLoading={publicCatalogLoading}
          catalogError={publicCatalogError}
          onBook={bookPublic}
        />
      );
    }
    return <div style={{ minHeight: "100vh", background: COLORS.bg }}>{FONTS}{body}</div>;
  }

  let body;
  if (view === "landing") {
    body = <Landing onCreateAccount={() => setView("signup")} onEnter={() => setView("login")} onSuperAdmin={() => setView("superadmin-login")} />;
  } else if (view === "login") {
    body = (
      <LoginForm
        loading={authLoading} error={authError} onLogin={handleLogin}
        onBack={() => setView("landing")} onGoSignup={() => setView("signup")}
        onForgotPassword={handleForgotPassword} onResendConfirmation={handleResendConfirmation}
      />
    );
  } else if (view === "signup") {
    body = <Signup loading={authLoading} error={authError} onCreate={handleSignup} onBack={() => setView("landing")} onGoLogin={() => setView("login")} />;
  } else if (view === "superadmin-login") {
    body = (
      <SuperAdminLogin
        loading={authLoading} error={authError} onLogin={handleSuperAdminLogin}
        onBack={() => setView("landing")} onForgotPassword={handleForgotPassword}
      />
    );
  } else if (view === "recover") {
    body = <RecoverForm loading={authLoading} error={authError} onSend={handleSendRecovery} onBack={() => setView("landing")} />;
  } else if (view === "reset-password") {
    body = <ResetPasswordForm loading={authLoading} error={authError} onReset={handleResetPassword} />;
  } else if (view === "superadmin") {
    body = saDataLoading && saEstablishments.length === 0
      ? <FullScreenLoader label="Carregando painel administrativo..." />
      : (
        <SuperAdminApp
          establishments={saEstablishments}
          plans={saPlans}
          announcements={saAnnouncements}
          logs={saLogs}
          saActions={saActions}
          onSignOut={handleSuperAdminSignOut}
        />
      );
  } else if (view === "blocked") {
    body = <BlockedScreen establishment={establishment} onSignOut={handleSignOut} />;
  } else if (view === "admin") {
    if (dataLoading && data === emptyData) {
      body = <FullScreenLoader label="Carregando seu painel..." />;
    } else if (clientPreview) {
      const previewCatalog = {
        services: data.services.filter(s => s.ativo !== false),
        professionals: data.professionals.filter(p => p.ativo !== false),
      };
      body = (
        <ClientBooking
          establishment={establishment}
          catalog={previewCatalog}
          catalogLoading={false}
          catalogError=""
          onBook={bookPublic}
          footer={
            <button onClick={() => setClientPreview(false)} className="font-body sd-btn" style={{ background: "transparent", border: "none", color: COLORS.inkFaint, fontSize: 12, cursor: "pointer", fontWeight: 600 }}>
              ← Voltar ao painel da profissional
            </button>
          }
        />
      );
    } else {
      body = (
        <>
          {dataError && <div style={{ padding: "10px 16px 0" }}><ErrorBanner message={dataError} onDismiss={() => setDataError("")} /></div>}
          <AdminApp
            data={data}
            establishment={establishment}
            actions={actions}
            announcements={announcements}
            onExitToClientDemo={() => setClientPreview(true)}
            onOpenLink={(token) => setPreviewLinkToken(token)}
            onSignOut={handleSignOut}
          />
        </>
      );
    }
  }

  return (
    <div style={{ minHeight: "100vh", background: COLORS.bg }}>
      {FONTS}
      {body}
    </div>
  );
}

/* Simula a abertura do link único direto de dentro do painel,
   reutilizando a mesma tela pública/RPC que a cliente veria. */
function PreviewLinkModal({ token, onClose, onResolve }) {
  const [info, setInfo] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState("");

  useEffect(() => {
    setLoading(true); setError("");
    rest.rpc("get_appointment_by_token", { p_token: token })
      .then(rows => setInfo(rows && rows[0] ? rows[0] : null))
      .catch(err => setError(err.message))
      .finally(() => setLoading(false));
  }, [token]);

  return (
    <ConfirmationLinkPage token={token} info={info} loading={loading} error={error} onResolve={onResolve} onClose={onClose} />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
