   SUPABASE — DATA LAYER
   Talks to the project directly via fetch + PostgREST/Auth
   REST endpoints (no supabase-js dependency needed).
   RLS on the database enforces tenant isolation for the
   admin ("owner_all") policies; public reads for the client
   booking flow and the confirmation-link flow go through the

const SUPABASE_URL = "https://wvivyhphectbhpxksnrf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_iGlAH_Yphxxkaa39Vzdm4Q_kw_wiF4M";

function authHeaders(token) {
  return {
    apikey: SUPABASE_ANON_KEY,
    Authorization: `Bearer ${token || SUPABASE_ANON_KEY}`,
    "Content-Type": "application/json",
  };
}

async function sbRequest(path, { method = "GET", token, body, prefer } = {}) {
  const headers = authHeaders(token);
  if (prefer) headers["Prefer"] = prefer;

  let res;
  try {
    res = await fetch(`${SUPABASE_URL}${path}`, {
      method,
      headers,
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
  } catch (networkErr) {
    console.error("[Supabase] falha de rede em", path, networkErr);
    throw new Error("Não foi possível conectar ao Supabase. Confira a URL do projeto, a chave anônima e sua conexão.");
  }

  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }

  if (!res.ok) {
    const msg =
      (data && (data.error_description || data.msg || data.message || data.error)) ||
      `Erro ${res.status}`;
    const finalMsg = typeof msg === "string" ? msg : "Erro inesperado";
    console.error("[Supabase]", method, path, res.status, data);
    throw new Error(finalMsg);
  }
  return data;
}

// Sessão persistida no navegador, para continuar logada depois de
// atualizar a página. (Fora do preview do Claude, localStorage

const SESSION_KEY = "sd_session_v1";
function savePersistedSession(obj) {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(obj)); } catch { /* localStorage indisponível */ }
}
function loadPersistedSession() {
  try { const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; } catch { return null; }
}
function clearPersistedSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch { /* noop */ }
}

function translateAuthError(err) {
  console.error("[Auth]", err);
  const msg = (err && err.message) || "";
  if (/email not confirmed/i.test(msg)) return "email_not_confirmed";
  if (/invalid login credentials/i.test(msg)) return "E-mail ou senha incorretos.";
  if (/user already registered|already been registered/i.test(msg)) return "Já existe uma conta com este e-mail. Tente entrar ou recuperar a senha.";
  if (/password.*at least|password.*short/i.test(msg)) return "A senha precisa ter pelo menos 6 caracteres.";
  return msg || "Algo deu errado. Tente novamente.";
}

function fmtDate(iso) {

}
const WEEKDAYS = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const WEEKDAY_FULL = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
function weekday(iso) {
  const d = new Date(iso + "T12:00:00");
  return WEEKDAYS[d.getDay()];
}
function slugify(str) {
  return (str || "")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-|-$)/g, "")
    .slice(0, 40) || "estabelecimento";
}

const MONTH_NAMES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
function todayIso() { return new Date().toISOString().slice(0, 10); }
function ymd(y, m, d) { return `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`; }
function addMonths(year, month, delta) {
  const d = new Date(year, month + delta, 1);
  return { year: d.getFullYear(), month: d.getMonth() };
}
function monthMatrix(year, month) {
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(ymd(year, month, d));
  while (cells.length % 7 !== 0) cells.push(null);
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  return weeks;
}

/* Calendário mensal reutilizável (estilo Google Calendar): navega
   entre meses, respeita uma janela mín/máx de datas selecionáveis,
   e aceita marcações coloridas por dia via getDayMeta(dateStr). */
function MonthCalendar({ year, month, onNavigate, selectedDate, onSelectDate, minDate, maxDate, getDayMeta }) {
  const weeks = useMemo(() => monthMatrix(year, month), [year, month]);
  const today = todayIso();
  const canGoPrev = !minDate || addMonths(year, month, -1).year * 100 + addMonths(year, month, -1).month >= (Number(minDate.slice(0,4)) * 100 + (Number(minDate.slice(5,7)) - 1));
  const canGoNext = !maxDate || (year * 100 + month) < (Number(maxDate.slice(0,4)) * 100 + (Number(maxDate.slice(5,7)) - 1)) || (year === Number(maxDate.slice(0,4)) && month === Number(maxDate.slice(5,7)) - 1);

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
        <button onClick={() => canGoPrev && onNavigate(-1)} disabled={!canGoPrev} className="sd-btn" style={{
          background: COLORS.bgAlt, border: "none", borderRadius: 9, width: 30, height: 30, cursor: canGoPrev ? "pointer" : "not-allowed",
          color: canGoPrev ? COLORS.ink : COLORS.inkFaint, display: "flex", alignItems: "center", justifyContent: "center",
        }}><ChevronLeft size={15} /></button>
        <span className="font-display" style={{ fontSize: 15.5, fontWeight: 600 }}>{MONTH_NAMES[month]} {year}</span>
        <button onClick={() => canGoNext && onNavigate(1)} disabled={!canGoNext} className="sd-btn" style={{
          background: COLORS.bgAlt, border: "none", borderRadius: 9, width: 30, height: 30, cursor: canGoNext ? "pointer" : "not-allowed",
          color: canGoNext ? COLORS.ink : COLORS.inkFaint, display: "flex", alignItems: "center", justifyContent: "center",
        }}><ChevronRight size={15} /></button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 2, marginBottom: 4 }}>
        {WEEKDAYS.map(w => (
          <div key={w} className="font-body" style={{ textAlign: "center", fontSize: 10, fontWeight: 700, color: COLORS.inkFaint, textTransform: "uppercase", padding: "2px 0" }}>{w}</div>
        ))}
      </div>

      {weeks.map((week, wi) => (
        <div key={wi} style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 2, marginBottom: 2 }}>
          {week.map((dateStr, di) => {
            if (!dateStr) return <div key={di} />;
            const disabled = (minDate && dateStr < minDate) || (maxDate && dateStr > maxDate);
            const isToday = dateStr === today;
            const isSelected = dateStr === selectedDate;
            const meta = getDayMeta ? getDayMeta(dateStr) || {} : {};
            const dayNum = Number(dateStr.slice(8, 10));
            return (
              <button
                key={di}
                disabled={disabled}
                onClick={() => onSelectDate(dateStr)}
                className="sd-btn"
                style={{
                  position: "relative", aspectRatio: "1", border: "none", borderRadius: 10, cursor: disabled ? "not-allowed" : "pointer",
                  background: isSelected ? `linear-gradient(155deg, ${COLORS.primary}, ${COLORS.primaryDeep})` : meta.bg || "transparent",
                  color: isSelected ? "#fff" : disabled ? COLORS.inkFaint : (meta.fg || COLORS.ink),
                  fontWeight: isToday ? 800 : 600, fontSize: 12.5, opacity: disabled ? 0.35 : 1,
                  display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 2,
                  outline: isToday && !isSelected ? `1.5px solid ${COLORS.primary}55` : "none",
                }}
              >
                {dayNum}
                {meta.dot && !isSelected && <span style={{ width: 4, height: 4, borderRadius: "50%", background: meta.dot }} />}
              </button>
            );
          })}
        </div>
      ))}
    </div>
  );
}

function LoginForm({ onLogin, onBack, onGoSignup, onForgotPassword, onResendConfirmation, loading, error }) {
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [resending, setResending] = useState(false);
  const [resent, setResent] = useState(false);

  async function resend() {
    setResending(true);
    try { await onResendConfirmation(email); setResent(true); } finally { setResending(false); }
  }

  return (
    <div className="font-body pop-in" style={{ minHeight: "100%", background: COLORS.heroGradient, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <Card style={{ padding: 30, maxWidth: 380, width: "100%", boxShadow: COLORS.shadowLg }}>
        <div style={{ textAlign: "center", marginBottom: 24 }}>
          <Wordmark name="Secretária Digital" size={17} />
          <h1 className="font-display" style={{ fontSize: 25, margin: "14px 0 5px", fontWeight: 600 }}>
            Bem-vinda de <span className="font-display-italic">volta</span>
          </h1>
          <p style={{ fontSize: 13, color: COLORS.inkSoft, margin: 0 }}>Entre com o e-mail e senha do seu painel.</p>
        </div>

        {error === "email_not_confirmed" ? (
          <div className="pop-in" style={{ background: COLORS.amberSoft, color: "#7A5610", borderRadius: 12, padding: "12px 13px", fontSize: 12.5, marginBottom: 14, lineHeight: 1.5 }}>
            Seu e-mail ainda não foi confirmado. Verifique sua caixa de entrada (e o spam).
            {resent ? (
              <div style={{ marginTop: 8, fontWeight: 700 }}>E-mail reenviado ✅</div>
            ) : (
              <button onClick={resend} disabled={resending || !email} className="font-body sd-btn" style={{
                marginTop: 8, background: "none", border: "none", color: "#7A5610", fontWeight: 700, fontSize: 12.5,
                cursor: "pointer", textDecoration: "underline", padding: 0,
              }}>
                {resending ? "Reenviando..." : "Reenviar e-mail de confirmação"}
              </button>
            )}
          </div>
        ) : (
          <ErrorBanner message={error} />
        )}

        <form onSubmit={(e) => { e.preventDefault(); onLogin(email, senha); }} style={{ display: "flex", flexDirection: "column", gap: 11 }}>
          <input placeholder="E-mail" type="email" style={fieldStyle} value={email} onChange={e => setEmail(e.target.value)} />
          <input placeholder="Senha" type="password" style={fieldStyle} value={senha} onChange={e => setSenha(e.target.value)} />
          <PrimaryButton type="submit" loading={loading} style={{ width: "100%", marginTop: 6 }}>
            Entrar <ChevronRight size={15} />
          </PrimaryButton>
        </form>
        <div style={{ textAlign: "center", marginTop: 16, display: "flex", flexDirection: "column", gap: 8 }}>
          <button onClick={() => onForgotPassword(email)} className="font-body sd-btn" style={{ background: "none", border: "none", color: COLORS.inkSoft, fontSize: 12.5, fontWeight: 700, cursor: "pointer" }}>
            Esqueci minha senha
          </button>
          <button onClick={onGoSignup} className="font-body sd-btn" style={{ background: "none", border: "none", color: COLORS.primary, fontSize: 12.5, fontWeight: 700, cursor: "pointer" }}>
            Ainda não tem conta? Criar agora
          </button>
          <button onClick={onBack} className="font-body sd-btn" style={{ background: "none", border: "none", color: COLORS.inkFaint, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>
            ← Voltar
          </button>
        </div>
      </Card>
    </div>
  );
}

function ResetPasswordForm({ onReset, loading, error }) {
  const [senha, setSenha] = useState("");
  const [confirmar, setConfirmar] = useState("");
  const [done, setDone] = useState(false);
  const mismatch = confirmar.length > 0 && senha !== confirmar;

  async function submit(e) {
    e.preventDefault();
    if (senha.length < 6 || mismatch) return;
    await onReset(senha);
    setDone(true);
  }

  return (
    <div className="font-body pop-in" style={{ minHeight: "100%", background: COLORS.heroGradient, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <Card style={{ padding: 30, maxWidth: 380, width: "100%", boxShadow: COLORS.shadowLg }}>
        <div style={{ textAlign: "center", marginBottom: 24 }}>
          <Wordmark name="Secretária Digital" size={17} />
          <h1 className="font-display" style={{ fontSize: 23, margin: "14px 0 5px", fontWeight: 600 }}>Criar nova senha</h1>
        </div>
        {done ? (
          <div className="pop-in" style={{ background: COLORS.sageSoft, color: COLORS.sage, borderRadius: 12, padding: "14px", fontSize: 13, fontWeight: 600, textAlign: "center" }}>
            Senha atualizada! Você já pode fechar esta aba e entrar normalmente com a senha nova.
          </div>
        ) : (
          <>
            <ErrorBanner message={error} />
            <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 11 }}>
              <input placeholder="Nova senha (mín. 6 caracteres)" type="password" style={fieldStyle} value={senha} onChange={e => setSenha(e.target.value)} />
              <input placeholder="Confirmar nova senha" type="password" style={fieldStyle} value={confirmar} onChange={e => setConfirmar(e.target.value)} />
              {mismatch && <div style={{ fontSize: 12, color: COLORS.terra }}>As senhas não coincidem.</div>}
              <PrimaryButton type="submit" loading={loading} disabled={senha.length < 6 || mismatch} style={{ width: "100%", marginTop: 6 }}>
                Salvar nova senha
              </PrimaryButton>
            </form>
          </>
        )}
      </Card>
    </div>
  );
}

  { text: "Porque para Deus nada é impossível.", ref: "Lucas 1:37" },
  { text: "Tudo posso naquele que me fortalece.", ref: "Filipenses 4:13" },
  { text: "Entrega o teu caminho ao Senhor, confia nele, e o mais Ele fará.", ref: "Salmos 37:5" },

  { text: "Confia no Senhor de todo o teu coração, e não te estribes no teu próprio entendimento.", ref: "Provérbios 3:5" },
  { text: "Alegrai-vos sempre.", ref: "1 Tessalonicenses 5:16" },
  { text: "Bem-aventurados os que semeiam com lágrimas, pois com alegria colherão.", ref: "Salmos 126:5" },
  { text: "Renovai o espírito do vosso entendimento.", ref: "Efésios 4:23" },
  { text: "O Senhor é a minha força e o meu escudo; nele confiou o meu coração, e fui socorrido.", ref: "Salmos 28:7" },
  { text: "A persistência é o caminho do êxito.", ref: "Charles Chaplin" },
  { text: "Grandes coisas nunca vêm de zonas de conforto.", ref: null },
  { text: "O êxito é a soma de pequenos esforços repetidos todos os dias.", ref: "Robert Collier" },
  { text: "Feliz é aquele que transfere o que sabe e aprende o que ensina.", ref: "Cora Coralina" },
  { text: "Cada cliente atendido com carinho é uma semente plantada.", ref: null },
];
function todaysQuote(establishmentId) {
  const welcome = { text: "Tudo o que fizerem, façam de todo o coração, como para o Senhor.", ref: "Colossenses 3:23" };
  const key = `sd_welcome_quote_seen_${establishmentId || "default"}`;
  try {
    if (!localStorage.getItem(key)) {
      localStorage.setItem(key, "1");
      return welcome;
    }
  } catch { return welcome; }
  const start = new Date(new Date().getFullYear(), 0, 0);
  const dayOfYear = Math.floor((new Date() - start) / 86400000);
  return DAILY_QUOTES[dayOfYear % DAILY_QUOTES.length];
}
const WORK_PRAYER = "Senhor, agradeço por mais um dia. Usa a minha vida e o meu trabalho para levar o teu amor às pessoas. Ensina-me a servir com alegria, paciência e excelência, sem reclamação, mesmo diante das dificuldades. Que minhas palavras acolham, minhas mãos abençoem e minhas atitudes revelem o teu nome. Dá-me sabedoria para crescer e um coração sempre disposto a aprender. Em nome de Jesus, amém.";

function computeEarnings(appointments, services, range) {
  const priceMap = Object.fromEntries(services.map(s => [s.id, s.preco]));
  const now = new Date();
  const todayStr = todayIso();
  return appointments
    .filter(a => a.status !== "cancelado")
    .filter(a => {
      if (range === "day") return a.data === todayStr;
      const d = new Date(a.data + "T00:00:00");
      if (range === "week") {
        const start = new Date(now); start.setHours(0, 0, 0, 0); start.setDate(now.getDate() - now.getDay());
        const end = new Date(start); end.setDate(start.getDate() + 7);
        return d >= start && d < end;
      }
      if (range === "month") return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
      if (range === "year") return d.getFullYear() === now.getFullYear();
      return false;
    })
    .reduce((sum, a) => sum + (priceMap[a.servicoId] || 0), 0);
}
function fmtBRL(n) {
  return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
}

function Dashboard({ data, setPage, announcements = [], establishment }) {
  const { appointments, clients, shoppingList, services, timeOff = [] } = data;
  const todayIsoStr = todayIso();
  const tomorrowIso = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
  const [showPrayer, setShowPrayer] = useState(false);
  const [birthdayClient, setBirthdayClient] = useState(null);
  const quote = useMemo(() => todaysQuote(establishment?.id), [establishment?.id]);

  const todaysBirthdays = useMemo(() => {
    const [, mm, dd] = todayIsoStr.split("-");
    return clients.filter(c => c.dataNascimento && c.dataNascimento.slice(5, 10) === `${mm}-${dd}`);
  }, [clients, todayIsoStr]);

  const todaySummary = useMemo(() => {
    const todayAppts = appointments.filter(a => a.data === todayIsoStr && a.status !== "cancelado");
    const unconfirmed = todayAppts.filter(a => a.status === "aguardando").length;
    const dayStart = new Date(todayIsoStr + "T00:00:00");
    const dayEnd = new Date(todayIsoStr + "T23:59:59.999");
    const blocks = timeOff.filter(t => new Date(t.startAt) <= dayEnd && new Date(t.endAt) >= dayStart).length;
    return { total: todayAppts.length, unconfirmed, blocks };
  }, [appointments, timeOff, todayIsoStr]);

  const alerts = useMemo(() => {
    const list = [];
    const awaitingTomorrow = appointments.filter(a => a.data === tomorrowIso && a.status === "aguardando");
    if (awaitingTomorrow.length > 0) {
      list.push({ icon: Bell, text: `Você possui ${awaitingTomorrow.length} cliente${awaitingTomorrow.length > 1 ? "s" : ""} que ainda não confirmou o horário de amanhã.`, tone: "amber" });
    }
    const todayAppts = appointments.filter(a => a.data === todayIsoStr && a.status !== "cancelado").sort((a, b) => a.horario.localeCompare(b.horario));
    todayAppts.slice(0, 1).forEach(a => {
      const c = clients.find(cl => cl.id === a.clienteId);
      if (c) list.push({ icon: Clock, text: `Cliente ${c.nome.split(" ")[0]} tem atendimento hoje às ${a.horario}.`, tone: "primary" });
    });
    const riskClients = clients.filter(c => c.historicoCancelamento && appointments.some(a => a.clienteId === c.id && a.status !== "cancelado"));
    if (riskClients.length > 0) {
      list.push({ icon: Bell, text: `Existe ${riskClients.length > 1 ? "clientes" : "uma cliente"} com histórico de cancelamento na agenda.`, tone: "terra" });
    }
    const pending = shoppingList.filter(i => !i.comprado);
    if (pending.length > 0) {
      list.push({ icon: ShoppingBag, text: `Você possui ${pending.length} itens pendentes na lista de compras.`, tone: "gold" });
    }
    return list;
  }, [appointments, clients, shoppingList, todayIsoStr, tomorrowIso]);

  const toneColor = { amber: COLORS.amber, primary: COLORS.primary, terra: COLORS.terra, gold: COLORS.gold };
  const toneBg = { amber: COLORS.amberSoft, primary: COLORS.primarySoft, terra: COLORS.terraSoft, gold: COLORS.goldSoft };

  const quick = [
    { key: "agenda", label: "Atendimentos", icon: Calendar, value: todaySummary.total, sub: "de hoje" },
    { key: "horarios", label: "Compromissos", icon: Clock, value: todaySummary.blocks, sub: "de hoje" },
    { key: "financeiro", label: "Ganhos", icon: Wallet, value: fmtBRL(computeEarnings(appointments, services, "day")), sub: "estimados hoje" },
    { key: "compras", label: "Compras", icon: ShoppingBag, value: shoppingList.filter(i => !i.comprado).length, sub: "pendentes" },
  ];

  return (
    <div className="fade-up">
      <div style={{ marginBottom: 22 }}>
        <h1 className="font-display" style={{ fontSize: 31, margin: 0, fontWeight: 600, color: COLORS.ink }}>
          Bom te ver por <span className="font-display-italic" style={{ color: COLORS.accent }}>aqui</span>.
        </h1>
      </div>

      <button onClick={() => setShowPrayer(true)} className="sd-btn" style={{ all: "unset", cursor: "pointer", display: "block", width: "100%", marginBottom: 16 }}>
        <Card style={{ padding: "16px 18px", background: `linear-gradient(155deg, ${COLORS.primary}, ${COLORS.primaryDeep})`, border: "none" }}>
          <div className="font-display-italic" style={{ fontSize: 14.5, color: "#fff", lineHeight: 1.55 }}>&ldquo;{quote.text}&rdquo;</div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 6 }}>
            {quote.ref ? <span className="font-body" style={{ fontSize: 11.5, color: "rgba(255,255,255,0.75)", fontWeight: 700 }}>{quote.ref}</span> : <span />}
            <span className="font-body" style={{ fontSize: 10.5, color: "rgba(255,255,255,0.6)", fontWeight: 700 }}>Toque para uma oração ✦</span>
          </div>
        </Card>
      </button>

      {announcements.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 22 }}>
          {announcements.map(a => (
            <Card key={a.id} style={{ padding: "13px 14px", background: COLORS.primarySoft, boxShadow: "none", border: "none" }}>
              <div style={{ fontWeight: 700, fontSize: 12.5, color: COLORS.primaryDeep }}>{a.title}</div>
              <div style={{ fontSize: 12.5, color: COLORS.primaryDeep, opacity: 0.85, marginTop: 3, lineHeight: 1.45 }}>{a.message}</div>
            </Card>
          ))}
        </div>
      )}

      <SectionLabel>Hoje</SectionLabel>
      <Card style={{ padding: "14px 16px", marginBottom: 18 }}>
        <div style={{ fontSize: 13.5, color: COLORS.ink, lineHeight: 1.6 }}>
          Hoje você tem <strong>{todaySummary.total}</strong> agendamento{todaySummary.total !== 1 ? "s" : ""}
          {todaySummary.unconfirmed > 0 && <> · <span style={{ color: COLORS.amber, fontWeight: 700 }}>{todaySummary.unconfirmed} não confirmado{todaySummary.unconfirmed !== 1 ? "s" : ""}</span></>}
          {todaysBirthdays.length > 0 && <> · <span style={{ color: COLORS.accent, fontWeight: 700 }}>é aniversário de {todaysBirthdays.map(c => c.nome.split(" ")[0]).join(", ")} 🎂</span></>}
        </div>
        {todaySummary.blocks > 0 && (
          <div style={{ fontSize: 13, color: COLORS.terra, marginTop: 4, fontWeight: 600 }}>
            {todaySummary.blocks} bloqueio{todaySummary.blocks !== 1 ? "s" : ""} ou compromisso{todaySummary.blocks !== 1 ? "s" : ""} hoje
          </div>
        )}
      </Card>

      {todaysBirthdays.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 18 }}>
          {todaysBirthdays.map(c => (
            <Card key={c.id} style={{ padding: "13px 14px", background: COLORS.goldSoft, border: "none", boxShadow: "none", display: "flex", alignItems: "center", gap: 11 }}>

              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 700, fontSize: 13.5, color: "#5A4420" }}>Hoje é aniversário de {c.nome}!</div>

              </div>
              <button onClick={() => setBirthdayClient(c)} className="font-body sd-btn" style={{
                background: COLORS.gold, color: "#fff", border: "none", borderRadius: 999, padding: "8px 13px",
                fontSize: 11.5, fontWeight: 700, cursor: "pointer", flexShrink: 0,
              }}>
                Enviar
              </button>
            </Card>
          ))}
        </div>
      )}

      {alerts.length > 0 && (
        <>
          <SectionLabel>Avisos</SectionLabel>
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 26 }}>
            {alerts.map((a, i) => {

      <SectionLabel>Acesso rápido</SectionLabel>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>

      </div>

      {showPrayer && <PrayerModal onClose={() => setShowPrayer(false)} />}

function NewAppointmentModal({ establishment, data, onCreate, onClose }) {
  const { clients, services, professionals } = data;
  const [clientQuery, setClientQuery] = useState("");
  const [selectedClient, setSelectedClient] = useState(null);
  const [newNome, setNewNome] = useState("");
  const [newWhatsapp, setNewWhatsapp] = useState("");
  const [newNascimento, setNewNascimento] = useState("");
  const [servicoId, setServicoId] = useState(services[0]?.id || "");
  const [profissionalId, setProfissionalId] = useState(professionals[0]?.id || "");
  const [dataStr, setDataStr] = useState(todayIso());
  const [horario, setHorario] = useState("");
  const [observacao, setObservacao] = useState("");
  const [slots, setSlots] = useState([]);
  const [slotsLoading, setSlotsLoading] = useState(false);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  const clientMatches = clientQuery.trim()
    ? clients.filter(c => c.nome.toLowerCase().includes(clientQuery.toLowerCase()) || c.whatsapp.includes(clientQuery.trim())).slice(0, 6)
    : [];

  useEffect(() => {
    if (!servicoId || !profissionalId || !dataStr) { setSlots([]); return; }
    let cancelled = false;
    setSlotsLoading(true); setHorario("");
    rest.rpc("get_available_slots", {
      p_establishment_id: establishment.id, p_professional_id: profissionalId,
      p_service_id: servicoId, p_date: dataStr,
    }).then(rows => { if (!cancelled) setSlots((rows || []).map(r => (r.slot || "").slice(0, 5)).filter(Boolean)); })
      .catch(err => { if (!cancelled) setError(err.message); })
      .finally(() => { if (!cancelled) setSlotsLoading(false); });
    return () => { cancelled = true; };
  }, [servicoId, profissionalId, dataStr, establishment.id]);

  async function submit() {
    const nome = selectedClient ? selectedClient.nome : newNome;
    const whatsapp = selectedClient ? selectedClient.whatsapp : newWhatsapp;
    if (!nome.trim() || !whatsapp.trim() || !servicoId || !profissionalId || !horario) return;
    setSaving(true); setError("");
    try {
      await onCreate({
        p_establishment_id: establishment.id,
        p_service_id: servicoId,
        p_professional_id: profissionalId,
        p_data: dataStr,
        p_horario: horario + ":00",
        p_cliente_nome: nome,
        p_cliente_whatsapp: whatsapp.replace(/\D/g, ""),
        p_cliente_email: null,
        p_observacao: observacao || null,
        p_data_nascimento: selectedClient ? null : (newNascimento || null),
      });
      onClose();
    } catch (err) { setError(err.message); }
    finally { setSaving(false); }
  }

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(36,20,25,0.5)", zIndex: 50, display: "flex", alignItems: "flex-end", justifyContent: "center" }} onClick={onClose}>
      <div className="pop-in" style={{ width: "100%", maxWidth: 480 }} onClick={e => e.stopPropagation()}>
        <Card style={{ padding: 22, borderRadius: "22px 22px 0 0", maxHeight: "88vh", overflowY: "auto" }}>
          <h2 className="font-display" style={{ fontSize: 20, margin: "0 0 16px", fontWeight: 600 }}>Novo agendamento</h2>
          <ErrorBanner message={error} onDismiss={() => setError("")} />

          <SectionLabel>Cliente</SectionLabel>
          {selectedClient ? (
            <div style={{ display: "flex", alignItems: "center", gap: 10, background: COLORS.primarySoft, borderRadius: 12, padding: "10px 12px", marginBottom: 14 }}>
              <Avatar name={selectedClient.nome} size={32} />
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 700, fontSize: 13.5 }}>{selectedClient.nome}</div>
                <div style={{ fontSize: 11.5, color: COLORS.inkSoft }}>{selectedClient.whatsapp}</div>
              </div>
              <button onClick={() => setSelectedClient(null)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.inkFaint }}><X size={16} /></button>
            </div>
          ) : (
            <>
              <div style={{ position: "relative", marginBottom: 8 }}>
                <Search size={14} color={COLORS.inkFaint} style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)" }} />
                <input placeholder="Buscar cliente existente..." value={clientQuery} onChange={e => setClientQuery(e.target.value)} style={{ ...fieldStyle, paddingLeft: 33 }} />
              </div>
              {clientMatches.length > 0 && (
                <div style={{ marginBottom: 10, display: "flex", flexDirection: "column", gap: 4 }}>
                  {clientMatches.map(c => (
                    <button key={c.id} onClick={() => { setSelectedClient(c); setClientQuery(""); }} className="sd-btn" style={{
                      textAlign: "left", background: COLORS.bgAlt, border: "none", borderRadius: 10, padding: "8px 10px", cursor: "pointer",
                      display: "flex", alignItems: "center", gap: 8,
                    }}>
                      <Avatar name={c.nome} size={26} />
                      <div style={{ fontSize: 12.5, fontWeight: 600 }}>{c.nome} <span style={{ color: COLORS.inkFaint, fontWeight: 500 }}>· {c.whatsapp}</span></div>
                    </button>
                  ))}
                </div>
              )}
              <div style={{ fontSize: 11, color: COLORS.inkFaint, margin: "4px 0 8px" }}>Ou cadastre uma nova:</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 }}>
                <input placeholder="Nome da cliente" value={newNome} onChange={e => setNewNome(e.target.value)} style={fieldStyle} />
                <input placeholder="WhatsApp" value={newWhatsapp} onChange={e => setNewWhatsapp(e.target.value)} style={fieldStyle} />
                <div>
                  <label style={{ fontSize: 11, color: COLORS.inkFaint, fontWeight: 600 }}>Data de nascimento (opcional)</label>
                  <input type="date" value={newNascimento} onChange={e => setNewNascimento(e.target.value)} style={{ ...fieldStyle, marginTop: 4 }} />
                </div>
              </div>
            </>
          )}

          <SectionLabel>Serviço e profissional</SectionLabel>
          <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 14 }}>
            <select value={servicoId} onChange={e => setServicoId(e.target.value)} style={fieldStyle}>
              {services.map(s => <option key={s.id} value={s.id}>{s.nome} · R$ {s.preco}</option>)}

              {professionals.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}

          </div>

          <SectionLabel>Data e horário</SectionLabel>
          <input type="date" value={dataStr} onChange={e => setDataStr(e.target.value)} style={{ ...fieldStyle, marginBottom: 10 }} />
          {slotsLoading && <div style={{ fontSize: 12.5, color: COLORS.inkFaint, display: "flex", alignItems: "center", gap: 6 }}><Spinner size={13} color={COLORS.inkFaint} /> Verificando disponibilidade...</div>}
          {!slotsLoading && slots.length === 0 && <div style={{ fontSize: 12.5, color: COLORS.inkFaint }}>Nenhum horário livre nessa data.</div>}
          {!slotsLoading && slots.length > 0 && (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr", gap: 7, marginBottom: 14 }}>
              {slots.map(h => (
                <button key={h} onClick={() => setHorario(h)} className="font-body sd-btn" style={{
                  padding: "9px 4px", borderRadius: 10, textAlign: "center", cursor: "pointer",
                  border: `1.5px solid ${horario === h ? COLORS.primary : COLORS.border}`,
                  background: horario === h ? COLORS.primarySoft : COLORS.surface, fontWeight: 700, fontSize: 12.5,
                }}>{h}</button>
              ))}
            </div>
          )}

          <textarea placeholder="Observação (opcional)" value={observacao} onChange={e => setObservacao(e.target.value)} rows={2} style={{ ...fieldStyle, resize: "vertical", marginBottom: 16 }} />

          <PrimaryButton onClick={submit} loading={saving} disabled={!horario} style={{ width: "100%" }}>Criar agendamento</PrimaryButton>
        </Card>
      </div>
    </div>
  );
}

function toMinutes(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
}
function toHHMM(mins) {
  const h = Math.floor(mins / 60) % 24;
  const m = mins % 60;
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
}
function mergeIntervals(intervals) {
  const sorted = [...intervals].sort((a, b) => a.start - b.start);
  const merged = [];
  for (const iv of sorted) {
    const last = merged[merged.length - 1];
    if (last && iv.start <= last.end) last.end = Math.max(last.end, iv.end);
    else merged.push({ ...iv });
  }
  return merged;
}

// Calcula os intervalos livres do dia por profissional, considerando
// o horário de funcionamento, o intervalo de almoço, os agendamentos
// já existentes (usando a duração real de cada serviço — horarioFim,
// não um horário fixo) e as folgas/bloqueios/compromissos.
function computeFreeGaps(dateStr, professionals, workingHours, appointments, timeOff, minGapMin = 10) {
  if (!dateStr) return [];
  const weekday = new Date(dateStr + "T12:00:00").getDay();
  const gaps = [];

  professionals.filter(p => p.ativo !== false).forEach(prof => {
    let wh = workingHours.find(w => w.professionalId === prof.id && w.weekday === weekday);
    if (!wh) wh = workingHours.find(w => !w.professionalId && w.weekday === weekday);
    if (!wh) return; // não trabalha nesse dia

    const dayStart = toMinutes(wh.start);
    const dayEnd = toMinutes(wh.end);
    const busy = [];
    if (wh.breakStart && wh.breakEnd) busy.push({ start: toMinutes(wh.breakStart), end: toMinutes(wh.breakEnd) });

    appointments
      .filter(a => a.profissionalId === prof.id && a.data === dateStr && a.status !== "cancelado")
      .forEach(a => busy.push({ start: toMinutes(a.horario), end: a.horarioFim ? toMinutes(a.horarioFim) : toMinutes(a.horario) + 30 }));

    const dayStartD = new Date(dateStr + "T00:00:00");
    const dayEndD = new Date(dateStr + "T23:59:59.999");
    timeOff
      .filter(t => t.professionalId === prof.id && new Date(t.startAt) <= dayEndD && new Date(t.endAt) >= dayStartD)
      .forEach(t => {
        const s = new Date(t.startAt); const e = new Date(t.endAt);
        const start = s < dayStartD ? 0 : s.getHours() * 60 + s.getMinutes();
        const end = e > dayEndD ? 1440 : e.getHours() * 60 + e.getMinutes();
        busy.push({ start, end });
      });

    const merged = mergeIntervals(busy);
    let cursor = dayStart;
    for (const b of merged) {
      if (b.start > cursor && b.start - cursor >= minGapMin) {
        gaps.push({ start: toHHMM(cursor), end: toHHMM(Math.min(b.start, dayEnd)), professionalId: prof.id, professionalNome: prof.nome, sortKey: toHHMM(cursor) });
      }
      cursor = Math.max(cursor, b.end);
    }
    if (dayEnd - cursor >= minGapMin) {
      gaps.push({ start: toHHMM(cursor), end: toHHMM(dayEnd), professionalId: prof.id, professionalNome: prof.nome, sortKey: toHHMM(cursor) });
    }
  });

  return gaps.sort((a, b) => a.sortKey.localeCompare(b.sortKey));
}

function Agenda({ data, establishment, onSetStatus, onOpenLink, onCreateAppointment }) {
  const { appointments, clients, services, professionals, timeOff = [], workingHours = [] } = data;
  const [filter, setFilter] = useState("todos");
  const [selectedDate, setSelectedDate] = useState(null);
  const [busyId, setBusyId] = useState(null);
  const [showNewAppt, setShowNewAppt] = useState(false);
  const [delayError, setDelayError] = useState("");
  const today = useMemo(() => new Date(), []);
  const [viewYear, setViewYear] = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth());

  async function setStatus(id, status) {
    setBusyId(id);
    try { await onSetStatus(id, status); } finally { setBusyId(null); }
  }

  function waLink(appt) {
    const cliente = clients.find(c => c.id === appt.clienteId);
    const servico = services.find(s => s.id === appt.servicoId);
    const link = `${window.location.origin}${window.location.pathname}?token=${appt.token}`;
    const text = (establishment.waTemplate || DEFAULT_WA_TEMPLATE)
      .replace("{cliente}", cliente?.nome.split(" ")[0] || "")
      .replace("{data}", fmtDate(appt.data))
      .replace("{horario}", appt.horario)
      .replace("{servico}", servico?.nome || "")
      .replace("{link}", link);
    return `https://wa.me/${normalizeImportedPhone(cliente?.whatsapp)}?text=${encodeURIComponent(text)}`;
  }

  function notifyNextClientDelay() {
    setDelayError("");
    const now = new Date();
    const todayStr = todayIso();
    const currentTime = now.toTimeString().slice(0, 5);
    const next = appointments
      .filter(a => a.data === todayStr && a.status !== "cancelado" && a.horario >= currentTime)
      .sort((a, b) => a.horario.localeCompare(b.horario))[0];
    if (!next) { setDelayError("Não existe uma próxima cliente agendada para hoje."); return; }
    const client = clients.find(c => c.id === next.clienteId);
    if (!client?.whatsapp) { setDelayError("A próxima cliente não possui WhatsApp cadastrado."); return; }
    const firstName = client.nome.split(" ")[0];
    const text = `Oi, ${firstName}! Estou com um pequeno atraso no atendimento anterior. Seu horário de hoje às ${next.horario} poderá atrasar alguns minutos. Agradeço pela compreensão e já te aviso assim que estiver tudo pronto. 💗`;
    window.open(`https://wa.me/${normalizeImportedPhone(client.whatsapp)}?text=${encodeURIComponent(text)}`, "_blank", "noopener,noreferrer");
  }

  const appointmentDates = useMemo(() => new Set(appointments.filter(a => a.status !== "cancelado").map(a => a.data)), [appointments]);
  const timeOffDates = useMemo(() => {
    const set = new Set();
    timeOff.forEach(t => {
      const start = new Date(t.startAt); const end = new Date(t.endAt);
      for (let d = new Date(start); d < end; d.setDate(d.getDate() + 1)) {
        set.add(d.toISOString().slice(0, 10));
      }
    });
    return set;
  }, [timeOff]);

  function getDayMeta(dateStr) {
    const hasAppt = appointmentDates.has(dateStr);
    const hasOff = timeOffDates.has(dateStr);
    if (hasAppt) return { dot: COLORS.primary, bg: COLORS.primarySoft };
    if (hasOff) return { dot: COLORS.terra, bg: COLORS.terraSoft };
    return {};
  }

  const timeOffOnSelectedDate = useMemo(() => {
    if (!selectedDate) return [];
    const dayStart = new Date(selectedDate + "T00:00:00");
    const dayEnd = new Date(selectedDate + "T23:59:59.999");
    return timeOff.filter(t => new Date(t.startAt) <= dayEnd && new Date(t.endAt) >= dayStart);
  }, [selectedDate, timeOff]);

  function timeOffTimeRange(t, dateStr) {
    const start = new Date(t.startAt);
    const end = new Date(t.endAt);
    const dayStart = new Date(dateStr + "T00:00:00");
    const dayEnd = new Date(dateStr + "T23:59:59.999");
    const clippedStart = start < dayStart ? dayStart : start;
    const fmt = (d) => d.toTimeString().slice(0, 5);
    return { startLabel: fmt(clippedStart), endLabel: end > dayEnd ? "23:59" : fmt(end > dayEnd ? dayEnd : end), sortKey: fmt(clippedStart) };
  }

  const tipoLabel = { folga: "Folga", ferias: "Férias", bloqueio: "Bloqueio", compromisso: "Compromisso" };
  const tipoTone = { folga: COLORS.amber, ferias: COLORS.gold, bloqueio: COLORS.terra, compromisso: COLORS.terra };

  const filtered = appointments
    .filter(a => filter === "todos" ? true : a.status === filter)
    .filter(a => selectedDate ? a.data === selectedDate : true)
    .sort((a, b) => (a.data + a.horario).localeCompare(b.data + b.horario));

  // Quando um dia específico está selecionado, mistura os
  // bloqueios/compromissos daquele dia com os agendamentos, todos
  // ordenados por horário — uma única linha do tempo organizada.
  const freeGaps = useMemo(
    () => (filter === "vago" && selectedDate) ? computeFreeGaps(selectedDate, professionals, workingHours, appointments, timeOff) : [],
    [filter, selectedDate, professionals, workingHours, appointments, timeOff]
  );

  const timeline = useMemo(() => {
    if (filter === "vago") {
      return freeGaps.map(g => ({ kind: "vago", sortKey: g.sortKey, gap: g }));
    }
    const apptItems = filtered.map(a => ({ kind: "appointment", sortKey: a.horario, appt: a }));
    const offItems = (filter === "todos" && selectedDate)
      ? timeOffOnSelectedDate.map(t => {
          const range = timeOffTimeRange(t, selectedDate);
          return { kind: "timeoff", sortKey: range.sortKey, off: t, ...range };
        })
      : [];
    return [...apptItems, ...offItems].sort((a, b) => a.sortKey.localeCompare(b.sortKey));
  }, [filtered, filter, selectedDate, timeOffOnSelectedDate, freeGaps]);

  const filters = [
    { key: "todos", label: "Todos" },
    { key: "confirmado", label: "Confirmados" },
    { key: "aguardando", label: "Aguardando" },
    { key: "vago", label: "Vago" },
    { key: "cancelado", label: "Cancelados" },
  ];
  const tomorrowIso = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
  const awaitingTomorrow = appointments.filter(a => a.data === tomorrowIso && a.status === "aguardando").length;

  return (
    <div className="fade-up">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, margin: "2px 0 16px", flexWrap: "wrap" }}>
        <h1 className="font-display" style={{ fontSize: 27, margin: 0, fontWeight: 600 }}>Agenda</h1>
        <div style={{ display: "flex", gap: 7 }}>
          <button onClick={notifyNextClientDelay} className="font-body sd-btn" style={{
            background: "#1E9E56", color: "#fff", border: "none", borderRadius: 999,
            padding: "9px 12px", fontSize: 11.5, fontWeight: 700, cursor: "pointer",
            display: "flex", alignItems: "center", gap: 5,
          }}><MessageCircle size={13} /> Avisar atraso</button>
          <PrimaryButton onClick={() => setShowNewAppt(true)} style={{ padding: "10px 15px", fontSize: 12.5 }}>
            <Plus size={14} /> Novo
          </PrimaryButton>
        </div>
      </div>
      <ErrorBanner message={delayError} onDismiss={() => setDelayError("")} />

      {awaitingTomorrow > 0 && (
        <Card style={{
          background: COLORS.amberSoft, border: `1px solid ${COLORS.amber}22`,
          padding: "11px 14px", fontSize: 13, color: "#7A5610", marginBottom: 16, boxShadow: "none",
        }}>
          Você possui {awaitingTomorrow} cliente{awaitingTomorrow > 1 ? "s" : ""} aguardando confirmação para amanhã.
        </Card>
      )}

      <div className="agenda-layout">
      <div className="agenda-calendar-col">
      <Card style={{ padding: 14, marginBottom: 14 }}>
        <MonthCalendar
          year={viewYear} month={viewMonth}
          onNavigate={(delta) => { const n = addMonths(viewYear, viewMonth, delta); setViewYear(n.year); setViewMonth(n.month); }}
          selectedDate={selectedDate}
          onSelectDate={(d) => setSelectedDate(prev => prev === d ? null : d)}
          getDayMeta={getDayMeta}
        />
        <div style={{ display: "flex", gap: 14, marginTop: 12, fontSize: 11, color: COLORS.inkSoft, flexWrap: "wrap" }}>
          <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 8, height: 8, borderRadius: "50%", background: COLORS.primary, display: "inline-block" }} /> Com agendamento</span>
          <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 8, height: 8, borderRadius: "50%", background: COLORS.terra, display: "inline-block" }} /> Folga/férias/bloqueio/compromisso</span>
        </div>
      </Card>
      </div>
      <div className="agenda-client-col">

      <div className="scrollbar-thin" style={{ display: "flex", gap: 6, marginBottom: 18, overflowX: "auto", background: COLORS.bgAlt, padding: 4, borderRadius: 13 }}>
        {filters.map(f => (
          <button key={f.key} onClick={() => setFilter(f.key)}
            className="font-body sd-tab"
            style={{
              flexShrink: 0, border: "none",
              background: filter === f.key ? COLORS.surface : "transparent",
              color: filter === f.key ? COLORS.primary : COLORS.inkSoft,
              boxShadow: filter === f.key ? COLORS.shadowSm : "none",
              borderRadius: 10, padding: "8px 13px", fontSize: 12.5, fontWeight: 700, cursor: "pointer",
            }}>
            {f.label}
          </button>
        ))}
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {filter === "vago" && !selectedDate && (
          <div style={{ color: COLORS.inkFaint, fontSize: 13, padding: "36px 0", textAlign: "center" }}>Selecione um dia no calendário para ver os horários vagos.</div>
        )}
        {filter === "vago" && selectedDate && timeline.length === 0 && (
          <div style={{ color: COLORS.inkFaint, fontSize: 13, padding: "36px 0", textAlign: "center" }}>Nenhum horário livre nesse dia (ou ninguém trabalha nesse dia).</div>
        )}
        {filter !== "vago" && timeline.length === 0 && appointments.length > 0 && (
          <div style={{ color: COLORS.inkFaint, fontSize: 13, padding: "36px 0", textAlign: "center" }}>Nenhum agendamento aqui.</div>
        )}
        {timeline.map((item, i) => {
          if (item.kind === "vago") {
            const g = item.gap;
            return (
              <Card key={`vago-${i}`} className="fade-up" style={{ padding: 14, background: COLORS.sageSoft, border: "none", boxShadow: "none", animationDelay: `${Math.min(i, 6) * 0.04}s` }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <div style={{ textAlign: "center", flexShrink: 0 }}>
                    <div className="font-display" style={{ fontSize: 13.5, fontWeight: 700, color: COLORS.sage }}>{g.start}</div>
                    <div style={{ fontSize: 10, color: COLORS.sage, opacity: 0.7 }}>até</div>
                    <div className="font-display" style={{ fontSize: 13.5, fontWeight: 700, color: COLORS.sage }}>{g.end}</div>
                  </div>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 13.5, color: "#1E5C3A" }}>Livre · {g.professionalNome}</div>
                    <div style={{ fontSize: 11.5, color: "#1E5C3A", opacity: 0.8 }}>{toMinutes(g.end) - toMinutes(g.start)} min disponíveis</div>
                  </div>
                </div>
              </Card>
            );
          }
          if (item.kind === "timeoff") {
            const t = item.off;
            const prof = professionals.find(p => p.id === t.professionalId);
            const tone = tipoTone[t.tipo] || COLORS.terra;
            return (
              <Card key={`off-${t.id}`} className="fade-up" style={{ padding: 15, background: COLORS.terraSoft, border: "none", boxShadow: "none", animationDelay: `${Math.min(i, 6) * 0.04}s` }}>
                <div style={{ display: "flex", gap: 10 }}>
                  <div style={{ textAlign: "center", flexShrink: 0, paddingTop: 1 }}>
                    <div className="font-display" style={{ fontSize: 13.5, fontWeight: 700, color: tone, lineHeight: 1.3 }}>{item.startLabel}</div>
                    <div style={{ width: 1, height: 18, background: `${tone}55`, margin: "4px auto" }} />
                    <div className="font-display" style={{ fontSize: 12, fontWeight: 700, color: tone, opacity: 0.75 }}>{item.endLabel}</div>
                  </div>
                  <div>
                    <div style={{ display: "flex", alignItems: "center", gap: 7, fontWeight: 700, fontSize: 13.5, color: tone }}>
                      <Clock size={13} /> {tipoLabel[t.tipo] || t.tipo} · {prof?.nome || "Profissional"}
                    </div>
                    {t.motivo && <div style={{ fontSize: 12.5, color: "#7A2A2A", marginTop: 4 }}>{t.motivo}</div>}
                  </div>
                </div>
              </Card>
            );
          }

          const appt = item.appt;
          const cliente = clients.find(c => c.id === appt.clienteId);
          const servico = services.find(s => s.id === appt.servicoId);
          const prof = professionals.find(p => p.id === appt.profissionalId);
          const meta = statusMeta[appt.status];
          const busy = busyId === appt.id;
          return (
            <Card key={appt.id} className="fade-up" style={{ padding: 15, animationDelay: `${Math.min(i, 6) * 0.04}s`, opacity: busy ? 0.7 : 1 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
                <div style={{ display: "flex", gap: 10 }}>
                  <div style={{ textAlign: "center", flexShrink: 0, paddingTop: 1 }}>
                    <div className="font-display" style={{ fontSize: 15, fontWeight: 700, color: COLORS.primary, lineHeight: 1 }}>{appt.horario}</div>
                    <div style={{ width: 1, height: 24, background: COLORS.border, margin: "6px auto 0" }} />
                  </div>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 14.5, display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                      {cliente?.nome || "Cliente"}
                      {cliente?.historicoCancelamento && <Pill fg={COLORS.terra} bg={COLORS.terraSoft} dot>histórico</Pill>}
                    </div>
                    <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginTop: 3 }}>
                      {servico?.nome} · {prof?.nome}
                    </div>
                    <div style={{ fontSize: 12, color: COLORS.inkFaint, marginTop: 2 }}>
                      {fmtDate(appt.data)}
                    </div>
                  </div>
                </div>
                <Pill fg={meta.fg} bg={meta.bg} dot>{meta.label}</Pill>
              </div>

              <div style={{ display: "flex", gap: 7, marginTop: 13, flexWrap: "wrap" }}>
                <a href={waLink(appt)} target="_blank" rel="noopener noreferrer" style={{ textDecoration: "none" }}>
                  <button className="font-body sd-btn" style={{
                    display: "flex", alignItems: "center", gap: 6, background: "#1E9E56", color: "#fff",
                    border: "none", borderRadius: 999, padding: "8px 13px", fontSize: 12, fontWeight: 700, cursor: "pointer",
                  }}>
                    <MessageCircle size={13} /> WhatsApp
                  </button>
                </a>
                <button onClick={() => onOpenLink(appt.token)} className="font-body sd-btn"
                  style={{ background: COLORS.surface, border: `1px solid ${COLORS.border}`, color: COLORS.ink, borderRadius: 999, padding: "8px 13px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                  Link de confirmação
                </button>
                {appt.status !== "confirmado" && (
                  <button disabled={busy} onClick={() => setStatus(appt.id, "confirmado")} className="font-body sd-btn"
                    style={{ background: "transparent", border: `1px solid ${COLORS.sage}55`, color: COLORS.sage, borderRadius: 999, padding: "8px 13px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                    Confirmar
                  </button>
                )}
                {appt.status !== "cancelado" && (
                  <button disabled={busy} onClick={() => setStatus(appt.id, "cancelado")} className="font-body sd-btn"
                    style={{ background: "transparent", border: `1px solid ${COLORS.terra}55`, color: COLORS.terra, borderRadius: 999, padding: "8px 13px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                    Cancelar
                  </button>
                )}
              </div>
            </Card>
          );
        })}
      </div>
      </div>
      </div>

      {showNewAppt && (
        <NewAppointmentModal
          establishment={establishment}
          data={data}
          onCreate={onCreateAppointment}
          onClose={() => setShowNewAppt(false)}
        />
      )}
    </div>
  );
}

function ClientDetailModal({ client, appointments, services, professionals, onSave, onClose }) {
  const [notas, setNotas] = useState(client.observacoes || "");
  const [nascimento, setNascimento] = useState(client.dataNascimento || "");
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);
  const history = appointments
    .filter(a => a.clienteId === client.id)
    .sort((a, b) => (b.data + b.horario).localeCompare(a.data + a.horario));

  async function save() {
    setSaving(true);
    try {
      await onSave(client.id, { observacoes: notas, data_nascimento: nascimento || null });
      setSaved(true);
      setTimeout(() => setSaved(false), 1500);
    } finally { setSaving(false); }
  }

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(36,20,25,0.5)", zIndex: 50, display: "flex", alignItems: "flex-end", justifyContent: "center" }} onClick={onClose}>
      <div className="pop-in" style={{ width: "100%", maxWidth: 480 }} onClick={e => e.stopPropagation()}>
        <Card style={{ padding: 22, borderRadius: "22px 22px 0 0", maxHeight: "85vh", overflowY: "auto" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 16 }}>
            <Avatar name={client.nome} size={44} />
            <div style={{ flex: 1 }}>
              <div style={{ fontWeight: 700, fontSize: 16 }}>{client.nome}</div>
              <div style={{ fontSize: 12, color: COLORS.inkSoft }}>{client.whatsapp}</div>
            </div>
            <Pill fg={COLORS.gold} bg={COLORS.goldSoft}>★ {client.loyaltyPoints || 0} pts</Pill>
          </div>

          <SectionLabel>Data de nascimento</SectionLabel>
          <input type="date" value={nascimento} onChange={e => setNascimento(e.target.value)} style={{ ...fieldStyle, marginBottom: 16 }} />

          <SectionLabel>Anotações / Prontuário</SectionLabel>
          <div style={{ fontSize: 12, color: COLORS.inkSoft, marginBottom: 8, lineHeight: 1.5 }}>
            Anamnese, preferências, alergias, histórico — o que for útil para o seu atendimento.
          </div>
          <textarea value={notas} onChange={e => setNotas(e.target.value)} rows={4} style={{ ...fieldStyle, resize: "vertical", marginBottom: 8 }} />
          <PrimaryButton onClick={save} loading={saving} style={{ marginBottom: 20 }}>
            {saved ? <><Check size={15} /> Salvo</> : "Salvar"}
          </PrimaryButton>

          <SectionLabel>Histórico de atendimentos ({history.length})</SectionLabel>
          {history.length === 0 ? (
            <div style={{ fontSize: 12.5, color: COLORS.inkFaint, padding: "10px 0" }}>Nenhum atendimento ainda.</div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 8 }}>
              {history.map(a => {
                const servico = services.find(s => s.id === a.servicoId);
                const prof = professionals.find(p => p.id === a.profissionalId);
                const meta = statusMeta[a.status];
                return (
                  <div key={a.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "9px 0", borderBottom: `1px solid ${COLORS.border}` }}>

}

function normalizeImportedPhone(value) {
  let raw = String(value || "").trim();
  // O Excel às vezes transforma telefones longos em notação científica.
  if (/^\d+(?:[.,]\d+)?e\+?\d+$/i.test(raw)) {
    const numeric = Number(raw.replace(",", "."));
    if (Number.isFinite(numeric)) raw = numeric.toLocaleString("fullwide", { useGrouping: false, maximumFractionDigits: 0 });
  }
  let digits = raw.replace(/\D/g, "");
  // Remove zeros usados por algumas agendas antes do código internacional.
  digits = digits.replace(/^00(?=55)/, "");
  if ((digits.length === 10 || digits.length === 11) && !digits.startsWith("55")) digits = "55" + digits;
  return digits;
}

function normalizeImportedDate(value) {
  const raw = String(value || "").trim();
  if (!raw) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) return raw;
  if (/^\d{8}$/.test(raw)) return `${raw.slice(0, 4)}-${raw.slice(4, 6)}-${raw.slice(6, 8)}`;
  const br = raw.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
  if (br) return `${br[3]}-${br[2].padStart(2, "0")}-${br[1].padStart(2, "0")}`;
  return null;
}

function parseDelimitedLine(line, sep) {
  const cols = [];
  let current = "", quoted = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (quoted && line[i + 1] === '"') { current += '"'; i++; }
      else quoted = !quoted;
    } else if (ch === sep && !quoted) {
      cols.push(current.trim()); current = "";
    } else current += ch;
  }
  cols.push(current.trim());
  return cols;
}

function parseContactsCsv(text) {
  const clean = String(text || "").replace(/^\uFEFF/, "");
  const lines = clean.split(/\r?\n/).filter(l => l.trim());
  if (lines.length === 0) return [];
  const candidates = [";", ",", "\t"];
  const sep = candidates.sort((a, b) => (lines[0].split(b).length - lines[0].split(a).length))[0];
  const first = parseDelimitedLine(lines[0], sep);
  const header = first.map(h => h.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim());
  const iNome = header.findIndex(h => h === "nome" || h === "name" || h.includes("nome completo") || h.includes("full name") || h.includes("display name"));
  const iFirst = header.findIndex(h => h.includes("primeiro nome") || h.includes("first name") || h.includes("given name"));
  const iLast = header.findIndex(h => h.includes("sobrenome") || h.includes("last name") || h.includes("family name"));
  const phoneIndexes = header.map((h, i) => ({ h, i }))
    .filter(({ h }) => h.includes("whats") || h.includes("telefone") || h.includes("fone") || h.includes("celular") || h.includes("phone") || h.includes("mobile"))
    .map(({ i }) => i);
  const iWhats = phoneIndexes[0] ?? -1;
  const iNasc = header.findIndex(h => h.includes("nasc") || h.includes("anivers") || h.includes("birthday") || h.includes("birth"));
  const hasHeader = iNome !== -1 || iFirst !== -1 || iLast !== -1 || iWhats !== -1;
  const dataLines = hasHeader ? lines.slice(1) : lines;
  return dataLines.map(line => {
    const cols = parseDelimitedLine(line, sep);
    const importedName = hasHeader
      ? (iNome !== -1 ? cols[iNome] : [iFirst !== -1 ? cols[iFirst] : "", iLast !== -1 ? cols[iLast] : ""].filter(Boolean).join(" "))
      : (cols.length > 1 ? cols[0] : "");
    const rawPhone = hasHeader
      ? (phoneIndexes.map(i => cols[i]).find(v => normalizeImportedPhone(v).length >= 10) || cols[iWhats] || cols[1])
      : (cols.length > 1 ? cols[1] : cols[0]);
    const whatsapp = normalizeImportedPhone(rawPhone);
    return {
      // Um contato só com telefone também é válido. O nome provisório pode ser
      // editado depois, junto com a data de nascimento opcional.
      nome: String(importedName || "").trim() || (whatsapp ? `Contato ${whatsapp.slice(-4)}` : ""),
      whatsapp,
      data_nascimento: normalizeImportedDate(hasHeader && iNasc !== -1 ? cols[iNasc] : null),
    };
  }).filter(r => r.nome && r.whatsapp.length >= 10);
}

function parseContactsVcf(text) {
  const unfolded = String(text || "").replace(/\r?\n[ \t]/g, "");
  return unfolded.split(/BEGIN:VCARD/i).slice(1).map(block => {
    const lines = block.split(/\r?\n/);
    const valueOf = (prefix) => {
      const line = lines.find(l => l.toUpperCase().startsWith(prefix));
      return line ? line.slice(line.indexOf(":") + 1).trim() : "";
    };
    const fn = valueOf("FN") || valueOf("N").split(";").filter(Boolean).reverse().join(" ");
    const telLine = lines.find(l => /^TEL(?:;|:)/i.test(l));
    const tel = telLine ? telLine.slice(telLine.indexOf(":") + 1) : "";
    return {
      nome: fn.replace(/\\([,;])/g, "$1").trim(),
      whatsapp: normalizeImportedPhone(tel),
      data_nascimento: normalizeImportedDate(valueOf("BDAY")),
    };
  }).filter(r => r.nome && r.whatsapp.length >= 10);
}

function ImportContactsModal({ onImport, onClose }) {
  const [rows, setRows] = useState(null);
  const [fileName, setFileName] = useState("");
  const [importing, setImporting] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState("");
  const [stage, setStage] = useState("");

  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setFileName(file.name); setError(""); setResult(null); setRows(null); setStage("Lendo arquivo...");
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const content = String(reader.result);
        const parsed = file.name.toLowerCase().endsWith(".vcf") ? parseContactsVcf(content) : parseContactsCsv(content);
        if (parsed.length === 0) {
          setStage("");
          setError("Não encontrei telefones válidos. Use um CSV com uma coluna de telefone/WhatsApp ou um arquivo de contatos .vcf.");
          setRows([]);
          return;
        }
        setRows(parsed);
        await runImport(parsed);
      } catch (err) { setStage(""); setError(err.message || "Não consegui ler ou importar esse arquivo."); }
    };
    reader.onerror = () => { setStage(""); setError("O navegador não conseguiu abrir esse arquivo."); };
    reader.readAsText(file, "utf-8");
  }

  async function runImport(list) {
    setImporting(true); setError("");
    setStage(`Importando ${list.length} contato${list.length !== 1 ? "s" : ""}...`);
    try {
      const res = await onImport(list);
      setResult(res);
    } catch (err) { setError(err.message); }
    finally { setImporting(false); setStage(""); }
  }

  async function doImport() { if (rows?.length) await runImport(rows); }

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(36,20,25,0.5)", zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }} onClick={onClose}>
      <Card className="pop-in" style={{ padding: 22, maxWidth: 380, width: "100%" }} onClick={e => e.stopPropagation()}>
        <h2 className="font-display" style={{ fontSize: 18, margin: "0 0 6px", fontWeight: 600 }}>Importar contatos</h2>
        <p style={{ fontSize: 12, color: COLORS.inkSoft, margin: "0 0 14px", lineHeight: 1.5 }}>
          Importe uma planilha .csv ou contatos do celular em .vcf. Só o telefone é obrigatório. Se o nome ou a data de nascimento estiverem vazios, você poderá completar depois. Duplicados são ignorados.
        </p>
        <ErrorBanner message={error} onDismiss={() => setError("")} />
        {stage && <div style={{ fontSize: 12.5, color: COLORS.primary, fontWeight: 700, marginBottom: 12, display: "flex", alignItems: "center", gap: 7 }}><Spinner size={14} color={COLORS.primary} /> {stage}</div>}

        {result ? (
          <div className="pop-in" style={{ background: COLORS.sageSoft, color: COLORS.sage, borderRadius: 12, padding: 14, fontSize: 13, lineHeight: 1.6, marginBottom: 14 }}>
            ✅ {result.created} contato{result.created !== 1 ? "s" : ""} importado{result.created !== 1 ? "s" : ""}.
            {result.skipped > 0 && <> {result.skipped} ignorado{result.skipped !== 1 ? "s" : ""} (duplicado ou já existia).</>}
            {result.failed > 0 && <> {result.failed} com erro.</>}
            {result.firstError && <div style={{ marginTop: 7, fontSize: 11.5 }}>Motivo: {result.firstError}</div>}
          </div>
        ) : (
          <>
            <label style={{
              display: "flex", flexDirection: "column", alignItems: "center", gap: 8, border: `1.5px dashed ${COLORS.border}`,
              borderRadius: 14, padding: "24px 14px", cursor: "pointer", marginBottom: 14, textAlign: "center",
            }}>
              <Upload size={20} color={COLORS.inkFaint} />
              <span style={{ fontSize: 12.5, fontWeight: 700, color: COLORS.ink }}>{fileName || "Escolher arquivo .csv ou .vcf"}</span>
              <input type="file" accept=".csv,.vcf,text/csv,text/vcard" onChange={handleFile} style={{ display: "none" }} />
            </label>
            {rows && <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginBottom: 14 }}>{rows.length} contato{rows.length !== 1 ? "s" : ""} encontrado{rows.length !== 1 ? "s" : ""} no arquivo.</div>}
            <PrimaryButton onClick={doImport} loading={importing} disabled={!rows || rows.length === 0} style={{ width: "100%", marginBottom: 8 }}>Importar</PrimaryButton>
          </>
        )}
        <GhostButton onClick={onClose} style={{ width: "100%", justifyContent: "center" }}>Fechar</GhostButton>
      </Card>
    </div>
  );
}

function Profissionais({ data, onAdd, onUpdate, onRemove }) {
  const { professionals, appointments } = data;
  const [nome, setNome] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [saving, setSaving] = useState(false);
  const [busyId, setBusyId] = useState(null);
  const [error, setError] = useState("");

  async function submit(e) {
    e.preventDefault();
    if (!nome.trim()) return;
    setSaving(true); setError("");
    try {
      if (editingId) await onUpdate(editingId, { nome });
      else await onAdd({ nome });
      setNome(""); setEditingId(null);
    } catch (err) { setError(err.message); }
    finally { setSaving(false); }
  }

  function edit(p) { setEditingId(p.id); setNome(p.nome); }

  async function toggleAtivo(p) {
    setBusyId(p.id); setError("");
    try { await onUpdate(p.id, { ativo: !p.ativo }); }
    catch (err) { setError(err.message); }
    finally { setBusyId(null); }
  }

  async function remove(p) {
    setBusyId(p.id); setError("");
    try {
      await onRemove(p.id);
      if (editingId === p.id) { setEditingId(null); setNome(""); }
    } catch (err) {
      setError(/foreign key|violat/i.test(err.message)
        ? "Não é possível excluir: esta profissional tem agendamentos no histórico. Desative-a em vez de excluir."
        : err.message);
    }
    finally { setBusyId(null); }
  }

  return (
    <div className="fade-up">
      <h1 className="font-display" style={{ fontSize: 27, margin: "2px 0 16px", fontWeight: 600 }}>Equipe</h1>
      <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginBottom: 16, lineHeight: 1.5 }}>
        Cada profissional aparece no link público de agendamento e tem sua própria agenda e horários.
      </div>
      <ErrorBanner message={error} onDismiss={() => setError("")} />

      <Card style={{ padding: 16, marginBottom: 16 }}>
        <SectionLabel>{editingId ? "Editar profissional" : "Nova profissional"}</SectionLabel>
        <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <input placeholder="Nome da profissional" value={nome} onChange={e => setNome(e.target.value)} style={fieldStyle} />
          <PrimaryButton type="submit" loading={saving} style={{ marginTop: 2 }}>
            <Plus size={15} /> {editingId ? "Salvar alterações" : "Adicionar profissional"}
          </PrimaryButton>
          {editingId && (
            <button type="button" onClick={() => { setEditingId(null); setNome(""); }}
              className="font-body" style={{ background: "none", border: "none", color: COLORS.inkFaint, fontSize: 12, cursor: "pointer" }}>
              Cancelar edição
            </button>
          )}
        </form>
      </Card>

      {professionals.length === 0 ? (
        <Card style={{ padding: 18, textAlign: "center", color: COLORS.inkFaint, fontSize: 13 }}>Nenhuma profissional cadastrada ainda.</Card>
      ) : (
        <Card style={{ padding: 4, overflow: "hidden" }}>
          {professionals.map((p, i) => {
            const total = appointments.filter(a => a.profissionalId === p.id && a.status !== "cancelado").length;
            const busy = busyId === p.id;
            return (
              <div key={p.id} className="sd-row" style={{
                display: "flex", alignItems: "center", gap: 12, padding: "13px 12px",
                borderBottom: i < professionals.length - 1 ? `1px solid ${COLORS.border}` : "none", borderRadius: 10,
                opacity: busy ? 0.6 : 1,
              }}>
                <Avatar name={p.nome} size={38} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 700, fontSize: 14, display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                    {p.nome}
                    <Pill fg={p.ativo !== false ? COLORS.sage : COLORS.inkFaint} bg={p.ativo !== false ? COLORS.sageSoft : COLORS.bgAlt} dot>
                      {p.ativo !== false ? "Ativa" : "Inativa"}
                    </Pill>
                  </div>
                  <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>{total} atendimento{total !== 1 ? "s" : ""}</div>
                </div>
                <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                  <button disabled={busy} onClick={() => edit(p)} className="sd-btn" style={{ background: COLORS.primarySoft, border: "none", borderRadius: 9, width: 32, height: 32, cursor: "pointer", color: COLORS.primary }}>
                    <Pencil size={13.5} style={{ display: "block", margin: "0 auto" }} />
                  </button>
                  <button disabled={busy} onClick={() => toggleAtivo(p)} className="font-body sd-btn" style={{
                    background: "transparent", border: `1px solid ${COLORS.border}`, color: COLORS.inkSoft,
                    borderRadius: 9, padding: "0 10px", fontSize: 11, fontWeight: 700, cursor: "pointer", height: 32,
                  }}>
                    {p.ativo !== false ? "Desativar" : "Ativar"}
                  </button>
                  <button disabled={busy} onClick={() => remove(p)} className="sd-btn" style={{ background: COLORS.terraSoft, border: "none", borderRadius: 9, width: 32, height: 32, cursor: "pointer", color: COLORS.terra }}>
                    <Trash2 size={13.5} style={{ display: "block", margin: "0 auto" }} />
                  </button>
                </div>
              </div>
            );
          })}
        </Card>
      )}
    </div>
  );
}

function addDaysToDateStr(dateStr, days) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function buildDaysState(rows, professionalId) {
  const forThis = rows.filter(r => (r.professionalId || null) === (professionalId || null));
  return Array.from({ length: 7 }, (_, weekday) => {
    const row = forThis.find(r => r.weekday === weekday);
    return row
      ? { weekday, open: true, start: row.start, end: row.end, hasBreak: !!row.breakStart, breakStart: row.breakStart || "12:00", breakEnd: row.breakEnd || "13:00" }
      : { weekday, open: false, start: "09:00", end: "19:00", hasBreak: false, breakStart: "12:00", breakEnd: "13:00" };
  });
}

function Horarios({ data, onSaveWorkingHours, onAddTimeOff, onRemoveTimeOff }) {
  const { professionals, workingHours, timeOff } = data;
  const [selectedProf, setSelectedProf] = useState(""); // "" = padrão do estabelecimento
  const [days, setDays] = useState(() => buildDaysState(workingHours, null));
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    setDays(buildDaysState(workingHours, selectedProf || null));
  }, [selectedProf, workingHours]);

  function updateDay(weekday, patch) {
    setDays(ds => ds.map(d => d.weekday === weekday ? { ...d, ...patch } : d));
  }

  async function saveHours() {
    setSaving(true); setError(""); setSaved(false);
    try {
      await onSaveWorkingHours(selectedProf || null, days);
      setSaved(true);
      setTimeout(() => setSaved(false), 2000);
    } catch (err) { setError(err.message); }
    finally { setSaving(false); }
  }

  // --- Folgas / férias / bloqueios ---
  const [toProf, setToProf] = useState(professionals[0]?.id || "");
  const [tipo, setTipo] = useState("folga");
  const [startDate, setStartDate] = useState("");
  const [endDate, setEndDate] = useState("");
  const [startTime, setStartTime] = useState("08:00");
  const [endTime, setEndTime] = useState("18:00");
  const [motivo, setMotivo] = useState("");
  const [savingTo, setSavingTo] = useState(false);
  const [toError, setToError] = useState("");
  const [busyToId, setBusyToId] = useState(null);

  async function submitTimeOff(e) {
    e.preventDefault();
    if (!toProf || !startDate || !endDate) return;
    setSavingTo(true); setToError("");
    try {
      const payload = (tipo === "bloqueio" || tipo === "compromisso")
        ? {
            professional_id: toProf, tipo,
            start_at: new Date(`${startDate}T${startTime}:00`).toISOString(),
            end_at: new Date(`${endDate}T${endTime}:00`).toISOString(),
            motivo: motivo || null,
          }
        : {
            professional_id: toProf, tipo,
            start_at: new Date(`${startDate}T00:00:00`).toISOString(),
            end_at: new Date(`${addDaysToDateStr(endDate, 1)}T00:00:00`).toISOString(),
            motivo: motivo || null,
          };
      await onAddTimeOff(payload);
      setStartDate(""); setEndDate(""); setMotivo("");
    } catch (err) { setToError(err.message); }
    finally { setSavingTo(false); }
  }

  async function removeTo(id) {
    setBusyToId(id); setToError("");
    try { await onRemoveTimeOff(id); } catch (err) { setToError(err.message); }
    finally { setBusyToId(null); }
  }

  const tipoLabel = { folga: "Folga", ferias: "Férias", bloqueio: "Bloqueio", compromisso: "Compromisso" };
  const tipoTone = { folga: [COLORS.amber, COLORS.amberSoft], ferias: [COLORS.gold, COLORS.goldSoft], bloqueio: [COLORS.terra, COLORS.terraSoft], compromisso: [COLORS.terra, COLORS.terraSoft] };

  return (
    <div className="fade-up">
      <h1 className="font-display" style={{ fontSize: 27, margin: "2px 0 16px", fontWeight: 600 }}>Horários</h1>

      <SectionLabel>Horário de funcionamento</SectionLabel>
      <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginBottom: 12, lineHeight: 1.5 }}>
        Configure o padrão do estabelecimento ou personalize o horário de uma profissional específica. Dias sem horário ficam fechados na agenda pública.
      </div>

      <select value={selectedProf} onChange={e => setSelectedProf(e.target.value)} style={{ ...fieldStyle, marginBottom: 14 }}>
        <option value="">Padrão do estabelecimento</option>
        {professionals.map(p => <option key={p.id} value={p.id}>{p.nome} (personalizado)</option>)}
      </select>

      <ErrorBanner message={error} onDismiss={() => setError("")} />

      <Card style={{ padding: 4, overflow: "hidden", marginBottom: 14 }}>
        {days.map((d, i) => (
          <div key={d.weekday} style={{ padding: "12px", borderBottom: i < 6 ? `1px solid ${COLORS.border}` : "none" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: d.open ? 10 : 0 }}>
              <span style={{ fontWeight: 700, fontSize: 13.5 }}>{WEEKDAY_FULL[d.weekday]}</span>
              <button onClick={() => updateDay(d.weekday, { open: !d.open })} className="sd-check" style={{
                width: 40, height: 22, borderRadius: 999, border: "none", cursor: "pointer", position: "relative",
                background: d.open ? COLORS.sage : COLORS.border,
              }}>
                <span style={{
                  position: "absolute", top: 2, left: d.open ? 20 : 2, width: 18, height: 18, borderRadius: "50%",
                  background: "#fff", transition: "left 0.18s ease",
                }} />
              </button>
            </div>
            {d.open && (
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <input type="time" value={d.start} onChange={e => updateDay(d.weekday, { start: e.target.value })} style={{ ...fieldStyle, padding: "8px 10px", fontSize: 13 }} />
                  <span style={{ color: COLORS.inkFaint, fontSize: 12 }}>até</span>
                  <input type="time" value={d.end} onChange={e => updateDay(d.weekday, { end: e.target.value })} style={{ ...fieldStyle, padding: "8px 10px", fontSize: 13 }} />
                </div>
                <label style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 12, color: COLORS.inkSoft, cursor: "pointer" }}>
                  <input type="checkbox" checked={d.hasBreak} onChange={e => updateDay(d.weekday, { hasBreak: e.target.checked })} />
                  Intervalo de almoço
                </label>
                {d.hasBreak && (
                  <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                    <input type="time" value={d.breakStart} onChange={e => updateDay(d.weekday, { breakStart: e.target.value })} style={{ ...fieldStyle, padding: "8px 10px", fontSize: 13 }} />
                    <span style={{ color: COLORS.inkFaint, fontSize: 12 }}>até</span>
                    <input type="time" value={d.breakEnd} onChange={e => updateDay(d.weekday, { breakEnd: e.target.value })} style={{ ...fieldStyle, padding: "8px 10px", fontSize: 13 }} />
                  </div>
                )}
              </div>
            )}
          </div>
        ))}
      </Card>
      <PrimaryButton onClick={saveHours} loading={saving} style={{ width: "100%", marginBottom: 28 }}>
        {saved ? <><Check size={15} /> Salvo</> : "Salvar horários"}
      </PrimaryButton>

      <SectionLabel>Folgas, férias e bloqueios</SectionLabel>
      {professionals.length === 0 ? (
        <Card style={{ padding: 16, textAlign: "center", color: COLORS.inkFaint, fontSize: 13 }}>Cadastre uma profissional em Equipe primeiro.</Card>
      ) : (
        <>
          <Card style={{ padding: 16, marginBottom: 16 }}>
            <ErrorBanner message={toError} onDismiss={() => setToError("")} />
            <form onSubmit={submitTimeOff} style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              <select value={toProf} onChange={e => setToProf(e.target.value)} style={fieldStyle}>
                {professionals.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}
              </select>
              <select value={tipo} onChange={e => setTipo(e.target.value)} style={fieldStyle}>

                <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} style={fieldStyle} />
