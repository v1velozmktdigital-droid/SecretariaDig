              {(tipo === "bloqueio" || tipo === "compromisso") && (
                <div style={{ display: "flex", gap: 8 }}>
                  <input type="time" value={startTime} onChange={e => setStartTime(e.target.value)} style={fieldStyle} />
                  <input type="time" value={endTime} onChange={e => setEndTime(e.target.value)} style={fieldStyle} />

              )}
              <input placeholder="Motivo (opcional)" value={motivo} onChange={e => setMotivo(e.target.value)} style={fieldStyle} />
              <PrimaryButton type="submit" loading={savingTo}><Plus size={15} /> Adicionar</PrimaryButton>
            </form>
          </Card>

          {timeOff.length === 0 ? (
            <Card style={{ padding: 16, textAlign: "center", color: COLORS.inkFaint, fontSize: 13 }}>Nenhuma folga, férias ou bloqueio cadastrado.</Card>
          ) : (
            <Card style={{ padding: 4, overflow: "hidden" }}>
              {timeOff.map((t, i) => {
                const prof = professionals.find(p => p.id === t.professionalId);
                const [fg, bg] = tipoTone[t.tipo] || [COLORS.inkSoft, COLORS.bgAlt];
                return (
                  <div key={t.id} className="sd-row" style={{
                    display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px",

                      <div style={{ display: "flex", alignItems: "center", gap: 7, fontWeight: 700, fontSize: 13 }}>

                      <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 4 }}>

                        {new Date(t.endAt).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: (t.tipo === "bloqueio" || t.tipo === "compromisso") ? "2-digit" : undefined, minute: (t.tipo === "bloqueio" || t.tipo === "compromisso") ? "2-digit" : undefined })}

      )}

  );
}

/* ---------------------------------------------------------
   ADMIN: SERVIÇOS
--------------------------------------------------------- */
function Servicos({ data, onAdd, onUpdate, onRemove }) {
  const { services } = data;
  const [form, setForm] = useState({ nome: "", duracao: "", preco: "" });
  const [editingId, setEditingId] = useState(null);
  const [saving, setSaving] = useState(false);
  const [busyId, setBusyId] = useState(null);
  const [error, setError] = useState("");

  async function submit(e) {
    e.preventDefault();
    if (!form.nome.trim()) return;
    setSaving(true); setError("");
    try {
      const payload = { nome: form.nome, duracao_min: Number(form.duracao) || 1, preco: Number(form.preco) || 0 };
      if (editingId) await onUpdate(editingId, payload);
      else await onAdd(payload);
      setForm({ nome: "", duracao: "", preco: "" });
      setEditingId(null);
    } catch (err) { setError(err.message); }
    finally { setSaving(false); }
  }

  function edit(sv) {
    setEditingId(sv.id);
    setForm({ nome: sv.nome, duracao: String(sv.duracao), preco: String(sv.preco) });
  }

  async function remove(id) {
    setBusyId(id); setError("");
    try {
      await onRemove(id);
      if (editingId === id) { setEditingId(null); setForm({ nome: "", duracao: "", preco: "" }); }
    } catch (err) { setError(err.message); }
    finally { setBusyId(null); }
  }

  return (
    <div className="fade-up">
      <h1 className="font-display" style={{ fontSize: 27, margin: "2px 0 16px", fontWeight: 600 }}>Serviços</h1>
      <ErrorBanner message={error} onDismiss={() => setError("")} />

      <Card style={{ padding: 16, marginBottom: 16 }}>
        <SectionLabel>{editingId ? "Editar serviço" : "Novo serviço"}</SectionLabel>
        <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <input placeholder="Nome do serviço" value={form.nome} onChange={e => setForm(f => ({ ...f, nome: e.target.value }))} style={fieldStyle} />
          <div style={{ display: "flex", gap: 10 }}>
            <input placeholder="Duração (min)" type="number" value={form.duracao} onChange={e => setForm(f => ({ ...f, duracao: e.target.value }))} style={fieldStyle} />
            <input placeholder="Preço (R$)" type="number" value={form.preco} onChange={e => setForm(f => ({ ...f, preco: e.target.value }))} style={fieldStyle} />
          </div>
          <PrimaryButton type="submit" loading={saving} style={{ marginTop: 2 }}>
            <Plus size={15} /> {editingId ? "Salvar alterações" : "Adicionar serviço"}
          </PrimaryButton>
          {editingId && (
            <button type="button" onClick={() => { setEditingId(null); setForm({ nome: "", duracao: "", preco: "" }); }}
              className="font-body" style={{ background: "none", border: "none", color: COLORS.inkFaint, fontSize: 12, cursor: "pointer" }}>
              Cancelar edição
            </button>
          )}
        </form>
      </Card>

      {services.length === 0 ? (
        <Card style={{ padding: 18, textAlign: "center", color: COLORS.inkFaint, fontSize: 13 }}>Nenhum serviço cadastrado ainda.</Card>
      ) : (
        <Card style={{ padding: 4, overflow: "hidden" }}>
          {services.map((sv, i) => (
            <div key={sv.id} className="sd-row" style={{
              display: "flex", justifyContent: "space-between", alignItems: "center", padding: "13px 12px",
              borderBottom: i < services.length - 1 ? `1px solid ${COLORS.border}` : "none", borderRadius: 10,
              opacity: busyId === sv.id ? 0.6 : 1,
            }}>
              <div>
                <div style={{ fontWeight: 700, fontSize: 14 }}>{sv.nome}</div>
                <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>{sv.duracao} min · R$ {sv.preco}</div>
              </div>
              <div style={{ display: "flex", gap: 6 }}>
                <button onClick={() => edit(sv)} className="sd-btn" style={{ background: COLORS.primarySoft, border: "none", borderRadius: 9, width: 32, height: 32, cursor: "pointer", color: COLORS.primary }}>
                  <Pencil size={13.5} style={{ display: "block", margin: "0 auto" }} />
                </button>
                <button disabled={busyId === sv.id} onClick={() => remove(sv.id)} className="sd-btn" style={{ background: COLORS.terraSoft, border: "none", borderRadius: 9, width: 32, height: 32, cursor: "pointer", color: COLORS.terra }}>
                  <Trash2 size={13.5} style={{ display: "block", margin: "0 auto" }} />
                </button>
              </div>
            </div>
          ))}
        </Card>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   ADMIN: LISTA DE COMPRAS
--------------------------------------------------------- */
function Compras({ data, onAdd, onToggle, onRemove }) {
  const { shoppingList } = data;
  const [novo, setNovo] = useState("");
  const [categoria, setCategoria] = useState(CATEGORIES[0]);
  const [saving, setSaving] = useState(false);
  const [busyId, setBusyId] = useState(null);
  const [error, setError] = useState("");

  async function add(e) {
    e.preventDefault();
    if (!novo.trim()) return;
    setSaving(true); setError("");
    try {
      await onAdd({ nome: novo, categoria, comprado: false });
      setNovo("");
    } catch (err) { setError(err.message); }
    finally { setSaving(false); }
  }
  async function toggle(item) {
    setBusyId(item.id);
    try { await onToggle(item.id, !item.comprado); } catch (err) { setError(err.message); }
    finally { setBusyId(null); }
  }
  async function remove(id) {
    setBusyId(id);
    try { await onRemove(id); } catch (err) { setError(err.message); }
    finally { setBusyId(null); }
  }

  function shareOnWhatsApp() {
    const pending = shoppingList.filter(item => !item.comprado);
    if (pending.length === 0) { setError("Não há itens pendentes para enviar."); return; }
    const lines = ["🛒 *Lista de compras*", ""];
    CATEGORIES.forEach(cat => {
      const items = pending.filter(item => item.categoria === cat);
      if (items.length > 0) {
        lines.push(`*${cat}*`);
        items.forEach(item => lines.push(`☐ ${item.nome}`));
        lines.push("");
      }
    });
    window.open(`https://wa.me/?text=${encodeURIComponent(lines.join("\n").trim())}`, "_blank", "noopener,noreferrer");
  }

  return (
    <div className="fade-up">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, margin: "2px 0 16px" }}>
        <h1 className="font-display" style={{ fontSize: 27, margin: 0, fontWeight: 600 }}>Lista de compras</h1>
        <button onClick={shareOnWhatsApp} className="font-body sd-btn" style={{
          background: "#1E9E56", color: "#fff", border: "none", borderRadius: 999,
          padding: "9px 13px", fontSize: 11.5, fontWeight: 700, cursor: "pointer",
          display: "flex", alignItems: "center", gap: 6, flexShrink: 0,
        }}><MessageCircle size={14} /> WhatsApp</button>
      </div>
      <ErrorBanner message={error} onDismiss={() => setError("")} />

      <Card style={{ padding: 16, marginBottom: 20 }}>
        <SectionLabel>Novo item</SectionLabel>
        <form onSubmit={add} style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <input placeholder="Nome do item" value={novo} onChange={e => setNovo(e.target.value)} style={fieldStyle} />
          <select value={categoria} onChange={e => setCategoria(e.target.value)} style={fieldStyle}>
            {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
          <PrimaryButton type="submit" loading={saving} style={{ marginTop: 2 }}><Plus size={15} /> Adicionar item</PrimaryButton>
        </form>
      </Card>

      {shoppingList.length === 0 && (
        <Card style={{ padding: 18, textAlign: "center", color: COLORS.inkFaint, fontSize: 13 }}>Lista vazia por enquanto.</Card>
      )}

      {CATEGORIES.map(cat => {
        const items = shoppingList.filter(i => i.categoria === cat);
        if (items.length === 0) return null;
        return (
          <div key={cat} style={{ marginBottom: 18 }}>
            <SectionLabel>{cat}</SectionLabel>
            <Card style={{ padding: 4, overflow: "hidden" }}>
              {items.map((item, i) => (
                <div key={item.id} className="sd-row" style={{
                  display: "flex", alignItems: "center", gap: 11, padding: "11px 12px",
                  borderBottom: i < items.length - 1 ? `1px solid ${COLORS.border}` : "none", borderRadius: 10,
                  opacity: busyId === item.id ? 0.6 : 1,
                }}>
                  <button onClick={() => toggle(item)} className="sd-check" style={{
                    width: 21, height: 21, borderRadius: 7, border: `1.5px solid ${item.comprado ? COLORS.sage : COLORS.borderStrong}`,
                    background: item.comprado ? COLORS.sage : "transparent", cursor: "pointer", flexShrink: 0,
                    display: "flex", alignItems: "center", justifyContent: "center",
                  }}>
                    {item.comprado && <Check size={13} color="#fff" />}
                  </button>
                  <span style={{
                    flex: 1, fontSize: 13.5,
                    textDecoration: item.comprado ? "line-through" : "none",
                    color: item.comprado ? COLORS.inkFaint : COLORS.ink,
                    transition: "color 0.15s ease",
                  }}>{item.nome}</span>
                  <button onClick={() => remove(item.id)} className="sd-btn" style={{ background: "transparent", border: "none", cursor: "pointer", color: COLORS.inkFaint, padding: 4 }}>
                    <Trash2 size={15} />
                  </button>
                </div>
              ))}
            </Card>
          </div>
        );
      })}
    </div>
  );
}

/* ---------------------------------------------------------
   ADMIN: FINANCEIRO
--------------------------------------------------------- */
function earningsInRange(appointments, services, start, end) {
  const priceMap = Object.fromEntries(services.map(s => [s.id, s.preco]));
  return appointments
    .filter(a => a.status !== "cancelado")
    .filter(a => { const d = new Date(a.data + "T00:00:00"); return d >= start && d < end; })
    .reduce((sum, a) => sum + (priceMap[a.servicoId] || 0), 0);
}

function Financeiro({ data }) {
  const { appointments, services } = data;
  const [mode, setMode] = useState("month"); // week | month | year
  const now = new Date();

  const { total, rows, periodLabel } = useMemo(() => {
    if (mode === "week") {
      const start = new Date(now); start.setHours(0, 0, 0, 0); start.setDate(now.getDate() - now.getDay());
      const rows = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(start); d.setDate(start.getDate() + i);
        const next = new Date(d); next.setDate(d.getDate() + 1);
        rows.push({ label: `${WEEKDAY_FULL[d.getDay()].slice(0, 3)} ${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`, value: earningsInRange(appointments, services, d, next) });
      }
      const end = new Date(start); end.setDate(start.getDate() + 7);
      return { total: earningsInRange(appointments, services, start, end), rows, periodLabel: "Semana atual" };
    }
    if (mode === "year") {
      const start = new Date(now.getFullYear(), 0, 1);
      const rows = [];
      for (let m = 0; m < 12; m++) {
        const d = new Date(now.getFullYear(), m, 1);
        const next = new Date(now.getFullYear(), m + 1, 1);
        rows.push({ label: MONTH_NAMES[m], value: earningsInRange(appointments, services, d, next) });
      }
      const end = new Date(now.getFullYear() + 1, 0, 1);
      return { total: earningsInRange(appointments, services, start, end), rows, periodLabel: `Ano ${now.getFullYear()}` };
    }
    // month
    const start = new Date(now.getFullYear(), now.getMonth(), 1);
    const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
    const rows = [];
    for (let day = 1; day <= daysInMonth; day++) {
      const d = new Date(now.getFullYear(), now.getMonth(), day);
      const next = new Date(now.getFullYear(), now.getMonth(), day + 1);
      const val = earningsInRange(appointments, services, d, next);
      if (val > 0) rows.push({ label: `${String(day).padStart(2, "0")}/${String(now.getMonth() + 1).padStart(2, "0")}`, value: val });
    }
    const end = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    return { total: earningsInRange(appointments, services, start, end), rows, periodLabel: `${MONTH_NAMES[now.getMonth()]} ${now.getFullYear()}` };
  }, [mode, appointments, services]);

  function downloadCsv() {
    const lines = ["Período;Valor (R$)", ...rows.map(r => `${r.label};${r.value.toFixed(2).replace(".", ",")}`), `TOTAL;${total.toFixed(2).replace(".", ",")}`];
    const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `financeiro-${mode}-${periodLabel.replace(/\s/g, "-")}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  return (
    <div className="fade-up">
      <h1 className="font-display" style={{ fontSize: 27, margin: "2px 0 16px", fontWeight: 600 }}>Financeiro</h1>

      <div className="scrollbar-thin" style={{ display: "flex", gap: 6, marginBottom: 16, background: COLORS.bgAlt, padding: 4, borderRadius: 13 }}>
        {[{ k: "week", l: "Semana" }, { k: "month", l: "Mês" }, { k: "year", l: "Ano" }].map(f => (
          <button key={f.k} onClick={() => setMode(f.k)} className="font-body sd-tab" style={{

function Fidelidade({ data, onAddReward, onUpdateReward, onRemoveReward, onRedeem }) {
  const { clients, rewards = [] } = data;
  const [nome, setNome] = useState("");
  const [custo, setCusto] = useState("");
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");
  const [redeemFor, setRedeemFor] = useState(null); // client
  const [redeeming, setRedeeming] = useState(false);

  async function addReward(e) {
    e.preventDefault();
    if (!nome.trim() || !custo) return;
    setSaving(true); setError("");
    try {
      await onAddReward({ nome, custo_pontos: Number(custo) });
      setNome(""); setCusto("");
    } catch (err) { setError(err.message); }
    finally { setSaving(false); }
  }

  async function removeReward(id) {
    try { await onRemoveReward(id); } catch (err) { setError(err.message); }
  }

  async function redeem(reward) {
    setRedeeming(true); setError("");
    try {
      await onRedeem(redeemFor.id, reward.id);
      setRedeemFor(null);
    } catch (err) { setError(err.message); }
    finally { setRedeeming(false); }

          <button type="submit" disabled={saving} className="sd-btn" style={{

      {ranked.length === 0 ? (

      ) : (

// Apenas o calendário de dias é gerado no cliente (14 dias corridos
// a partir de hoje) — os HORÁRIOS dentro de cada dia nunca são uma
// lista fixa: eles vêm sempre da RPC get_available_slots, calculada
// em tempo real a partir do horário de funcionamento, folgas/férias/
// bloqueios e agendamentos já existentes no banco.
function nextCalendarDays(n = 14) {
  const out = [];
  const d = new Date();
  for (let i = 0; out.length < n && i < n + 7; i++) {
    out.push(d.toISOString().slice(0, 10));
    d.setDate(d.getDate() + 1);
  }
  return out;
}

}

function ClientBooking({ establishment, catalog, catalogLoading, catalogError, onBook, footer }) {
  const [step, setStep] = useState(1);
  const [servicoId, setServicoId] = useState(null);
  const [profissionalId, setProfissionalId] = useState(null);
  const [data, setData] = useState(null);
  const [horario, setHorario] = useState(null);
  const [nome, setNome] = useState("");
  const [whatsapp, setWhatsapp] = useState("");
  const [nascimento, setNascimento] = useState("");
  const [observacao, setObservacao] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState("");
  const [done, setDone] = useState(false);

  const [slots, setSlots] = useState([]);
  const [slotsLoading, setSlotsLoading] = useState(false);
  const [slotsError, setSlotsError] = useState("");

  const services = catalog?.services || [];
  const professionals = catalog?.professionals || [];
  const todayD = useMemo(() => new Date(), []);
  const [viewYear, setViewYear] = useState(todayD.getFullYear());
  const [viewMonth, setViewMonth] = useState(todayD.getMonth());
  const minBookDate = todayIso();
  const maxBookDate = useMemo(() => {
    const d = new Date();
    d.setDate(d.getDate() + (establishment.bookingWindowDays || 90));
    return d.toISOString().slice(0, 10);
  }, [establishment.bookingWindowDays]);
  const stepLabels = ["Serviço", "Profissional", "Data/Hora", "Seus dados"];

  // Disponibilidade real: sempre que serviço + profissional + data
  // estiverem escolhidos, busca os horários livres direto no banco
  // (get_available_slots), nunca uma lista fixa no front-end.
  useEffect(() => {
    if (!servicoId || !profissionalId || !data) { setSlots([]); return; }
    let cancelled = false;
    setSlotsLoading(true); setSlotsError(""); setHorario(null);
    rest.rpc("get_available_slots", {
      p_establishment_id: establishment.id,
      p_professional_id: profissionalId,
      p_service_id: servicoId,
      p_date: data,
    })
      .then(rows => { if (!cancelled) setSlots((rows || []).map(r => (r.slot || "").slice(0, 5)).filter(Boolean)); })
      .catch(err => { if (!cancelled) setSlotsError(err.message); })
      .finally(() => { if (!cancelled) setSlotsLoading(false); });
    return () => { cancelled = true; };
  }, [servicoId, profissionalId, data, establishment.id]);

  function reset() {
    setStep(1); setServicoId(null); setProfissionalId(null); setData(null); setHorario(null);
    setNome(""); setWhatsapp(""); setNascimento(""); setObservacao(""); setDone(false); setError("");
  }

  async function submit(e) {
    e.preventDefault();
    if (!nome.trim() || !whatsapp.trim()) return;
    setSubmitting(true); setError("");
    try {
      await onBook({
        p_establishment_id: establishment.id,
        p_service_id: servicoId,
        p_professional_id: profissionalId,
        p_data: data,
        p_horario: horario + ":00",
        p_cliente_nome: nome,
        p_cliente_whatsapp: whatsapp.replace(/\D/g, ""),
        p_cliente_email: null,
        p_observacao: observacao || null,
        p_data_nascimento: nascimento || null,
      });
      setDone(true);
    } catch (err) {
      setError(err.message);
      // O horário pode ter sido ocupado por outra pessoa entre a
      // escolha e o envio — atualiza a lista de horários livres.
      if (/hor[aá]rio/i.test(err.message)) {
        setHorario(null);
        rest.rpc("get_available_slots", {
          p_establishment_id: establishment.id, p_professional_id: profissionalId,
          p_service_id: servicoId, p_date: data,
        }).then(rows => setSlots((rows || []).map(r => (r.slot || "").slice(0, 5)).filter(Boolean))).catch(() => {});
      }
    }
    finally { setSubmitting(false); }
  }

  if (catalogLoading) {
    return <ClientFrame platformName={establishment.platformName} footer={footer}><FullScreenLoader label="Carregando serviços..." /></ClientFrame>;
  }
  if (catalogError) {
    return <ClientFrame platformName={establishment.platformName} footer={footer}><ErrorBanner message={catalogError} /></ClientFrame>;
  }

  if (done) {
    const servico = services.find(s => s.id === servicoId);
    const prof = professionals.find(p => p.id === profissionalId);
    return (
      <ClientFrame platformName={establishment.platformName} footer={footer}>
        <div className="pop-in" style={{ textAlign: "center", padding: "36px 16px" }}>
          <div style={{
            width: 68, height: 68, borderRadius: "50%", background: COLORS.sageSoft,
            display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 18px",
            animation: "ringPulse 1.4s ease-out infinite",
          }}>
            <Check size={30} color={COLORS.sage} strokeWidth={2.5} />
          </div>
          <h2 className="font-display" style={{ fontSize: 25, margin: "0 0 8px", fontWeight: 600 }}>Horário solicitado!</h2>
          <p style={{ color: COLORS.inkSoft, fontSize: 14, lineHeight: 1.65, maxWidth: 300, margin: "0 auto 26px" }}>
            {servico?.nome} com {prof?.nome}, em {fmtDate(data)} às {horario}. Você vai receber uma mensagem para confirmar.
          </p>
          <GhostButton onClick={reset}>Agendar outro horário</GhostButton>
        </div>
      </ClientFrame>
    );
  }

  return (
    <ClientFrame platformName={establishment.platformName} footer={footer}>
      <Stepper step={step} labels={stepLabels} />
      <ErrorBanner message={error} onDismiss={() => setError("")} />

      {step === 1 && (
        <div className="fade-up">
          <h2 className="font-display" style={{ fontSize: 21, margin: "0 0 14px", fontWeight: 600 }}>Escolha o serviço</h2>
          {services.length === 0 && <div style={{ color: COLORS.inkFaint, fontSize: 13 }}>Nenhum serviço disponível no momento.</div>}
          <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
            {services.map(sv => (
              <SelectCard key={sv.id} selected={servicoId === sv.id} onClick={() => { setServicoId(sv.id); setStep(2); }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 14.5 }}>{sv.nome}</div>
                    <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>{sv.duracao} min</div>
                  </div>
                  <div className="font-display" style={{ fontSize: 16, fontWeight: 600, color: COLORS.primary }}>R$ {sv.preco}</div>
                </div>
              </SelectCard>
            ))}
          </div>
        </div>
      )}

      {step === 2 && (
        <div className="fade-up">
          <BackRow onBack={() => setStep(1)} />
          <h2 className="font-display" style={{ fontSize: 21, margin: "0 0 14px", fontWeight: 600 }}>Escolha a profissional</h2>
          <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
            {professionals.map(p => (
              <SelectCard key={p.id} selected={profissionalId === p.id} onClick={() => { setProfissionalId(p.id); setStep(3); }}>
                <div style={{ display: "flex", alignItems: "center", gap: 11 }}>
                  <Avatar name={p.nome} size={36} />
                  <div style={{ fontWeight: 700, fontSize: 14.5 }}>{p.nome}</div>
                </div>
              </SelectCard>
            ))}
          </div>
        </div>
      )}

      {step === 3 && (
        <div className="fade-up">
          <BackRow onBack={() => setStep(2)} />
          <h2 className="font-display" style={{ fontSize: 21, margin: "0 0 14px", fontWeight: 600 }}>Escolha a data</h2>
          <Card style={{ padding: 14, marginBottom: 18 }}>
            <MonthCalendar
              year={viewYear} month={viewMonth}
              onNavigate={(delta) => { const n = addMonths(viewYear, viewMonth, delta); setViewYear(n.year); setViewMonth(n.month); }}
              selectedDate={data}
              onSelectDate={setData}
              minDate={minBookDate}
              maxDate={maxBookDate}
            />
          </Card>
          {data && (
            <>
              <h2 className="font-display" style={{ fontSize: 18, margin: "0 0 12px", fontWeight: 600 }}>Escolha o horário</h2>
              {slotsLoading && <div style={{ color: COLORS.inkFaint, fontSize: 13, display: "flex", alignItems: "center", gap: 8 }}><Spinner size={14} color={COLORS.inkFaint} /> Verificando disponibilidade real...</div>}
              {!slotsLoading && slotsError && <ErrorBanner message={slotsError} />}
              {!slotsLoading && !slotsError && slots.length === 0 && (
                <div style={{ color: COLORS.inkFaint, fontSize: 13 }}>Nenhum horário livre nesta data. Tente outro dia.</div>
              )}
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 9 }}>
                {slots.map(h => (
                  <SelectCard key={h} selected={horario === h} onClick={() => { setHorario(h); setStep(4); }} style={{ textAlign: "center", padding: "13px 6px" }}>
                    <div className="font-display" style={{ fontWeight: 700, fontSize: 14.5 }}>{h}</div>
                  </SelectCard>
                ))}
              </div>
            </>
          )}
        </div>
      )}

      {step === 4 && (
        <div className="fade-up">
          <BackRow onBack={() => setStep(3)} />
          <h2 className="font-display" style={{ fontSize: 21, margin: "0 0 14px", fontWeight: 600 }}>Seus dados</h2>
          <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <input placeholder="Seu nome" value={nome} onChange={e => setNome(e.target.value)} style={fieldStyle} />
            <input placeholder="WhatsApp (com DDD)" value={whatsapp} onChange={e => setWhatsapp(e.target.value)} style={fieldStyle} />
            <div>
              <label style={{ fontSize: 11.5, color: COLORS.inkSoft, fontWeight: 600 }}>Data de nascimento (opcional)</label>
              <input type="date" value={nascimento} onChange={e => setNascimento(e.target.value)} style={{ ...fieldStyle, marginTop: 4 }} />
            </div>
            <textarea placeholder="Observação (opcional)" value={observacao} onChange={e => setObservacao(e.target.value)} rows={3} style={{ ...fieldStyle, resize: "vertical" }} />
            <PrimaryButton type="submit" loading={submitting} disabled={!nome.trim() || !whatsapp.trim()} style={{ width: "100%", marginTop: 6 }}>
              Confirmar solicitação
            </PrimaryButton>
          </form>
        </div>
      )}
    </ClientFrame>
  );
}

function Row({ label, value, last }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", padding: "10px 0", borderBottom: last ? "none" : `1px solid ${COLORS.border}`, fontSize: 13.5 }}>

function Banner({ tone, text }) {
  const bg = tone === "sage" ? COLORS.sageSoft : COLORS.terraSoft;
  const fg = tone === "sage" ? COLORS.sage : COLORS.terra;
  return (
    <div className="pop-in" style={{ background: bg, color: fg, borderRadius: 11, padding: "13px 14px", fontWeight: 700, fontSize: 13.5, textAlign: "center" }}>

    </div>

}

function ConfirmationLinkPage({ token, info, loading, error, onResolve, onClose }) {
  const [busy, setBusy] = useState(false);
  const [localStatus, setLocalStatus] = useState(null);

  async function decide(status) {
    setBusy(true);
    try {
      await onResolve(token, status);
      setLocalStatus(status);
    } catch (err) { /* surfaced via error state upstream */ }
    finally { setBusy(false); }
  }

  const status = localStatus || info?.status;

  return (
    <div className="font-body" style={{ minHeight: "100%", background: COLORS.bg, display: "flex", flexDirection: "column" }}>
      {onClose && (
        <div style={{ padding: "16px 18px" }}>
          <button onClick={onClose} className="font-body sd-btn" style={{ background: "transparent", border: "none", color: COLORS.inkSoft, display: "flex", alignItems: "center", gap: 4, cursor: "pointer", fontSize: 13, fontWeight: 600 }}>
            <ArrowLeft size={15} /> Fechar link
          </button>
        </div>
      )}
      <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
        {loading ? (
          <FullScreenLoader label="Carregando seu horário..." />
        ) : error ? (
          <Card className="pop-in" style={{ padding: 28, maxWidth: 360, width: "100%" }}>
            <ErrorBanner message={error} />
          </Card>
        ) : info ? (
          <Card className="pop-in" style={{ padding: 28, maxWidth: 360, width: "100%", boxShadow: COLORS.shadowLg }}>
            <div style={{ textAlign: "center", marginBottom: 20 }}>
              <Avatar name={info.cliente_nome} size={46} />
              <h2 className="font-display" style={{ fontSize: 21, margin: "12px 0 3px", fontWeight: 600 }}>Olá, {info.cliente_nome?.split(" ")[0]}!</h2>
              <p style={{ color: COLORS.inkSoft, fontSize: 13, margin: 0 }}>Confirme ou cancele seu horário abaixo.</p>
            </div>

            <div style={{ background: COLORS.bgAlt, borderRadius: 13, padding: "6px 14px", marginBottom: 20 }}>
              <Row label="Data" value={fmtDate(info.data)} />
              <Row label="Horário" value={(info.horario || "").slice(0, 5)} />
              <Row label="Serviço" value={info.servico_nome} />
              <Row label="Profissional" value={info.profissional_nome} last />
            </div>

            {status === "confirmado" && <Banner tone="sage" text="Você confirmou este horário. ✅" />}
            {status === "cancelado" && <Banner tone="terra" text="Você cancelou este horário. ❌" />}

            {status === "aguardando" && (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <PrimaryButton onClick={() => decide("confirmado")} loading={busy} style={{ background: `linear-gradient(155deg, ${COLORS.sage}, #285C3C)`, boxShadow: "0 8px 20px -8px rgba(62,122,85,0.45)" }}>
                  <Check size={16} /> Confirmar horário
                </PrimaryButton>
                <button disabled={busy} onClick={() => decide("cancelado")} className="font-body sd-btn" style={{
                  background: "transparent", border: `1.5px solid ${COLORS.terra}66`, color: COLORS.terra,
                  borderRadius: 999, padding: "13px 20px", fontWeight: 650, fontSize: 14, cursor: "pointer",
                }}>
                  <X size={16} style={{ verticalAlign: -3, marginRight: 6 }} /> Cancelar horário
                </button>
              </div>
            )}
          </Card>
        ) : null}
      </div>
    </div>
  );
}

function EstablishmentFormModal({ initial, plans, onSave, onClose }) {
  const [form, setForm] = useState(initial || {
    nome_estabelecimento: "", nome_responsavel: "", whatsapp: "", email: "", senha: "", plan_id: "",
  });
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");
  const isNew = !initial;

  async function submit(e) {
    e.preventDefault();
    setSaving(true); setError("");
    try {
      await onSave(form);
    } catch (err) { setError(err.message); }
    finally { setSaving(false); }
  }

  return (
    <div style={{
      position: "fixed", inset: 0, background: "rgba(36,20,25,0.5)", zIndex: 50,
      display: "flex", alignItems: "flex-end", justifyContent: "center",

          <h2 className="font-display" style={{ fontSize: 20, margin: "0 0 16px", fontWeight: 600 }}>
            {isNew ? "Novo estabelecimento" : "Editar estabelecimento"}
          </h2>
          <ErrorBanner message={error} onDismiss={() => setError("")} />
          <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <input placeholder="Nome do estabelecimento" value={form.nome_estabelecimento} onChange={e => setForm(f => ({ ...f, nome_estabelecimento: e.target.value }))} style={fieldStyle} />
            <input placeholder="Nome da responsável" value={form.nome_responsavel} onChange={e => setForm(f => ({ ...f, nome_responsavel: e.target.value }))} style={fieldStyle} />
            <input placeholder="WhatsApp" value={form.whatsapp} onChange={e => setForm(f => ({ ...f, whatsapp: e.target.value }))} style={fieldStyle} />
            <input placeholder="E-mail" type="email" value={form.email} onChange={e => setForm(f => ({ ...f, email: e.target.value }))} disabled={!isNew} style={{ ...fieldStyle, opacity: isNew ? 1 : 0.6 }} />
            {isNew && <input placeholder="Senha inicial" type="password" value={form.senha} onChange={e => setForm(f => ({ ...f, senha: e.target.value }))} style={fieldStyle} />}
            <select value={form.plan_id || ""} onChange={e => setForm(f => ({ ...f, plan_id: e.target.value }))} style={fieldStyle}>
              <option value="">Sem plano definido</option>
              {plans.map(p => <option key={p.id} value={p.id}>{p.nome} — R$ {p.preco} ({p.periodicidade})</option>)}
            </select>
            <PrimaryButton type="submit" loading={saving} style={{ marginTop: 4 }}>
              {isNew ? "Criar estabelecimento" : "Salvar alterações"}
            </PrimaryButton>
            <GhostButton onClick={onClose} style={{ justifyContent: "center" }}>Cancelar</GhostButton>
          </form>
        </Card>
      </div>
    </div>
  );
}

function BlockModal({ establishment, onConfirm, onClose }) {
  const [reason, setReason] = useState("");
  const [saving, setSaving] = useState(false);
  const blocking = establishment.status !== "bloqueado";

  async function confirm() {
    setSaving(true);
    try { await onConfirm(blocking ? "bloqueado" : "ativo", blocking ? reason : null); onClose(); }
    finally { setSaving(false); }
  }

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(36,20,25,0.5)", zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }} onClick={onClose}>
      <Card className="pop-in" style={{ padding: 22, maxWidth: 360, width: "100%" }} onClick={e => e.stopPropagation()}>
        <h2 className="font-display" style={{ fontSize: 19, margin: "0 0 10px", fontWeight: 600 }}>
          {blocking ? "Bloquear" : "Desbloquear"} {establishment.nomeEstabelecimento}?

        {blocking ? (
          <>
            <p style={{ fontSize: 13, color: COLORS.inkSoft, margin: "0 0 12px" }}>
              O painel e a agenda pública deste estabelecimento ficam inacessíveis até o desbloqueio.
