      )}
    </div>
  );
}

/* ---------------------------------------------------------
   ADMIN: SERVIÇOS
--------------------------------------------------------- */
function Servicos({ data, onAdd, onUpdate, onRemove, onAddCategory, onRemoveCategory }) {
  const { services, serviceCategories = [] } = data;
  const [form, setForm] = useState({ nome: "", duracao: "", preco: "", categoryId: "" });
  const [duracaoCustom, setDuracaoCustom] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [saving, setSaving] = useState(false);
  const [busyId, setBusyId] = useState(null);
  const [error, setError] = useState("");
  const [novaCategoria, setNovaCategoria] = useState("");
  const [savingCategoria, setSavingCategoria] = useState(false);
  const [busyCategoriaId, setBusyCategoriaId] = useState(null);

  async function submit(e) {
    e.preventDefault();
    if (!form.nome.trim()) return;
    setSaving(true); setError("");
    try {
      const payload = { nome: form.nome, duracao_min: Number(form.duracao) || 1, preco: Number(form.preco) || 0, category_id: form.categoryId || null };
      if (editingId) await onUpdate(editingId, payload);
      else await onAdd(payload);
      setForm({ nome: "", duracao: "", preco: "", categoryId: "" });
      setDuracaoCustom(false);
      setEditingId(null);
    } catch (err) { setError(err.message); }
    finally { setSaving(false); }
  }

  function edit(sv) {
    setEditingId(sv.id);
    setForm({ nome: sv.nome, duracao: String(sv.duracao), preco: String(sv.preco), categoryId: sv.categoryId || "" });
    setDuracaoCustom(!DURATION_OPTIONS.some(o => o.min === sv.duracao));
  }

  async function remove(id) {
    setBusyId(id); setError("");
    try {
      await onRemove(id);
      if (editingId === id) { setEditingId(null); setForm({ nome: "", duracao: "", preco: "", categoryId: "" }); setDuracaoCustom(false); }
    } catch (err) { setError(err.message); }
    finally { setBusyId(null); }
  }

  async function addCategoria(e) {
    e.preventDefault();
    if (!novaCategoria.trim()) return;
    setSavingCategoria(true); setError("");
    try { await onAddCategory(novaCategoria); setNovaCategoria(""); }
    catch (err) { setError(err.message); }
    finally { setSavingCategoria(false); }
  }

  async function removeCategoria(id) {
    setBusyCategoriaId(id);
    try { await onRemoveCategory(id); } catch (err) { setError(err.message); }
    finally { setBusyCategoriaId(null); }
  }

  // Agrupa os serviços por categoria — sem categoria fica num grupo à parte, no fim.
  const grupos = [
    ...serviceCategories.map(cat => ({ id: cat.id, nome: cat.nome, servicos: services.filter(s => s.categoryId === cat.id) })),
    { id: null, nome: "Sem categoria", servicos: services.filter(s => !s.categoryId) },
  ].filter(g => g.servicos.length > 0 || g.id !== null);

  return (
    <div className="fade-up">
      <h1 className="font-display" style={{ fontSize: 27, margin: "2px 0 16px", fontWeight: 600 }}>Serviços</h1>
      <ErrorBanner message={error} onDismiss={() => setError("")} />

      <Card style={{ padding: 16, marginBottom: 16 }}>
        <SectionLabel>Categorias</SectionLabel>
        <div style={{ fontSize: 12, color: COLORS.inkFaint, marginBottom: 10, marginTop: -6 }}>
          Agrupe os serviços (ex: "Unha", "Cabelo", "Sobrancelha") pra facilitar quando a cliente for agendar.
        </div>
        {serviceCategories.length > 0 && (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginBottom: 10 }}>
            {serviceCategories.map(cat => (
              <div key={cat.id} style={{
                display: "flex", alignItems: "center", gap: 6, background: COLORS.primarySoft,
                borderRadius: 999, padding: "6px 6px 6px 12px", opacity: busyCategoriaId === cat.id ? 0.5 : 1,
              }}>
                <span style={{ fontSize: 12.5, fontWeight: 700, color: COLORS.primary }}>{cat.nome}</span>
                <button disabled={busyCategoriaId === cat.id} onClick={() => removeCategoria(cat.id)} className="sd-btn" style={{
                  background: "none", border: "none", cursor: "pointer", color: COLORS.primary, padding: 4, display: "flex",
                }}>
                  <X size={12} />
                </button>
              </div>
            ))}
          </div>
        )}
        <form onSubmit={addCategoria} style={{ display: "flex", gap: 8 }}>
          <input placeholder="Nova categoria (ex: Cabelo)" value={novaCategoria} onChange={e => setNovaCategoria(e.target.value)} style={{ ...fieldStyle, flex: 1 }} />
          <button type="submit" disabled={savingCategoria} className="font-body sd-btn" style={{
            background: COLORS.primary, color: "#fff", border: "none", borderRadius: 12, padding: "0 16px", fontSize: 13, fontWeight: 700, cursor: "pointer",
          }}>
            {savingCategoria ? "..." : "Adicionar"}
          </button>
        </form>
      </Card>

      <Card style={{ padding: 16, marginBottom: 20 }}>
        <SectionLabel>{editingId ? "Editar serviço" : "Novo serviço"}</SectionLabel>
        <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <input placeholder="Nome do serviço" value={form.nome} onChange={e => setForm(f => ({ ...f, nome: e.target.value }))} style={fieldStyle} />
          <select value={form.categoryId} onChange={e => setForm(f => ({ ...f, categoryId: e.target.value }))} style={fieldStyle}>
            <option value="">Sem categoria</option>
            {serviceCategories.map(cat => <option key={cat.id} value={cat.id}>{cat.nome}</option>)}
          </select>
          <div style={{ display: "flex", gap: 10 }}>
            <div style={{ flex: 1, display: "flex", flexDirection: "column", gap: 8 }}>
              <select
                value={duracaoCustom ? "custom" : form.duracao}
                onChange={e => {
                  if (e.target.value === "custom") { setDuracaoCustom(true); setForm(f => ({ ...f, duracao: "" })); }
                  else { setDuracaoCustom(false); setForm(f => ({ ...f, duracao: e.target.value })); }
                }}
                style={fieldStyle}
              >
                <option value="" disabled>Duração</option>
                {DURATION_OPTIONS.map(o => <option key={o.min} value={o.min}>{o.label}</option>)}
                <option value="custom">Outro (minutos)</option>
              </select>
              {duracaoCustom && (
                <input placeholder="Duração em minutos" type="number" min="1" value={form.duracao}
                  onChange={e => setForm(f => ({ ...f, duracao: e.target.value }))} style={fieldStyle} />
              )}
            </div>
            <input placeholder="Preço (R$)" type="number" value={form.preco} onChange={e => setForm(f => ({ ...f, preco: e.target.value }))} style={{ ...fieldStyle, flex: 1 }} />
          </div>
          <PrimaryButton type="submit" loading={saving} style={{ marginTop: 2 }}>
            <Plus size={15} /> {editingId ? "Salvar alterações" : "Adicionar serviço"}
          </PrimaryButton>
          {editingId && (
            <button type="button" onClick={() => { setEditingId(null); setForm({ nome: "", duracao: "", preco: "", categoryId: "" }); }}
              className="font-body" style={{ background: "none", border: "none", color: COLORS.inkFaint, fontSize: 12, cursor: "pointer" }}>
              Cancelar edição
            </button>
          )}
        </form>
      </Card>

      {services.length === 0 ? (
        <Card style={{ padding: 18, textAlign: "center", color: COLORS.inkFaint, fontSize: 13 }}>Nenhum serviço cadastrado ainda.</Card>
      ) : (
        grupos.map(grupo => (
          <div key={grupo.id || "sem-categoria"} style={{ marginBottom: 18 }}>
            <SectionLabel>{grupo.nome}</SectionLabel>
            <Card style={{ padding: 4, overflow: "hidden" }}>
              {grupo.servicos.map((sv, i) => (
                <div key={sv.id} className="sd-row" style={{
                  display: "flex", justifyContent: "space-between", alignItems: "center", padding: "13px 12px",
                  borderBottom: i < grupo.servicos.length - 1 ? `1px solid ${COLORS.border}` : "none", borderRadius: 10,
                  opacity: busyId === sv.id ? 0.6 : 1,
                }}>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 14 }}>{sv.nome}</div>
                    <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>{formatDuration(sv.duracao)} · R$ {sv.preco}</div>
                  </div>
                  <div style={{ display: "flex", gap: 6 }}>
                    <button onClick={() => edit(sv)} className="sd-btn" style={{ background: COLORS.primarySoft, border: "none", borderRadius: 9, width: 32, height: 32, cursor: "pointer", color: COLORS.primary }}>
                      <Pencil size={13.5} style={{ display: "block", margin: "0 auto" }} />
                    </button>
                    <button disabled={busyId === sv.id} onClick={() => remove(sv.id)} className="sd-btn" style={{ background: COLORS.terraSoft, border: "none", borderRadius: 9, width: 32, height: 32, cursor: "pointer", color: COLORS.terra }}>
                      <Trash2 size={13.5} style={{ display: "block", margin: "0 auto" }} />
                    </button>
                  </div>
                </div>
              ))}
            </Card>
          </div>
        ))
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   ADMIN: LISTA DE COMPRAS
--------------------------------------------------------- */
function Compras({ data, establishment, onAdd, onToggle, onRemove, onSetValor }) {
  const { shoppingList } = data;
  const [novo, setNovo] = useState("");
  const [categoria, setCategoria] = useState(CATEGORIES[0]);
  const [saving, setSaving] = useState(false);
  const [busyId, setBusyId] = useState(null);
  const [error, setError] = useState("");
  const [editingValorId, setEditingValorId] = useState(null);
  const [valorDraft, setValorDraft] = useState("");

  const brl = (v) => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

  function listaWhatsappLink() {
    const pendentes = shoppingList.filter(i => !i.comprado);
    const texto = pendentes.length > 0
      ? `🛒 Lista de compras:\n\n${pendentes.map(i => `• ${i.nome} (${i.categoria})`).join("\n")}`
      : "🛒 Sua lista de compras está vazia — nada pendente por aqui.";
    return `https://wa.me/${normalizeWhatsapp(establishment.whatsapp)}?text=${encodeURIComponent(texto)}`;
  }

  async function add(e) {
    e.preventDefault();
    if (!novo.trim()) return;
    setSaving(true); setError("");
    try {
      await onAdd({ nome: novo, categoria, comprado: false });
      setNovo("");
    } catch (err) { setError(err.message); }
    finally { setSaving(false); }
  }
  async function toggle(item) {
    setBusyId(item.id);
    try {
      await onToggle(item.id, !item.comprado);
      if (!item.comprado) {
        // acabou de marcar como comprado — abre o campinho opcional de valor
        setEditingValorId(item.id);
        setValorDraft("");
      } else if (editingValorId === item.id) {
        setEditingValorId(null);
      }
    } catch (err) { setError(err.message); }
    finally { setBusyId(null); }
  }
  async function remove(id) {
    setBusyId(id);
    try { await onRemove(id); } catch (err) { setError(err.message); }
    finally { setBusyId(null); }
  }
  async function saveValor(item) {
    const raw = valorDraft.trim().replace(",", ".");
    const parsed = raw === "" ? null : Number(raw);
    setBusyId(item.id);
    try { await onSetValor(item.id, Number.isFinite(parsed) ? parsed : null); }
    catch (err) { setError(err.message); }
    finally { setBusyId(null); setEditingValorId(null); }
  }

  return (
    <div className="fade-up">
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, margin: "2px 0 16px", flexWrap: "wrap" }}>
        <h1 className="font-display" style={{ fontSize: 27, margin: 0, fontWeight: 600 }}>Lista de compras</h1>
        <a href={listaWhatsappLink()} target="_blank" rel="noopener noreferrer" style={{ textDecoration: "none" }}>
          <button className="font-body sd-btn" style={{
            display: "flex", alignItems: "center", gap: 6, background: "#1E9E56", color: "#fff",
            border: "none", borderRadius: 999, padding: "9px 14px", fontSize: 12.5, fontWeight: 700, cursor: "pointer",
          }}>
            <MessageCircle size={13} /> Enviar lista pro WhatsApp
          </button>
        </a>
      </div>
      <ErrorBanner message={error} onDismiss={() => setError("")} />

      <Card style={{ padding: 16, marginBottom: 20 }}>
        <SectionLabel>Novo item</SectionLabel>
        <form onSubmit={add} style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <input placeholder="Nome do item" value={novo} onChange={e => setNovo(e.target.value)} style={fieldStyle} />
          <select value={categoria} onChange={e => setCategoria(e.target.value)} style={fieldStyle}>
            {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
          <PrimaryButton type="submit" loading={saving} style={{ marginTop: 2 }}><Plus size={15} /> Adicionar item</PrimaryButton>
        </form>
      </Card>

      {shoppingList.length === 0 && (
        <Card style={{ padding: 18, textAlign: "center", color: COLORS.inkFaint, fontSize: 13 }}>Lista vazia por enquanto.</Card>
      )}

      {CATEGORIES.map(cat => {
        const items = shoppingList.filter(i => i.categoria === cat);
        if (items.length === 0) return null;
        return (
          <div key={cat} style={{ marginBottom: 18 }}>
            <SectionLabel>{cat}</SectionLabel>
            <Card style={{ padding: 4, overflow: "hidden" }}>
              {items.map((item, i) => (
                <div key={item.id} style={{
                  borderBottom: i < items.length - 1 ? `1px solid ${COLORS.border}` : "none", borderRadius: 10,
                  opacity: busyId === item.id ? 0.6 : 1,
                }}>
                  <div className="sd-row" style={{ display: "flex", alignItems: "center", gap: 11, padding: "11px 12px" }}>
                    <button onClick={() => toggle(item)} className="sd-check" style={{
                      width: 21, height: 21, borderRadius: 7, border: `1.5px solid ${item.comprado ? COLORS.sage : COLORS.borderStrong}`,
                      background: item.comprado ? COLORS.sage : "transparent", cursor: "pointer", flexShrink: 0,
                      display: "flex", alignItems: "center", justifyContent: "center",
                    }}>
                      {item.comprado && <Check size={13} color="#fff" />}
                    </button>
                    <span style={{
                      flex: 1, fontSize: 13.5,
                      textDecoration: item.comprado ? "line-through" : "none",
                      color: item.comprado ? COLORS.inkFaint : COLORS.ink,
                      transition: "color 0.15s ease",
                    }}>{item.nome}</span>
                    <button onClick={() => remove(item.id)} className="sd-btn" style={{ background: "transparent", border: "none", cursor: "pointer", color: COLORS.inkFaint, padding: 4 }}>
                      <Trash2 size={15} />
                    </button>
                  </div>

                  {item.comprado && editingValorId === item.id && (
                    <div style={{ display: "flex", gap: 6, padding: "0 12px 11px 44px", alignItems: "center" }}>
                      <input
                        type="number" step="0.01" min="0" placeholder="Quanto gastou? (opcional)"
                        value={valorDraft} onChange={e => setValorDraft(e.target.value)}
                        style={{ ...fieldStyle, padding: "7px 10px", fontSize: 16, flex: 1 }}
                      />
                      <button onClick={() => saveValor(item)} className="sd-btn font-body" style={{
                        background: COLORS.primary, color: "#fff", border: "none", borderRadius: 8,
                        padding: "7px 11px", fontSize: 12, fontWeight: 700, cursor: "pointer",
                      }}>Salvar</button>
                      <button onClick={() => setEditingValorId(null)} className="sd-btn font-body" style={{
                        background: "none", border: "none", color: COLORS.inkFaint, fontSize: 12, fontWeight: 600, cursor: "pointer", padding: "7px 4px",
                      }}>Pular</button>
                    </div>
                  )}

                  {item.comprado && editingValorId !== item.id && item.valorGasto != null && (
                    <button
                      onClick={() => { setEditingValorId(item.id); setValorDraft(String(item.valorGasto)); }}
                      className="sd-btn font-body"
                      style={{ background: "none", border: "none", padding: "0 12px 10px 44px", fontSize: 11.5, color: COLORS.inkFaint, display: "flex", alignItems: "center", gap: 5, cursor: "pointer" }}
                    >
                      Gastou {brl(item.valorGasto)} <Pencil size={11} />
                    </button>
                  )}

                  {item.comprado && editingValorId !== item.id && item.valorGasto == null && (
                    <button
                      onClick={() => { setEditingValorId(item.id); setValorDraft(""); }}
                      className="sd-btn font-body"
                      style={{ background: "none", border: "none", padding: "0 12px 10px 44px", fontSize: 11.5, color: COLORS.primary, fontWeight: 600, cursor: "pointer" }}
                    >
                      + Adicionar quanto gastou
                    </button>
                  )}
                </div>
              ))}
            </Card>
          </div>
        );
      })}
    </div>
  );
}

/* ---------------------------------------------------------
   ADMIN: CONFIGURAÇÕES
--------------------------------------------------------- */
function Config({ establishment, onSave, onSignOut }) {
  const [nameDraft, setNameDraft] = useState(establishment.platformName);
  const [waDraft, setWaDraft] = useState(establishment.waTemplate || DEFAULT_WA_TEMPLATE);
  const [windowDraft, setWindowDraft] = useState(establishment.bookingWindowDays || 90);
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);
  const [error, setError] = useState("");
  const [copied, setCopied] = useState(false);

  const [autoSendDraft, setAutoSendDraft] = useState(!!establishment.waAutoSend);
  const [evoUrl, setEvoUrl] = useState(establishment.waEvolutionUrl || "");
  const [evoKey, setEvoKey] = useState(establishment.waEvolutionApiKey || "");
  const [evoInstance, setEvoInstance] = useState(establishment.waEvolutionInstance || "");
  const [waStatus, setWaStatus] = useState(establishment.waStatus || "desconectado");
  const [qrCode, setQrCode] = useState(null);
  const [connecting, setConnecting] = useState(false);
  const [waError, setWaError] = useState("");

  const publicLink = `${window.location.origin}${window.location.pathname}?estab=${establishment.slug}`;

  async function save() {
    setSaving(true); setError("");
    try {
      await onSave({ platform_name: nameDraft || "Secretária Digital", wa_template: waDraft, booking_window_days: Number(windowDraft) });
      setSaved(true);
      setTimeout(() => setSaved(false), 2000);
    } catch (err) { setError(err.message); }
    finally { setSaving(false); }
  }

  function copyLink() {
    navigator.clipboard?.writeText(publicLink);
    setCopied(true);
    setTimeout(() => setCopied(false), 1500);
  }

  const estRascunho = { waEvolutionUrl: evoUrl, waEvolutionApiKey: evoKey, waEvolutionInstance: evoInstance };

  async function salvarEConectar() {
    setConnecting(true); setWaError(""); setQrCode(null);
    try {
      await onSave({
        wa_auto_send: autoSendDraft, wa_evolution_url: evoUrl,
        wa_evolution_api_key: evoKey, wa_evolution_instance: evoInstance,
      });
      const b64 = await evolutionApi.qrCode(estRascunho);
      if (b64) setQrCode(b64);
      else { const s = await evolutionApi.status(estRascunho); setWaStatus(s); await onSave({ wa_status: s }); }
    } catch (err) { setWaError(err.message); }
    finally { setConnecting(false); }
  }

  async function verificarConexao() {
    setWaError("");
    try {
      const s = await evolutionApi.status(estRascunho);
      setWaStatus(s);
      await onSave({ wa_status: s });
      if (s === "conectado") setQrCode(null);
    } catch (err) { setWaError(err.message); }
  }


  return (
    <div className="fade-up">
      <h1 className="font-display" style={{ fontSize: 27, margin: "2px 0 16px", fontWeight: 600 }}>Configurações</h1>
      <ErrorBanner message={error} onDismiss={() => setError("")} />

      <Card style={{ padding: 16, marginBottom: 14 }}>
        <SectionLabel>Link público de agendamento</SectionLabel>
        <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginBottom: 12, lineHeight: 1.5 }}>
          Compartilhe este link com suas clientes para que elas marquem horário direto, sem login.
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <div style={{ ...fieldStyle, flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", color: COLORS.inkSoft, fontSize: 12.5 }}>
            {publicLink}
          </div>
          <GhostButton onClick={copyLink} style={{ padding: "10px 14px" }}>
            {copied ? <Check size={14} color={COLORS.sage} /> : <Copy size={14} />}
          </GhostButton>
        </div>
      </Card>

      <Card style={{ padding: 16, marginBottom: 14 }}>
        <SectionLabel>Nome da plataforma</SectionLabel>
        <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginBottom: 14, lineHeight: 1.5 }}>
          Este nome aparece em tipografia elegante no lugar de um logo, em toda a interface.
        </div>
        <div style={{
          background: COLORS.heroGradient, borderRadius: 14, padding: "18px 16px", marginBottom: 12,
          display: "flex", alignItems: "center", justifyContent: "center",
        }}>
          <Wordmark name={nameDraft || "Secretária Digital"} size={24} weight={600} />
        </div>
        <input value={nameDraft} onChange={e => setNameDraft(e.target.value)} style={fieldStyle} />
      </Card>

      <Card style={{ padding: 16, marginBottom: 14 }}>
        <SectionLabel>Janela de agendamento</SectionLabel>
        <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginBottom: 12, lineHeight: 1.5 }}>
          Até quantos dias à frente a cliente pode ver e marcar horário no calendário público.
        </div>
        <select value={windowDraft} onChange={e => setWindowDraft(e.target.value)} style={fieldStyle}>
          <option value={7}>1 semana</option>
          <option value={30}>1 mês</option>
          <option value={90}>3 meses</option>
          <option value={180}>6 meses</option>
        </select>
      </Card>

      <Card style={{ padding: 16, marginBottom: 16 }}>
        <SectionLabel>Mensagem de confirmação (WhatsApp)</SectionLabel>
        <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginBottom: 12, lineHeight: 1.5 }}>
          Use {"{cliente}"}, {"{data}"}, {"{horario}"}, {"{servico}"} e {"{link}"} — serão preenchidos automaticamente.
        </div>
        <textarea value={waDraft} onChange={e => setWaDraft(e.target.value)} rows={7} style={{ ...fieldStyle, resize: "vertical", lineHeight: 1.55 }} />
      </Card>

      <Card style={{ padding: 16, marginBottom: 16 }}>
        <SectionLabel>Envio automático de WhatsApp (QR Code, grátis)</SectionLabel>
        <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginBottom: 12, lineHeight: 1.5 }}>
          Sem isso, confirmar um horário abre o WhatsApp e você precisa apertar enviar na mão.
          Com isso ligado, a mensagem sai sozinha. A ligação é feita lendo um QR Code — igual ao
          WhatsApp Web — então seu celular continua funcionando normal, e não tem mensalidade.
          Se cair a conexão, é só voltar aqui e ler o QR Code de novo.
        </div>

        <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12.5, color: COLORS.ink, marginBottom: 12, cursor: "pointer" }}>
          <input type="checkbox" checked={autoSendDraft} onChange={e => setAutoSendDraft(e.target.checked)} style={{ width: 16, height: 16 }} />
          Ativar envio automático (mesmo ligado, você ainda pode escolher enviar manualmente em cada mensagem)
        </label>

        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 12 }}>
          <input placeholder="URL do servidor Evolution (ex: https://minha-evolution.com)" value={evoUrl} onChange={e => setEvoUrl(e.target.value)} style={fieldStyle} />
          <input placeholder="API Key" value={evoKey} onChange={e => setEvoKey(e.target.value)} style={fieldStyle} />
          <input placeholder="Nome da instância" value={evoInstance} onChange={e => setEvoInstance(e.target.value)} style={fieldStyle} />
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
          <Pill fg={waStatus === "conectado" ? COLORS.sage : COLORS.inkFaint} bg={waStatus === "conectado" ? COLORS.sageSoft : "#EFEAE3"} dot>
            {waStatus === "conectado" ? "Conectado" : "Desconectado"}
          </Pill>
          <GhostButton onClick={verificarConexao} style={{ fontSize: 11.5, padding: "6px 10px" }}>Verificar conexão</GhostButton>
        </div>

        {waError && <ErrorBanner message={waError} onDismiss={() => setWaError("")} />}

        {qrCode && (
          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 8, marginBottom: 12, padding: 14, background: "#FAF8F3", borderRadius: 12 }}>
            <img src={qrCode} alt="QR Code do WhatsApp" style={{ width: 200, height: 200 }} />
            <div style={{ fontSize: 11.5, color: COLORS.inkSoft, textAlign: "center" }}>
              No WhatsApp do celular que vai enviar as mensagens: Configurações → Aparelhos conectados → Conectar um aparelho, e leia este código.
            </div>
          </div>
        )}

        <PrimaryButton onClick={salvarEConectar} loading={connecting} disabled={!evoUrl || !evoKey || !evoInstance} style={{ width: "100%" }}>
          {waStatus === "conectado" ? "Salvar e ler novo QR Code" : "Salvar e conectar"}
        </PrimaryButton>
      </Card>

      <PrimaryButton onClick={save} loading={saving} style={{ width: "100%", marginBottom: 12 }}>
        {saved ? <><Check size={15} /> Salvo</> : "Salvar alterações"}
      </PrimaryButton>
      <GhostButton onClick={onSignOut} style={{ width: "100%", justifyContent: "center", color: COLORS.terra }}>
        <LogOut size={14} /> Sair da conta
      </GhostButton>
    </div>
  );
}

// Apenas o calendário de dias é gerado no cliente (14 dias corridos
// a partir de hoje) — os HORÁRIOS dentro de cada dia nunca são uma
// lista fixa: eles vêm sempre da RPC get_available_slots, calculada
// em tempo real a partir do horário de funcionamento, folgas/férias/
// bloqueios e agendamentos já existentes no banco.
function nextCalendarDays(n = 14) {
  const out = [];
  const d = new Date();
  for (let i = 0; out.length < n && i < n + 7; i++) {
    out.push(toLocalIso(d));
    d.setDate(d.getDate() + 1);
  }
  return out;
}

function Stepper({ step, labels }) {
  return (
    <div style={{ display: "flex", alignItems: "center", marginBottom: 26 }}>
      {labels.map((l, i) => {
        const n = i + 1;
        const done = n < step;
        const active = n === step;
        return (
          <React.Fragment key={l}>
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
              <div className="sd-check" style={{
                width: 26, height: 26, borderRadius: "50%",
                display: "flex", alignItems: "center", justifyContent: "center",
                background: done ? COLORS.sage : active ? COLORS.primary : COLORS.bgAlt,
                color: done || active ? "#fff" : COLORS.inkFaint,
                border: active ? `2px solid ${COLORS.primarySoft}` : "none",
                fontSize: 11.5, fontWeight: 700,
              }}>
                {done ? <Check size={13} /> : n}
              </div>
              <span className="font-body" style={{ fontSize: 9.5, fontWeight: 700, color: active ? COLORS.primary : COLORS.inkFaint, whiteSpace: "nowrap" }}>{l}</span>
            </div>
            {i < labels.length - 1 && (
              <div style={{ flex: 1, height: 2, background: done ? COLORS.sage : COLORS.border, margin: "0 4px 14px", borderRadius: 2, transition: "background 0.3s ease" }} />
            )}
          </React.Fragment>
        );
      })}
    </div>
  );
}

function SelectCard({ children, selected, onClick, style }) {
  return (
    <button onClick={onClick} className="font-body sd-btn sd-card" style={{
      textAlign: "left", cursor: "pointer", width: "100%",

}

function ClientBooking({ establishment, catalog, catalogLoading, catalogError, onBook, footer }) {
  const [step, setStep] = useState(1);
  const [servicoId, setServicoId] = useState(null);
  const [profissionalId, setProfissionalId] = useState(null);
  const [data, setData] = useState(null);
  const [horario, setHorario] = useState(null);
  const [nome, setNome] = useState("");
  const [whatsapp, setWhatsapp] = useState("");
  const [observacao, setObservacao] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState("");
  const [done, setDone] = useState(false);

  const [slots, setSlots] = useState([]);
  const [slotsLoading, setSlotsLoading] = useState(false);
  const [slotsError, setSlotsError] = useState("");

  const services = catalog?.services || [];
  const professionals = catalog?.professionals || [];
  const serviceCategories = catalog?.serviceCategories || [];
  const [categoriaId, setCategoriaId] = useState(undefined); // undefined = ainda não escolheu; null = "sem categoria"; string = categoria escolhida
  const todayD = useMemo(() => new Date(), []);
  const [viewYear, setViewYear] = useState(todayD.getFullYear());
  const [viewMonth, setViewMonth] = useState(todayD.getMonth());
  const minBookDate = todayIso();
  const maxBookDate = useMemo(() => {
    const d = new Date();
    d.setDate(d.getDate() + (establishment.bookingWindowDays || 90));
    return toLocalIso(d);
  }, [establishment.bookingWindowDays]);
  const stepLabels = ["Serviço", "Profissional", "Data/Hora", "Seus dados"];

  // Disponibilidade real: sempre que serviço + profissional + data
  // estiverem escolhidos, busca os horários livres direto no banco
  // (get_available_slots), nunca uma lista fixa no front-end.
  useEffect(() => {
    if (!servicoId || !profissionalId || !data) { setSlots([]); return; }
    let cancelled = false;
    setSlotsLoading(true); setSlotsError(""); setHorario(null);
    rest.rpc("get_available_slots", {
      p_establishment_id: establishment.id,
      p_professional_id: profissionalId,
      p_service_id: servicoId,
      p_date: data,
    })
      .then(rows => { if (!cancelled) setSlots((rows || []).map(r => (r.slot || "").slice(0, 5)).filter(Boolean)); })
      .catch(err => { if (!cancelled) setSlotsError(err.message); })
      .finally(() => { if (!cancelled) setSlotsLoading(false); });
    return () => { cancelled = true; };
  }, [servicoId, profissionalId, data, establishment.id]);

  function reset() {
    setStep(1); setServicoId(null); setProfissionalId(null); setData(null); setHorario(null);
    setNome(""); setWhatsapp(""); setObservacao(""); setDone(false); setError(""); setCategoriaId(undefined);
  }

  async function submit(e) {
    e.preventDefault();
    if (!nome.trim() || !whatsapp.trim()) return;
    setSubmitting(true); setError("");
    try {
      await onBook({
        p_establishment_id: establishment.id,
        p_service_id: servicoId,
        p_professional_id: profissionalId,
        p_data: data,
        p_horario: horario + ":00",
        p_cliente_nome: nome,
        p_cliente_whatsapp: normalizeWhatsapp(whatsapp),
        p_observacao: observacao || null,
      });
      setDone(true);
    } catch (err) {
      setError(err.message);
      // O horário pode ter sido ocupado por outra pessoa entre a
      // escolha e o envio — atualiza a lista de horários livres.
      if (/hor[aá]rio/i.test(err.message)) {
        setHorario(null);
        rest.rpc("get_available_slots", {
          p_establishment_id: establishment.id, p_professional_id: profissionalId,
          p_service_id: servicoId, p_date: data,
        }).then(rows => setSlots((rows || []).map(r => (r.slot || "").slice(0, 5)).filter(Boolean))).catch(() => {});
      }
    }
    finally { setSubmitting(false); }
  }

  if (catalogLoading) {
    return <ClientFrame platformName={establishment.platformName} footer={footer}><FullScreenLoader label="Carregando serviços..." /></ClientFrame>;
  }
  if (catalogError) {
    return <ClientFrame platformName={establishment.platformName} footer={footer}><ErrorBanner message={catalogError} /></ClientFrame>;
  }

  if (done) {
    const servico = services.find(s => s.id === servicoId);
    const prof = professionals.find(p => p.id === profissionalId);
    return (
      <ClientFrame platformName={establishment.platformName} footer={footer}>
        <div className="pop-in" style={{ textAlign: "center", padding: "36px 16px" }}>
          <div style={{
            width: 68, height: 68, borderRadius: "50%", background: COLORS.sageSoft,
            display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 18px",
            animation: "ringPulse 1.4s ease-out infinite",
          }}>
            <Check size={30} color={COLORS.sage} strokeWidth={2.5} />
          </div>
          <h2 className="font-display" style={{ fontSize: 25, margin: "0 0 8px", fontWeight: 600 }}>Horário solicitado!</h2>
          <p style={{ color: COLORS.inkSoft, fontSize: 14, lineHeight: 1.65, maxWidth: 300, margin: "0 auto 26px" }}>
            {servico?.nome} com {prof?.nome}, em {fmtDate(data)} às {horario}. Você vai receber uma mensagem para confirmar.
          </p>
          <GhostButton onClick={reset}>Agendar outro horário</GhostButton>
        </div>
      </ClientFrame>
    );
  }

  return (
    <ClientFrame platformName={establishment.platformName} footer={footer}>
      <Stepper step={step} labels={stepLabels} />
      <ErrorBanner message={error} onDismiss={() => setError("")} />

      {step === 1 && serviceCategories.length > 0 && categoriaId === undefined && (
        <div className="fade-up">
          <h2 className="font-display" style={{ fontSize: 21, margin: "0 0 14px", fontWeight: 600 }}>O que você quer fazer?</h2>
          <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
            {serviceCategories.filter(cat => services.some(sv => sv.categoryId === cat.id)).map(cat => (
              <SelectCard key={cat.id} onClick={() => setCategoriaId(cat.id)}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div style={{ fontWeight: 700, fontSize: 14.5 }}>{cat.nome}</div>
                  <ChevronRight size={16} color={COLORS.inkFaint} />
                </div>
              </SelectCard>
            ))}
            {services.some(sv => !sv.categoryId) && (
              <SelectCard onClick={() => setCategoriaId(null)}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div style={{ fontWeight: 700, fontSize: 14.5 }}>Outros serviços</div>
                  <ChevronRight size={16} color={COLORS.inkFaint} />
                </div>
              </SelectCard>
            )}
          </div>
        </div>
      )}

      {step === 1 && (serviceCategories.length === 0 || categoriaId !== undefined) && (
        <div className="fade-up">
          {serviceCategories.length > 0 && <BackRow onBack={() => setCategoriaId(undefined)} />}
          <h2 className="font-display" style={{ fontSize: 21, margin: "0 0 14px", fontWeight: 600 }}>Escolha o serviço</h2>
          {services.length === 0 && <div style={{ color: COLORS.inkFaint, fontSize: 13 }}>Nenhum serviço disponível no momento.</div>}
          <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
            {services.filter(sv => serviceCategories.length === 0 || categoriaId === undefined || sv.categoryId === categoriaId).map(sv => (
              <SelectCard key={sv.id} selected={servicoId === sv.id} onClick={() => { setServicoId(sv.id); setStep(2); }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 14.5 }}>{sv.nome}</div>
                    <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>{formatDuration(sv.duracao)}</div>
                  </div>
                  <div className="font-display" style={{ fontSize: 16, fontWeight: 600, color: COLORS.primary }}>R$ {sv.preco}</div>
                </div>
              </SelectCard>
            ))}
          </div>
        </div>
      )}

      {step === 2 && (
        <div className="fade-up">
          <BackRow onBack={() => setStep(1)} />
          <h2 className="font-display" style={{ fontSize: 21, margin: "0 0 14px", fontWeight: 600 }}>Escolha a profissional</h2>
          <div style={{ display: "flex", flexDirection: "column", gap: 9 }}>
            {professionals.map(p => (
              <SelectCard key={p.id} selected={profissionalId === p.id} onClick={() => { setProfissionalId(p.id); setStep(3); }}>
                <div style={{ display: "flex", alignItems: "center", gap: 11 }}>
                  <Avatar name={p.nome} photoUrl={p.fotoUrl} size={36} />
                  <div style={{ fontWeight: 700, fontSize: 14.5 }}>{p.nome}</div>
                </div>
              </SelectCard>
            ))}
          </div>
        </div>
      )}

      {step === 3 && (
        <div className="fade-up">
          <BackRow onBack={() => setStep(2)} />
          <h2 className="font-display" style={{ fontSize: 21, margin: "0 0 14px", fontWeight: 600 }}>Escolha a data</h2>
          <Card style={{ padding: 14, marginBottom: 18 }}>
            <MonthCalendar
              year={viewYear} month={viewMonth}
              onNavigate={(delta) => { const n = addMonths(viewYear, viewMonth, delta); setViewYear(n.year); setViewMonth(n.month); }}
              selectedDate={data}
              onSelectDate={setData}
              minDate={minBookDate}
              maxDate={maxBookDate}
            />
          </Card>
          {data && (
            <>
              <h2 className="font-display" style={{ fontSize: 18, margin: "0 0 12px", fontWeight: 600 }}>Escolha o horário</h2>
              {slotsLoading && <div style={{ color: COLORS.inkFaint, fontSize: 13, display: "flex", alignItems: "center", gap: 8 }}><Spinner size={14} color={COLORS.inkFaint} /> Verificando disponibilidade real...</div>}
              {!slotsLoading && slotsError && <ErrorBanner message={slotsError} />}
              {!slotsLoading && !slotsError && slots.length === 0 && (
                <div style={{ color: COLORS.inkFaint, fontSize: 13 }}>Nenhum horário livre nesta data. Tente outro dia.</div>
              )}
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 9 }}>
                {slots.map(h => (
                  <SelectCard key={h} selected={horario === h} onClick={() => { setHorario(h); setStep(4); }} style={{ textAlign: "center", padding: "13px 6px" }}>
                    <div className="font-display" style={{ fontWeight: 700, fontSize: 14.5 }}>{h}</div>
                  </SelectCard>
                ))}
              </div>
            </>
          )}
        </div>
      )}

      {step === 4 && (
        <div className="fade-up">
          <BackRow onBack={() => setStep(3)} />
          <h2 className="font-display" style={{ fontSize: 21, margin: "0 0 14px", fontWeight: 600 }}>Seus dados</h2>
          <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <input placeholder="Seu nome" value={nome} onChange={e => setNome(e.target.value)} style={fieldStyle} />
            <input placeholder="WhatsApp (com DDD)" value={whatsapp} onChange={e => setWhatsapp(e.target.value)} style={fieldStyle} />
            <textarea placeholder="Observação (opcional)" value={observacao} onChange={e => setObservacao(e.target.value)} rows={3} style={{ ...fieldStyle, resize: "vertical" }} />
            <PrimaryButton type="submit" loading={submitting} disabled={!nome.trim() || !whatsapp.trim()} style={{ width: "100%", marginTop: 6 }}>
              Confirmar solicitação
            </PrimaryButton>
          </form>
        </div>
      )}
    </ClientFrame>
  );
}

function Row({ label, value, last }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", padding: "10px 0", borderBottom: last ? "none" : `1px solid ${COLORS.border}`, fontSize: 13.5 }}>

function Banner({ tone, text }) {
  const bg = tone === "sage" ? COLORS.sageSoft : COLORS.terraSoft;
  const fg = tone === "sage" ? COLORS.sage : COLORS.terra;
  return (
    <div className="pop-in" style={{ background: bg, color: fg, borderRadius: 11, padding: "13px 14px", fontWeight: 700, fontSize: 13.5, textAlign: "center" }}>

function ConfirmationLinkPage({ token, info, loading, error, onResolve, onClose }) {
  const [busy, setBusy] = useState(false);
  const [localStatus, setLocalStatus] = useState(null);

  async function decide(status) {
    setBusy(true);
    try {
      await onResolve(token, status);
      setLocalStatus(status);
    } catch (err) { /* surfaced via error state upstream */ }
    finally { setBusy(false); }
  }

  const status = localStatus || info?.status;

  return (
    <div className="font-body" style={{ minHeight: "100%", background: COLORS.bg, display: "flex", flexDirection: "column" }}>
      {onClose && (
        <div style={{ padding: "16px 18px" }}>
          <button onClick={onClose} className="font-body sd-btn" style={{ background: "transparent", border: "none", color: COLORS.inkSoft, display: "flex", alignItems: "center", gap: 4, cursor: "pointer", fontSize: 13, fontWeight: 600 }}>
            <ArrowLeft size={15} /> Fechar link
          </button>
        </div>
      )}
      <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
        {loading ? (
          <FullScreenLoader label="Carregando seu horário..." />
        ) : error ? (
          <Card className="pop-in" style={{ padding: 28, maxWidth: 360, width: "100%" }}>
            <ErrorBanner message={error} />
          </Card>
        ) : info ? (
          <Card className="pop-in" style={{ padding: 28, maxWidth: 360, width: "100%", boxShadow: COLORS.shadowLg }}>
            <div style={{ textAlign: "center", marginBottom: 20 }}>
              <Avatar name={info.cliente_nome} size={46} />
              <h2 className="font-display" style={{ fontSize: 21, margin: "12px 0 3px", fontWeight: 600 }}>Olá, {info.cliente_nome?.split(" ")[0]}!</h2>
              <p style={{ color: COLORS.inkSoft, fontSize: 13, margin: 0 }}>Confirme ou cancele seu horário abaixo.</p>
            </div>

            <div style={{ background: COLORS.bgAlt, borderRadius: 13, padding: "6px 14px", marginBottom: 20 }}>
              <Row label="Data" value={fmtDate(info.data)} />
              <Row label="Horário" value={(info.horario || "").slice(0, 5)} />
              <Row label="Serviço" value={info.servico_nome} />
              <Row label="Profissional" value={info.profissional_nome} last />
            </div>

            {status === "confirmado" && <Banner tone="sage" text="Você confirmou este horário. ✅" />}
            {status === "cancelado" && <Banner tone="terra" text="Você cancelou este horário. ❌" />}

            {status === "aguardando" && (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <PrimaryButton onClick={() => decide("confirmado")} loading={busy} style={{ background: `linear-gradient(155deg, ${COLORS.sage}, #285C3C)`, boxShadow: "0 8px 20px -8px rgba(62,122,85,0.45)" }}>
                  <Check size={16} /> Confirmar horário
                </PrimaryButton>
                <button disabled={busy} onClick={() => decide("cancelado")} className="font-body sd-btn" style={{
                  background: "transparent", border: `1.5px solid ${COLORS.terra}66`, color: COLORS.terra,
                  borderRadius: 999, padding: "13px 20px", fontWeight: 650, fontSize: 14, cursor: "pointer",
                }}>
                  <X size={16} style={{ verticalAlign: -3, marginRight: 6 }} /> Cancelar horário
                </button>
              </div>
            )}
          </Card>
        ) : null}
      </div>
    </div>
  );
}

function EstablishmentFormModal({ initial, plans, onSave, onClose }) {
  const [form, setForm] = useState(initial || {
    nome_estabelecimento: "", nome_responsavel: "", whatsapp: "", email: "", senha: "", plan_id: "",
  });
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  async function submit(e) {
    e.preventDefault();
    setSaving(true); setError("");

      await onSave(form);
    } catch (err) { setError(err.message); }
    finally { setSaving(false); }

  return (
    <div style={{
      position: "fixed", inset: 0, background: "rgba(36,20,25,0.5)", zIndex: 50,
      display: "flex", alignItems: "flex-end", justifyContent: "center",

          <h2 className="font-display" style={{ fontSize: 20, margin: "0 0 16px", fontWeight: 600 }}>
            {isNew ? "Novo estabelecimento" : "Editar estabelecimento"}
          </h2>
          <ErrorBanner message={error} onDismiss={() => setError("")} />
          <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            <input placeholder="Nome do estabelecimento" value={form.nome_estabelecimento} onChange={e => setForm(f => ({ ...f, nome_estabelecimento: e.target.value }))} style={fieldStyle} />
            <input placeholder="Nome da responsável" value={form.nome_responsavel} onChange={e => setForm(f => ({ ...f, nome_responsavel: e.target.value }))} style={fieldStyle} />
            <input placeholder="WhatsApp" value={form.whatsapp} onChange={e => setForm(f => ({ ...f, whatsapp: e.target.value }))} style={fieldStyle} />
            <input placeholder="E-mail" type="email" value={form.email} onChange={e => setForm(f => ({ ...f, email: e.target.value }))} disabled={!isNew} style={{ ...fieldStyle, opacity: isNew ? 1 : 0.6 }} />
            {isNew && <input placeholder="Senha inicial" type="password" value={form.senha} onChange={e => setForm(f => ({ ...f, senha: e.target.value }))} style={fieldStyle} />}
            <select value={form.plan_id || ""} onChange={e => setForm(f => ({ ...f, plan_id: e.target.value }))} style={fieldStyle}>

              {plans.map(p => <option key={p.id} value={p.id}>{p.nome} — R$ {p.preco} ({p.periodicidade})</option>)}

            <PrimaryButton type="submit" loading={saving} style={{ marginTop: 4 }}>
              {isNew ? "Criar estabelecimento" : "Salvar alterações"}
            </PrimaryButton>
            <GhostButton onClick={onClose} style={{ justifyContent: "center" }}>Cancelar</GhostButton>
          </form>
        </Card>
      </div>
    </div>
  );
}

function BlockModal({ establishment, onConfirm, onClose }) {
  const [reason, setReason] = useState("");
  const [saving, setSaving] = useState(false);

    setSaving(true);

    finally { setSaving(false); }

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(36,20,25,0.5)", zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }} onClick={onClose}>

          <GhostButton onClick={onClose} style={{ flex: 1, justifyContent: "center" }}>Cancelar</GhostButton>

function SuperAdminEstablishments({ establishments, plans, saActions }) {
  const [query, setQuery] = useState("");
  const [statusFilter, setStatusFilter] = useState("todos");
  const [editing, setEditing] = useState(null); // establishment being edited, or 'new'
  const [blockTarget, setBlockTarget] = useState(null);
  const [deleteTarget, setDeleteTarget] = useState(null);
  const [error, setError] = useState("");
  const [busyId, setBusyId] = useState(null);

  const filtered = establishments.filter(e => {
    if (statusFilter !== "todos" && e.status !== statusFilter) return false;
    if (query && !`${e.nomeEstabelecimento} ${e.nomeResponsavel}`.toLowerCase().includes(query.toLowerCase())) return false;
    return true;
  });

  async function handleCreate(form) {
    await saActions.createEstablishment(form);
    setEditing(null);
  }
  async function handleUpdate(form) {
    await saActions.updateEstablishment(editing.id, form);
    setEditing(null);
  }
  async function handleBlockToggle(status, reason) {
    setError("");
    try { await saActions.setStatus(blockTarget.id, status, reason); }
    catch (err) { setError(err.message); }
  }
  async function handleDelete() {
    setBusyId(deleteTarget.id); setError("");
    try { await saActions.removeEstablishment(deleteTarget.id); setDeleteTarget(null); }
    catch (err) { setError(err.message); }
    finally { setBusyId(null); }
  }

  return (
    <div className="fade-up">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", margin: "2px 0 16px" }}>
        <h1 className="font-display" style={{ fontSize: 27, margin: 0, fontWeight: 600 }}>Estabelecimentos</h1>
        <PrimaryButton onClick={() => setEditing("new")} style={{ padding: "10px 16px", fontSize: 13 }}>
          <Plus size={15} /> Novo
        </PrimaryButton>
      </div>

      <ErrorBanner message={error} onDismiss={() => setError("")} />

      <input placeholder="Buscar por nome..." value={query} onChange={e => setQuery(e.target.value)} style={{ ...fieldStyle, marginBottom: 10 }} />
      <div className="scrollbar-thin" style={{ display: "flex", gap: 6, marginBottom: 16, overflowX: "auto", background: COLORS.bgAlt, padding: 4, borderRadius: 13 }}>
        {[{ k: "todos", l: "Todos" }, { k: "ativo", l: "Ativos" }, { k: "bloqueado", l: "Bloqueados" }].map(f => (
          <button key={f.k} onClick={() => setStatusFilter(f.k)} className="font-body sd-tab" style={{
            flexShrink: 0, border: "none", background: statusFilter === f.k ? COLORS.surface : "transparent",
            color: statusFilter === f.k ? COLORS.primary : COLORS.inkSoft, boxShadow: statusFilter === f.k ? COLORS.shadowSm : "none",
            borderRadius: 10, padding: "8px 13px", fontSize: 12.5, fontWeight: 700, cursor: "pointer",
          }}>{f.l}</button>
        ))}
      </div>

      {filtered.length === 0 ? (
        <Card style={{ padding: 18, textAlign: "center", color: COLORS.inkFaint, fontSize: 13 }}>Nenhum estabelecimento encontrado.</Card>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {filtered.map(e => {
            const plan = plans.find(p => p.id === e.planId);
            return (
              <Card key={e.id} style={{ padding: 15, opacity: busyId === e.id ? 0.6 : 1 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 14.5 }}>{e.nomeEstabelecimento}</div>
                    <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>{e.nomeResponsavel} · {e.email}</div>

                  </div>

                  }}>

                  <button onClick={() => setDeleteTarget(e)} className="font-body sd-btn" style={{ background: "transparent", border: "none", color: COLORS.inkFaint, borderRadius: 999, padding: "7px 8px", fontSize: 11.5, cursor: "pointer" }}>
                    <Trash2 size={13} />
                  </button>
                </div>
              </Card>
            );
          })}
        </div>

      {editing && editing !== "new" && (
        <EstablishmentFormModal
          initial={{
            nome_estabelecimento: editing.nomeEstabelecimento, nome_responsavel: editing.nomeResponsavel,
            whatsapp: editing.whatsapp, email: editing.email, plan_id: editing.planId || "",
          }}
          plans={plans} onSave={handleUpdate} onClose={() => setEditing(null)}
        />
      )}
      {blockTarget && <BlockModal establishment={blockTarget} onConfirm={handleBlockToggle} onClose={() => setBlockTarget(null)} />}
      {deleteTarget && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(36,20,25,0.5)", zIndex: 50, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }} onClick={() => setDeleteTarget(null)}>
          <Card className="pop-in" style={{ padding: 22, maxWidth: 340, width: "100%" }} onClick={e => e.stopPropagation()}>
            <h2 className="font-display" style={{ fontSize: 18, margin: "0 0 8px", fontWeight: 600 }}>Excluir {deleteTarget.nomeEstabelecimento}?</h2>
            <p style={{ fontSize: 12.5, color: COLORS.inkSoft, margin: "0 0 16px" }}>Isso apaga permanentemente todos os dados deste estabelecimento (agenda, clientes, serviços). Não pode ser desfeito.</p>
            <div style={{ display: "flex", gap: 8 }}>
              <GhostButton onClick={() => setDeleteTarget(null)} style={{ flex: 1, justifyContent: "center" }}>Cancelar</GhostButton>
              <PrimaryButton onClick={handleDelete} loading={busyId === deleteTarget.id} style={{ flex: 1, background: `linear-gradient(155deg, ${COLORS.terra}, #7A2A2A)` }}>Excluir</PrimaryButton>
            </div>
          </Card>
        </div>
      )}
    </div>
  );
}

function SuperAdminPlans({ plans, saActions }) {
  const [form, setForm] = useState({ nome: "", periodicidade: "mensal", preco: "" });
  const [editingId, setEditingId] = useState(null);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  async function submit(e) {
    e.preventDefault();
    if (!form.nome.trim()) return;
    setSaving(true); setError("");
    try {
      const payload = { nome: form.nome, periodicidade: form.periodicidade, preco: Number(form.preco) || 0 };
      if (editingId) await saActions.updatePlan(editingId, payload);
      else await saActions.addPlan(payload);
      setForm({ nome: "", periodicidade: "mensal", preco: "" });
      setEditingId(null);
    } catch (err) { setError(err.message); }
    finally { setSaving(false); }
  }

  function edit(p) { setEditingId(p.id); setForm({ nome: p.nome, periodicidade: p.periodicidade, preco: String(p.preco) }); }

  return (
    <div className="fade-up">
      <h1 className="font-display" style={{ fontSize: 27, margin: "2px 0 16px", fontWeight: 600 }}>Planos</h1>
      <ErrorBanner message={error} onDismiss={() => setError("")} />
      <Card style={{ padding: 16, marginBottom: 16 }}>
        <SectionLabel>{editingId ? "Editar plano" : "Novo plano"}</SectionLabel>
        <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <input placeholder="Nome do plano" value={form.nome} onChange={e => setForm(f => ({ ...f, nome: e.target.value }))} style={fieldStyle} />
          <select value={form.periodicidade} onChange={e => setForm(f => ({ ...f, periodicidade: e.target.value }))} style={fieldStyle}>
            <option value="mensal">Mensal</option>
            <option value="trimestral">Trimestral</option>
            <option value="semestral">Semestral</option>
            <option value="anual">Anual</option>
          </select>
          <input placeholder="Preço (R$)" type="number" value={form.preco} onChange={e => setForm(f => ({ ...f, preco: e.target.value }))} style={fieldStyle} />
          <PrimaryButton type="submit" loading={saving}><Plus size={15} /> {editingId ? "Salvar" : "Adicionar plano"}</PrimaryButton>
        </form>
      </Card>
      <Card style={{ padding: 4, overflow: "hidden" }}>
        {plans.map((p, i) => (
          <div key={p.id} className="sd-row" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "13px 12px", borderBottom: i < plans.length - 1 ? `1px solid ${COLORS.border}` : "none", borderRadius: 10 }}>
            <div>
              <div style={{ fontWeight: 700, fontSize: 14 }}>{p.nome}</div>
              <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>R$ {p.preco} · {p.periodicidade}</div>
            </div>
            <button onClick={() => edit(p)} className="sd-btn" style={{ background: COLORS.primarySoft, border: "none", borderRadius: 9, width: 32, height: 32, cursor: "pointer", color: COLORS.primary }}>
              <Pencil size={13.5} style={{ display: "block", margin: "0 auto" }} />
            </button>
          </div>
        ))}
      </Card>
    </div>
  );
}

function SuperAdminAnnouncements({ announcements, saActions }) {
  const [title, setTitle] = useState("");
  const [message, setMessage] = useState("");
  const [sending, setSending] = useState(false);
  const [error, setError] = useState("");

  async function send(e) {
    e.preventDefault();
    if (!title.trim() || !message.trim()) return;
    setSending(true); setError("");
    try { await saActions.sendAnnouncement({ title, message }); setTitle(""); setMessage(""); }
    catch (err) { setError(err.message); }
    finally { setSending(false); }
  }

  return (
    <div className="fade-up">
      <h1 className="font-display" style={{ fontSize: 27, margin: "2px 0 16px", fontWeight: 600 }}>Comunicados</h1>
      <ErrorBanner message={error} onDismiss={() => setError("")} />
      <Card style={{ padding: 16, marginBottom: 16 }}>
        <SectionLabel>Novo comunicado (visível para todos os estabelecimentos)</SectionLabel>
        <form onSubmit={send} style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <input placeholder="Título" value={title} onChange={e => setTitle(e.target.value)} style={fieldStyle} />
          <textarea placeholder="Mensagem" value={message} onChange={e => setMessage(e.target.value)} rows={4} style={{ ...fieldStyle, resize: "vertical" }} />
          <PrimaryButton type="submit" loading={sending}>Enviar comunicado</PrimaryButton>
        </form>
      </Card>
      {announcements.map(a => (
        <Card key={a.id} style={{ padding: 14, marginBottom: 10 }}>
          <div style={{ fontWeight: 700, fontSize: 13.5 }}>{a.title}</div>
          <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginTop: 4, lineHeight: 1.5 }}>{a.message}</div>
          <div style={{ fontSize: 10.5, color: COLORS.inkFaint, marginTop: 6 }}>{new Date(a.created_at).toLocaleString("pt-BR")}</div>
        </Card>
      ))}
    </div>
  );
}

function SuperAdminAudit({ logs }) {
