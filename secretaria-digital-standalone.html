function Agenda({ data, establishment, onSetStatus, onCreateAppointment, onMarkDone }) {
  const { appointments, clients, services, professionals, timeOff = [] } = data;
  const [filter, setFilter] = useState("todos");
  const [selectedDate, setSelectedDate] = useState(() => todayIso());
  const [busyId, setBusyId] = useState(null);
  const [showNewModal, setShowNewModal] = useState(false);
  const [doneFormId, setDoneFormId] = useState(null);
  const [formaPagDraft, setFormaPagDraft] = useState("pix");
  const [extraDraft, setExtraDraft] = useState("");
  const today = useMemo(() => new Date(), []);
  const [viewYear, setViewYear] = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth());
  const [sendingAutoId, setSendingAutoId] = useState(null);
  const [autoSendError, setAutoSendError] = useState("");

  async function enviarAutomatico(appt) {
    const cliente = clients.find(c => c.id === appt.clienteId);
    const servico = services.find(s => s.id === appt.servicoId);
    const link = `${window.location.origin}${window.location.pathname}?token=${appt.token}`;
    const text = (establishment.waTemplate || DEFAULT_WA_TEMPLATE)
      .replace("{cliente}", cliente?.nome.split(" ")[0] || "")
      .replace("{data}", fmtDate(appt.data))
      .replace("{horario}", appt.horario)
      .replace("{servico}", servico?.nome || "")
      .replace("{link}", link);
    setSendingAutoId(appt.id); setAutoSendError("");
    try {
      await evolutionApi.sendText(establishment, normalizeWhatsapp(cliente?.whatsapp), text);
    } catch (err) { setAutoSendError(err.message); }
    finally { setSendingAutoId(null); }
  }

  async function setStatus(id, status) {
    setBusyId(id);
    try { await onSetStatus(id, status); } finally { setBusyId(null); }
  }

  function openDoneForm(appt) {
    setDoneFormId(appt.id);
    setFormaPagDraft(appt.formaPagamento || "pix");
    setExtraDraft(appt.valorExtra != null ? String(appt.valorExtra) : "");
  }

  async function submitDone(appt) {
    setBusyId(appt.id);
    try {
      const raw = extraDraft.trim().replace(",", ".");
      const parsed = raw === "" ? null : Number(raw);
      await onMarkDone(appt.id, { formaPagamento: formaPagDraft, valorExtra: Number.isFinite(parsed) ? parsed : null });
      setDoneFormId(null);
    } finally { setBusyId(null); }
  }

  function waLink(appt) {
    const cliente = clients.find(c => c.id === appt.clienteId);
    const servico = services.find(s => s.id === appt.servicoId);
    const link = `${window.location.origin}${window.location.pathname}?token=${appt.token}`;
    const text = (establishment.waTemplate || DEFAULT_WA_TEMPLATE)
      .replace("{cliente}", cliente?.nome.split(" ")[0] || "")
      .replace("{data}", fmtDate(appt.data))
      .replace("{horario}", appt.horario)
      .replace("{servico}", servico?.nome || "")
      .replace("{link}", link);
    return `https://wa.me/${normalizeWhatsapp(cliente?.whatsapp)}?text=${encodeURIComponent(text)}`;
  }

  // Lembrete manual pro WhatsApp da própria profissional (não existe
  // envio automático agendado numa página estática — isso exigiria um
  // serviço externo pago rodando 24h. Esse botão já deixa a mensagem
  // pronta com os horários do dia; um toque e ela chega no seu
  // WhatsApp pra você reencaminhar ou só se organizar).
  function lembreteDoDiaLink() {
    const dia = selectedDate || todayIso();
    const doDia = appointments
      .filter(a => a.data === dia && a.status !== "cancelado")
      .sort((a, b) => a.horario.localeCompare(b.horario));
    const linhas = doDia.map(a => {
      const cliente = clients.find(c => c.id === a.clienteId);
      const servico = services.find(s => s.id === a.servicoId);
      return `⏰ ${a.horario} — ${cliente?.nome || "Cliente"} (${servico?.nome || "serviço"})`;
    });
    const text = doDia.length > 0
      ? `📋 Lembrete dos atendimentos de ${fmtDate(dia)}:\n\n${linhas.join("\n")}`
      : `📋 Você não tem atendimentos marcados pra ${fmtDate(dia)}.`;
    return `https://wa.me/${normalizeWhatsapp(establishment.whatsapp)}?text=${encodeURIComponent(text)}`;
  }

  // Mensagem rápida de atraso pra cliente — mesmo esquema do waLink,
  // só que com um texto pronto avisando quantos minutos de atraso.
  function atrasoLink(appt, minutos) {
    const cliente = clients.find(c => c.id === appt.clienteId);
    const primeiro = cliente?.nome?.split(" ")[0] || "";
    const text = `Oi${primeiro ? " " + primeiro : ""}! Vou atrasar uns ${minutos} minutinhos pro seu horário das ${appt.horario}, já já te atendo 🙏`;
    return `https://wa.me/${normalizeWhatsapp(cliente?.whatsapp)}?text=${encodeURIComponent(text)}`;
  }

  const appointmentDates = useMemo(() => new Set(appointments.filter(a => a.status !== "cancelado").map(a => a.data)), [appointments]);
  const timeOffDates = useMemo(() => {
    const set = new Set();
    timeOff.forEach(t => {
      const start = new Date(t.startAt); const end = new Date(t.endAt);
      for (let d = new Date(start); d < end; d.setDate(d.getDate() + 1)) {
        set.add(toLocalIso(d));
      }
    });
    return set;
  }, [timeOff]);

  function getDayMeta(dateStr) {
    const hasAppt = appointmentDates.has(dateStr);
    const hasOff = timeOffDates.has(dateStr);
    if (hasAppt) return { dot: COLORS.primary, bg: COLORS.primarySoft };
    if (hasOff) return { dot: COLORS.terra, bg: COLORS.terraSoft };
    return {};
  }

  const timeOffOnSelectedDate = useMemo(() => {
    if (!selectedDate) return [];
    const dayStart = new Date(selectedDate + "T00:00:00");
    const dayEnd = new Date(selectedDate + "T23:59:59.999");
    return timeOff.filter(t => new Date(t.startAt) <= dayEnd && new Date(t.endAt) >= dayStart);
  }, [selectedDate, timeOff]);

  // Folga/férias valem o dia inteiro — seguem como aviso separado, acima.
  const allDayOffOnSelectedDate = useMemo(
    () => timeOffOnSelectedDate.filter(t => t.tipo === "folga" || t.tipo === "ferias"),
    [timeOffOnSelectedDate]
  );
  // Bloqueio/compromisso têm horário marcado — por isso entram
  // misturados na mesma linha do tempo dos atendimentos, na ordem certa.
  const timedOffOnSelectedDate = useMemo(
    () => timeOffOnSelectedDate
      .filter(t => t.tipo === "bloqueio" || t.tipo === "compromisso")
      .map(t => ({
        ...t,
        horarioInicio: new Date(t.startAt).toTimeString().slice(0, 5),
        horarioFim: new Date(t.endAt).toTimeString().slice(0, 5),
      })),
    [timeOffOnSelectedDate]
  );

  const filtered = appointments
    .filter(a => filter === "todos" ? true : a.status === filter)
    .filter(a => selectedDate ? a.data === selectedDate : true)
    .sort((a, b) => (a.data + a.horario).localeCompare(b.data + b.horario));

  // Linha do tempo do dia: atendimentos + bloqueios/compromissos juntos,
  // ordenados por horário — só quando uma data específica está selecionada.
  const dayTimeline = useMemo(() => {
    const apptItems = filtered.map(a => ({ kind: "appointment", horario: a.horario, item: a }));
    if (!selectedDate) return apptItems;
    const offItems = timedOffOnSelectedDate.map(t => ({ kind: "timeoff", horario: t.horarioInicio, item: t }));
    return [...apptItems, ...offItems].sort((x, y) => x.horario.localeCompare(y.horario));
  }, [filtered, timedOffOnSelectedDate, selectedDate]);

  const filters = [
    { key: "todos", label: "Todos" },
    { key: "confirmado", label: "Confirmados" },
    { key: "aguardando", label: "Aguardando" },
    { key: "cancelado", label: "Cancelados" },
  ];
  const tomorrowIso = toLocalIso(new Date(Date.now() + 86400000));
  const awaitingTomorrow = appointments.filter(a => a.data === tomorrowIso && a.status === "aguardando").length;

  return (
    <div className="fade-up">
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, margin: "2px 0 16px", flexWrap: "wrap" }}>
        <h1 className="font-display" style={{ fontSize: 27, margin: 0, fontWeight: 600 }}>Agenda</h1>
        <a href={lembreteDoDiaLink()} target="_blank" rel="noopener noreferrer" style={{ textDecoration: "none" }}>
          <button className="font-body sd-btn" style={{
            display: "flex", alignItems: "center", gap: 6, background: COLORS.bgAlt, color: COLORS.ink,
            border: `1px solid ${COLORS.border}`, borderRadius: 999, padding: "9px 14px", fontSize: 12.5, fontWeight: 700, cursor: "pointer",
          }}>
            <MessageCircle size={13} /> Lembrete do dia no meu WhatsApp
          </button>
        </a>
      </div>

      {awaitingTomorrow > 0 && (
        <Card style={{
          background: COLORS.amberSoft, border: `1px solid ${COLORS.amber}22`,
          padding: "11px 14px", fontSize: 13, color: "#7A5610", marginBottom: 16, boxShadow: "none",
        }}>
          Você possui {awaitingTomorrow} cliente{awaitingTomorrow > 1 ? "s" : ""} aguardando confirmação para amanhã.
        </Card>
      )}

      <div className="sd-agenda-grid">
        <div className="sd-agenda-left">
          <Card style={{ padding: 14 }}>
            <MonthCalendar
              year={viewYear} month={viewMonth}
              onNavigate={(delta) => { const n = addMonths(viewYear, viewMonth, delta); setViewYear(n.year); setViewMonth(n.month); }}
              selectedDate={selectedDate}
              onSelectDate={(d) => setSelectedDate(prev => prev === d ? null : d)}
              getDayMeta={getDayMeta}
            />
            <div style={{ display: "flex", gap: 14, marginTop: 12, fontSize: 11, color: COLORS.inkSoft, flexWrap: "wrap" }}>
              <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 8, height: 8, borderRadius: "50%", background: COLORS.primary, display: "inline-block" }} /> Com agendamento</span>
              <span style={{ display: "flex", alignItems: "center", gap: 5 }}><span style={{ width: 8, height: 8, borderRadius: "50%", background: COLORS.terra, display: "inline-block" }} /> Folga/férias/bloqueio/compromisso</span>
            </div>
          </Card>
        </div>

        <div>
          {selectedDate && (
            <Card className="fade-up" style={{ padding: "13px 14px", marginBottom: 16, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, background: COLORS.primarySoft, border: "none", boxShadow: "none" }}>
              <span style={{ fontSize: 12.5, color: COLORS.primaryDeep, fontWeight: 600 }}>Quer criar um novo agendamento pra {fmtDate(selectedDate)}?</span>
              <button onClick={() => setShowNewModal(true)} className="font-body sd-btn" style={{
                background: COLORS.primary, color: "#fff", border: "none", borderRadius: 999,
                padding: "8px 13px", fontSize: 12, fontWeight: 700, cursor: "pointer", flexShrink: 0,
                display: "flex", alignItems: "center", gap: 5,
              }}>
                <Plus size={13} /> Novo agendamento
              </button>
            </Card>
          )}

          {allDayOffOnSelectedDate.length > 0 && (
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
              {allDayOffOnSelectedDate.map(t => {
                const prof = professionals.find(p => p.id === t.professionalId);
                const tipoLabel = { folga: "Folga", ferias: "Férias" }[t.tipo] || t.tipo;
                return (
                  <Card key={t.id} className="fade-up" style={{ padding: "12px 14px", background: COLORS.terraSoft, border: "none", boxShadow: "none" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 7, fontWeight: 700, fontSize: 12.5, color: COLORS.terra }}>
                      <Clock size={13} /> {tipoLabel} (dia inteiro) · {prof?.nome || "Profissional"}
                    </div>
                    {t.motivo ? (
                      <div style={{ fontSize: 12.5, color: "#7A2A2A", marginTop: 4 }}>{t.motivo}</div>
                    ) : (
                      <div style={{ fontSize: 12, color: "#7A2A2A", marginTop: 4, opacity: 0.7 }}>Sem motivo cadastrado</div>
                    )}
                  </Card>
                );
              })}
            </div>
          )}

          <div className="scrollbar-thin" style={{ display: "flex", gap: 6, marginBottom: 14, overflowX: "auto", background: COLORS.bgAlt, padding: 4, borderRadius: 13 }}>
            {filters.map(f => (
              <button key={f.key} onClick={() => setFilter(f.key)}
                className="font-body sd-tab"
                style={{
                  flexShrink: 0, border: "none",
                  background: filter === f.key ? COLORS.surface : "transparent",
                  color: filter === f.key ? COLORS.primary : COLORS.inkSoft,
                  boxShadow: filter === f.key ? COLORS.shadowSm : "none",
                  borderRadius: 10, padding: "8px 13px", fontSize: 12.5, fontWeight: 700, cursor: "pointer",
                }}>
                {f.label}
              </button>
            ))}
          </div>

          {dayTimeline.length === 0 && appointments.length > 0 ? (
            <div style={{ color: COLORS.inkFaint, fontSize: 13, padding: "36px 0", textAlign: "center" }}>Nenhum agendamento aqui.</div>
          ) : (
            <Card style={{ padding: "4px 15px" }}>
              {dayTimeline.map((entry, i) => {
                if (entry.kind === "timeoff") {
                  const t = entry.item;
                  const prof = professionals.find(p => p.id === t.professionalId);
                  const tipoLabel = { bloqueio: "Bloqueio", compromisso: "Compromisso" }[t.tipo] || t.tipo;
                  return (
                    <div key={`off-${t.id}`} className="sd-agenda-row fade-up" style={{ padding: "13px 0", borderBottom: `1px solid ${COLORS.border}`, animationDelay: `${Math.min(i, 6) * 0.04}s` }}>
                      <div style={{ display: "flex", gap: 10 }}>
                        <div style={{ textAlign: "center", flexShrink: 0, paddingTop: 1, minWidth: 46 }}>
                          <div className="font-display" style={{ fontSize: 15, fontWeight: 700, color: COLORS.terra, lineHeight: 1 }}>{t.horarioInicio}</div>
                        </div>
                        <div>
                          <div style={{ fontWeight: 700, fontSize: 14.5, color: COLORS.terra, display: "flex", alignItems: "center", gap: 6 }}>
                            <Clock size={13} /> {tipoLabel} · {prof?.nome || "Profissional"}
                          </div>
                          <div style={{ fontSize: 12.5, color: "#7A2A2A", marginTop: 3 }}>
                            Das {t.horarioInicio} até {t.horarioFim}
                          </div>
                          {t.motivo && (
                            <div style={{ fontSize: 12, color: "#7A2A2A", marginTop: 2, opacity: 0.8 }}>{t.motivo}</div>
                          )}
                        </div>
                      </div>
                    </div>
                  );
                }

                const appt = entry.item;
                const cliente = clients.find(c => c.id === appt.clienteId);
                const servico = services.find(s => s.id === appt.servicoId);
                const prof = professionals.find(p => p.id === appt.profissionalId);
                const meta = statusMeta[appt.status];
                const busy = busyId === appt.id;
                const fimHorario = servico ? addMinutesToTime(appt.horario, servico.duracao) : null;
                return (
                  <div key={appt.id} className="sd-agenda-row fade-up" style={{ padding: "13px 0", borderBottom: `1px solid ${COLORS.border}`, animationDelay: `${Math.min(i, 6) * 0.04}s`, opacity: busy ? 0.7 : 1 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
                      <div style={{ display: "flex", gap: 10 }}>
                        <div style={{ textAlign: "center", flexShrink: 0, paddingTop: 1, minWidth: 46 }}>
                          <div className="font-display" style={{ fontSize: 15, fontWeight: 700, color: COLORS.ink, lineHeight: 1 }}>{appt.horario}</div>
                          {fimHorario && <div style={{ fontSize: 10.5, color: COLORS.inkFaint, marginTop: 3 }}>até {fimHorario}</div>}
                        </div>
                        <div>
                          <div style={{ fontWeight: 700, fontSize: 14.5, display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                            {cliente?.nome || "Cliente"}
                            {cliente?.historicoCancelamento && <Pill fg={COLORS.terra} bg={COLORS.terraSoft} dot>histórico</Pill>}
                          </div>
                          <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginTop: 3 }}>
                            {servico?.nome} · {prof?.nome}
                          </div>
                          <div style={{ fontSize: 12, color: COLORS.inkFaint, marginTop: 2 }}>
                            {fmtDate(appt.data)}
                          </div>
                        </div>
                      </div>
                      <Pill fg={meta.fg} bg={meta.bg} dot>{meta.label}</Pill>
                    </div>

                    <div style={{ display: "flex", gap: 7, marginTop: 13, flexWrap: "wrap", alignItems: "center" }}>
                      {establishment.waAutoSend && (
                        <button disabled={sendingAutoId === appt.id} onClick={() => enviarAutomatico(appt)} className="font-body sd-btn"
                          style={{
                            display: "flex", alignItems: "center", gap: 6, background: "#128C4A", color: "#fff",
                            border: "none", borderRadius: 999, padding: "8px 13px", fontSize: 12, fontWeight: 700, cursor: "pointer",
                            opacity: sendingAutoId === appt.id ? 0.7 : 1,
                          }}>
                          <MessageCircle size={13} /> {sendingAutoId === appt.id ? "Enviando..." : "Enviar automático"}
                        </button>
                      )}
                      <a href={waLink(appt)} target="_blank" rel="noopener noreferrer" style={{ textDecoration: "none" }}>
                        <button className="font-body sd-btn" style={{
                          display: "flex", alignItems: "center", gap: 6, background: "transparent", color: "#1E9E56",
                          border: "1px solid #1E9E5655", borderRadius: 999, padding: "8px 13px", fontSize: 12, fontWeight: 700, cursor: "pointer",
                        }}>
                          <MessageCircle size={13} /> {establishment.waAutoSend ? "Abrir no WhatsApp" : "WhatsApp"}
                        </button>
                      </a>

                      <select
                        value=""
                        onChange={e => {
                          const minutos = e.target.value;
                          if (minutos) window.open(atrasoLink(appt, minutos), "_blank", "noopener,noreferrer");
                          e.target.value = "";
                        }}
                        className="font-body sd-btn"
                        style={{
                          background: "transparent", border: `1px solid ${COLORS.border}`, color: COLORS.inkSoft,
                          borderRadius: 999, padding: "8px 10px", fontSize: 12, fontWeight: 700, cursor: "pointer",
                        }}
                      >
                        <option value="">Avisar atraso</option>
                        <option value="10">10 min</option>
                        <option value="15">15 min</option>
                        <option value="20">20 min</option>
                        <option value="30">30 min</option>
                      </select>

                      {appt.status !== "confirmado" && (
                        <button disabled={busy} onClick={() => setStatus(appt.id, "confirmado")} className="font-body sd-btn"
                          style={{ background: "transparent", border: `1px solid ${COLORS.sage}55`, color: COLORS.sage, borderRadius: 999, padding: "8px 13px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                          Confirmar
                        </button>
                      )}
                      {appt.status !== "cancelado" && (
                        <button disabled={busy} onClick={() => setStatus(appt.id, "cancelado")} className="font-body sd-btn"
                          style={{ background: "transparent", border: `1px solid ${COLORS.terra}55`, color: COLORS.terra, borderRadius: 999, padding: "8px 13px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                    Cancelar
                  </button>
                )}
                {appt.status !== "cancelado" && !appt.realizado && doneFormId !== appt.id && (
                  <button disabled={busy} onClick={() => openDoneForm(appt)} className="font-body sd-btn"
                    style={{ background: COLORS.primary, border: "none", color: "#fff", borderRadius: 999, padding: "8px 13px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                    Confirmar atendimento realizado
                  </button>
                )}
              </div>

              {appt.realizado && doneFormId !== appt.id && (
                <button
                  onClick={() => openDoneForm(appt)}
                  className="font-body sd-btn"
                  style={{
                    display: "flex", alignItems: "center", gap: 6, marginTop: 11, background: "none", border: "none",
                    padding: 0, cursor: "pointer", color: COLORS.sage, fontSize: 12, fontWeight: 700,
                  }}
                >
                  <Check size={13} /> Atendimento realizado · {PAGAMENTO_LABELS[appt.formaPagamento] || "pagamento não informado"}
                  {appt.valorExtra ? ` · +${appt.valorExtra.toLocaleString("pt-BR", { style: "currency", currency: "BRL" })} extra` : ""}
                  <Pencil size={11} style={{ marginLeft: 2, opacity: 0.7 }} />
                </button>
              )}

              {doneFormId === appt.id && (
                <div style={{ marginTop: 12, paddingTop: 12, borderTop: `1px solid ${COLORS.border}`, display: "flex", flexDirection: "column", gap: 9 }}>
                  <div style={{ fontSize: 12, color: COLORS.inkSoft, fontWeight: 700 }}>Como a cliente pagou?</div>
                  <div style={{ display: "flex", gap: 7 }}>
                    {["pix", "dinheiro", "cartao"].map(fp => (
                      <button key={fp} type="button" onClick={() => setFormaPagDraft(fp)} className="font-body sd-btn" style={{
                        flex: 1, border: `1.5px solid ${formaPagDraft === fp ? COLORS.primary : COLORS.border}`,
                        background: formaPagDraft === fp ? COLORS.primarySoft : "transparent",
                        color: formaPagDraft === fp ? COLORS.primary : COLORS.ink,
                        borderRadius: 9, padding: "8px 6px", fontSize: 12.5, fontWeight: 700, cursor: "pointer",
                      }}>
                        {PAGAMENTO_LABELS[fp]}
                      </button>
                    ))}
                  </div>
                  <input
                    type="number" step="0.01" min="0" placeholder="Valor extra cobrado (opcional)"
                    value={extraDraft} onChange={e => setExtraDraft(e.target.value)}
                    style={{ ...fieldStyle, padding: "9px 11px", fontSize: 16 }}
                  />
                  <div style={{ display: "flex", gap: 8 }}>
                    <button disabled={busy} onClick={() => submitDone(appt)} className="font-body sd-btn" style={{
                      flex: 1, background: COLORS.sage, color: "#fff", border: "none", borderRadius: 999,
                      padding: "9px 13px", fontSize: 12.5, fontWeight: 700, cursor: "pointer",
                    }}>
                      Confirmar atendimento
                    </button>
                    <button type="button" onClick={() => setDoneFormId(null)} className="font-body sd-btn" style={{
                      background: "none", border: "none", color: COLORS.inkFaint, fontSize: 12.5, fontWeight: 600, cursor: "pointer", padding: "9px 10px",
                    }}>
                      Cancelar
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        })}
            </Card>
          )}
        </div>
      </div>

      {showNewModal && (
        <NovoAgendamentoModal
          date={selectedDate}
          establishment={establishment}
          services={services}
          professionals={professionals}
          clients={clients}
          onCreate={onCreateAppointment}
          onConfirm={onSetStatus}
          onClose={() => setShowNewModal(false)}
        />
      )}
    </div>
  );
}

/* Modal de agendamento manual, aberto quando a profissional clica
   numa data na Agenda e escolhe "Novo agendamento". Usa a mesma
   RPC create_booking do agendamento público (ela já cuida de criar
   ou atualizar a cliente pelo WhatsApp), e opcionalmente já marca
   como confirmado em seguida — útil quando a cliente está ali na
   frente combinando o horário. */
function NovoAgendamentoModal({ date, establishment, services, professionals, clients, onCreate, onConfirm, onClose }) {
  const [dataSelecionada, setDataSelecionada] = useState(date || todayIso());
  const [clienteId, setClienteId] = useState("nova");
  const [nome, setNome] = useState("");
  const [whatsapp, setWhatsapp] = useState("");
  const [servicoId, setServicoId] = useState(services[0]?.id || "");
  const [profissionalId, setProfissionalId] = useState(professionals[0]?.id || "");
  const [horario, setHorario] = useState(null);
  const [observacao, setObservacao] = useState("");
  const [confirmarAgora, setConfirmarAgora] = useState(true);
  const [slots, setSlots] = useState([]);
  const [slotsLoading, setSlotsLoading] = useState(false);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");
  const [importando, setImportando] = useState(false);

  async function importarContato() {
    setImportando(true); setError("");
    try {
      const contato = await importarContatoDoTelefone();
      if (contato) {
        setClienteId("nova");
        setNome(contato.nome);
        setWhatsapp(contato.whatsapp);
      }
    } catch (err) {
      // A pessoa cancelou o seletor de contatos ou negou a permissão —
      // não é um erro de verdade, então não precisa mostrar nada.
    } finally {
      setImportando(false);
    }
  }

  useEffect(() => {
    if (!servicoId || !profissionalId || !dataSelecionada) { setSlots([]); return; }
    let cancelled = false;
    setSlotsLoading(true); setHorario(null);
    rest.rpc("get_available_slots", {
      p_establishment_id: establishment.id,
      p_professional_id: profissionalId,
      p_service_id: servicoId,
      p_date: dataSelecionada,
    })
      .then(rows => { if (!cancelled) setSlots((rows || []).map(r => (r.slot || "").slice(0, 5)).filter(Boolean)); })
      .catch(() => { if (!cancelled) setSlots([]); })
      .finally(() => { if (!cancelled) setSlotsLoading(false); });
    return () => { cancelled = true; };
  }, [servicoId, profissionalId, dataSelecionada, establishment.id]);

  function selectCliente(id) {
    setClienteId(id);
    if (id === "nova") { setNome(""); setWhatsapp(""); return; }
    const c = clients.find(cl => cl.id === id);
    if (c) { setNome(c.nome); setWhatsapp(c.whatsapp || ""); }
  }

  async function submit(e) {
    e.preventDefault();
    if (!nome.trim() || !whatsapp.trim() || !servicoId || !profissionalId || !horario) return;
    setSaving(true); setError("");
    try {
      const appointmentId = await onCreate({
        p_establishment_id: establishment.id,
        p_service_id: servicoId,
        p_professional_id: profissionalId,
        p_data: dataSelecionada,
        p_horario: horario + ":00",
        p_cliente_nome: nome,
        p_cliente_whatsapp: normalizeWhatsapp(whatsapp),
        p_observacao: observacao || null,
      });
      if (confirmarAgora && appointmentId) {
        await onConfirm(appointmentId, "confirmado");
      }
      onClose();
    } catch (err) {
      setError(err.message);
    } finally {
      setSaving(false);
    }
  }

  return (
    <div style={{
      position: "fixed", inset: 0, background: "rgba(36,20,25,0.45)", zIndex: 50,
      display: "flex", alignItems: "flex-end", justifyContent: "center",
    }} onClick={onClose}>
      <div
        className="pop-in"
        style={{
          background: COLORS.surface, borderRadius: "20px 20px 0 0", padding: "20px 18px calc(env(safe-area-inset-bottom, 0px) + 20px)",
          width: "100%", maxWidth: 480, maxHeight: "88vh", overflowY: "auto",
        }}
        onClick={e => e.stopPropagation()}
      >
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
          <h2 className="font-display" style={{ fontSize: 20, margin: 0, fontWeight: 600 }}>Novo agendamento</h2>
          <button onClick={onClose} className="sd-btn" style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.inkFaint, padding: 6 }}>
            <X size={18} />
          </button>
        </div>
        <div style={{ marginBottom: 16 }}>
          <input type="date" value={dataSelecionada} min={todayIso()} onChange={e => setDataSelecionada(e.target.value)} style={fieldStyle} />
        </div>

        <ErrorBanner message={error} onDismiss={() => setError("")} />

        <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          <div>
            <SectionLabel>Cliente</SectionLabel>
            <select value={clienteId} onChange={e => selectCliente(e.target.value)} style={fieldStyle}>
              <option value="nova">+ Nova cliente (digitar)</option>
              {clients.map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
            </select>
          </div>
          <input placeholder="Nome da cliente" value={nome} onChange={e => setNome(e.target.value)} style={fieldStyle} />
          <input placeholder="WhatsApp (só números, com DDD)" value={whatsapp} onChange={e => setWhatsapp(e.target.value)} style={fieldStyle} />
          {contactPickerSuportado() && (
            <button type="button" onClick={importarContato} disabled={importando} className="font-body sd-btn" style={{
              display: "flex", alignItems: "center", justifyContent: "center", gap: 7,
              background: COLORS.bgAlt, border: `1px dashed ${COLORS.border}`, color: COLORS.inkSoft,
              borderRadius: 12, padding: "10px 12px", fontSize: 12.5, fontWeight: 700, cursor: "pointer", marginTop: -4,
            }}>
              {importando ? <Spinner size={14} color={COLORS.inkSoft} /> : <Users size={14} />}
              {importando ? "Abrindo contatos..." : "Importar contato do celular"}
            </button>
          )}

          <div>
            <SectionLabel>Serviço</SectionLabel>
            <select value={servicoId} onChange={e => setServicoId(e.target.value)} style={fieldStyle}>
              {services.map(s => <option key={s.id} value={s.id}>{s.nome}</option>)}
            </select>
          </div>

          <div>
            <SectionLabel>Profissional</SectionLabel>
            <select value={profissionalId} onChange={e => setProfissionalId(e.target.value)} style={fieldStyle}>
              {professionals.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}
            </select>
          </div>

          <div>
            <SectionLabel>Horário</SectionLabel>
            {slotsLoading && <div style={{ fontSize: 12.5, color: COLORS.inkFaint }}>Buscando horários livres...</div>}
            {!slotsLoading && slots.length === 0 && (
              <div style={{ fontSize: 12.5, color: COLORS.inkFaint }}>Nenhum horário livre pra essa combinação de serviço/profissional nesse dia.</div>
            )}
            {!slotsLoading && slots.length > 0 && (
              <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
                {slots.map(s => (
                  <button key={s} type="button" onClick={() => setHorario(s)} className="font-body sd-btn" style={{
                    border: `1.5px solid ${horario === s ? COLORS.primary : COLORS.border}`,
                    background: horario === s ? COLORS.primarySoft : "transparent",
                    color: horario === s ? COLORS.primary : COLORS.ink,
                    borderRadius: 10, padding: "7px 11px", fontSize: 13, fontWeight: 700, cursor: "pointer",
                  }}>{s}</button>
                ))}
              </div>
            )}
          </div>

          <textarea placeholder="Observação (opcional)" value={observacao} onChange={e => setObservacao(e.target.value)} rows={2} style={{ ...fieldStyle, resize: "vertical", fontFamily: "inherit" }} />

          <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, color: COLORS.ink, cursor: "pointer", marginTop: 2 }}>
            <input type="checkbox" checked={confirmarAgora} onChange={e => setConfirmarAgora(e.target.checked)} style={{ width: 16, height: 16 }} />
            Já confirmar esse agendamento agora
          </label>

          <PrimaryButton type="submit" loading={saving} disabled={!horario} style={{ marginTop: 4 }}>
            <Plus size={15} /> Criar agendamento
          </PrimaryButton>
        </form>
      </div>
    </div>
  );
}

--------------------------------------------------------- */
function Clientes({ data, onUpdate, onImportClients }) {
  const { clients, appointments } = data;
  const fileInputRef = useRef(null);
  const [candidatos, setCandidatos] = useState(null);
  const [selecionados, setSelecionados] = useState({});
  const [importando, setImportando] = useState(false);
  const [error, setError] = useState("");
  const [sucesso, setSucesso] = useState("");

  function abrirSeletorArquivo() {
    setError(""); setSucesso("");
    fileInputRef.current?.click();
  }

  function onArquivoEscolhido(e) {
    const file = e.target.files?.[0];
    e.target.value = "";
    if (!file) return;
    setError(""); setSucesso("");
    const reader = new FileReader();
    reader.onload = () => {
      const contatos = parseVCard(String(reader.result || ""));
      if (contatos.length === 0) {
        setError("Não encontrei nenhum contato com telefone nesse arquivo.");
        return;
      }
      setCandidatos(contatos);
      setSelecionados(Object.fromEntries(contatos.map((_, i) => [i, true])));
    };
    reader.onerror = () => setError("Não consegui ler esse arquivo. Tenta exportar de novo do app Contatos.");
    reader.readAsText(file);
  }

  async function confirmarImportacao() {
    const escolhidos = candidatos.filter((_, i) => selecionados[i]);
    if (escolhidos.length === 0) return;
    setImportando(true); setError("");
    try {
      const total = await onImportClients(escolhidos);
      setSucesso(`${total} contato${total !== 1 ? "s" : ""} importado${total !== 1 ? "s" : ""} com sucesso.`);
      setCandidatos(null);
    } catch (err) {
      setError(err.message);
    } finally {
      setImportando(false);
    }
  }

  return (
    <div className="fade-up">
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, margin: "2px 0 16px", flexWrap: "wrap" }}>
        <h1 className="font-display" style={{ fontSize: 27, margin: 0, fontWeight: 600 }}>Clientes</h1>
        <button onClick={abrirSeletorArquivo} className="font-body sd-btn" style={{
          display: "flex", alignItems: "center", gap: 6, background: COLORS.bgAlt, color: COLORS.ink,
          border: `1px solid ${COLORS.border}`, borderRadius: 999, padding: "9px 14px", fontSize: 12.5, fontWeight: 700, cursor: "pointer",
        }}>
          <Users size={13} /> Importar contatos (.vcf)
        </button>
        <input ref={fileInputRef} type="file" accept=".vcf,text/vcard,text/x-vcard" onChange={onArquivoEscolhido} style={{ display: "none" }} />
      </div>

      <div style={{ fontSize: 11.5, color: COLORS.inkFaint, marginBottom: 14 }}>
        No iPhone: abra o app Contatos, toque em "Selecionar" no canto, escolha as pessoas, toque em
        "Compartilhar contato" e depois em "Salvar em Arquivos". Aí volta aqui e importa esse arquivo.
      </div>

      <ErrorBanner message={error} onDismiss={() => setError("")} />
      {sucesso && (
        <Card style={{ padding: "11px 14px", marginBottom: 14, background: COLORS.sageSoft || "#E7F2EA", border: "none", fontSize: 12.5, color: COLORS.sage, fontWeight: 600 }}>
          {sucesso}
        </Card>
      )}

      {candidatos && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(36,20,25,0.5)", zIndex: 60, display: "flex", alignItems: "flex-end", justifyContent: "center" }} onClick={() => setCandidatos(null)}>
          <div className="pop-in" style={{ background: COLORS.surface, borderRadius: "20px 20px 0 0", padding: "20px 18px calc(env(safe-area-inset-bottom, 0px) + 20px)", width: "100%", maxWidth: 480, maxHeight: "82vh", overflowY: "auto" }} onClick={e => e.stopPropagation()}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
              <h2 className="font-display" style={{ fontSize: 19, margin: 0, fontWeight: 600 }}>{candidatos.length} contato{candidatos.length !== 1 ? "s" : ""} encontrado{candidatos.length !== 1 ? "s" : ""}</h2>
              <button onClick={() => setCandidatos(null)} className="sd-btn" style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.inkFaint, padding: 6 }}>
                <X size={18} />
              </button>
            </div>
            <div style={{ fontSize: 12, color: COLORS.inkFaint, marginBottom: 14 }}>
              Desmarque quem você não quiser importar. Quem já é cliente aqui só atualiza o nome — não duplica.
            </div>

            <div style={{ display: "flex", flexDirection: "column", gap: 2, marginBottom: 16 }}>
              {candidatos.map((c, i) => (
                <label key={i} className="sd-row" style={{ display: "flex", alignItems: "center", gap: 10, padding: "9px 6px", borderRadius: 10, cursor: "pointer" }}>
                  <input type="checkbox" checked={!!selecionados[i]} onChange={e => setSelecionados(s => ({ ...s, [i]: e.target.checked }))} style={{ width: 17, height: 17, flexShrink: 0 }} />
                  <div style={{ minWidth: 0 }}>
                    <div style={{ fontWeight: 700, fontSize: 13.5 }}>{c.nome}</div>
                    <div style={{ fontSize: 11.5, color: COLORS.inkFaint }}>{c.whatsapp}</div>
                  </div>
                </label>
              ))}
            </div>

            <PrimaryButton onClick={confirmarImportacao} loading={importando} disabled={Object.values(selecionados).every(v => !v)}>
              Importar {Object.values(selecionados).filter(Boolean).length} contato{Object.values(selecionados).filter(Boolean).length !== 1 ? "s" : ""}
            </PrimaryButton>
          </div>
        </div>
      )}

      {clients.length === 0 ? (
        <Card style={{ padding: 18, textAlign: "center", color: COLORS.inkFaint, fontSize: 13 }}>
          Nenhuma cliente cadastrada ainda. Elas aparecem aqui quando agendam pela primeira vez, ou importe de um arquivo acima.
        </Card>
      ) : (
        <Card style={{ padding: 4, overflow: "hidden" }}>
          {clients.map((c, i) => {
            const total = appointments.filter(a => a.clienteId === c.id).length;
            return (
              <div key={c.id} className="sd-row" style={{
                display: "flex", alignItems: "center", gap: 12, padding: "13px 12px",
                borderBottom: i < clients.length - 1 ? `1px solid ${COLORS.border}` : "none", borderRadius: 10,
              }}>
                <EditableAvatar
                  name={c.nome}
                  photoUrl={c.fotoUrl}
                  size={38}
                  onChangePhoto={(dataUrl) => onUpdate(c.id, { foto_url: dataUrl })}
                />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 700, fontSize: 14, display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                    {c.nome}
                    {c.historicoCancelamento && <Pill fg={COLORS.terra} bg={COLORS.terraSoft} dot>histórico</Pill>}
                  </div>
                  <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>
                    {total} atendimento{total !== 1 ? "s" : ""} · {c.whatsapp}
                  </div>
                </div>
              </div>
            );
          })}
        </Card>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   ADMIN: EQUIPE (PROFISSIONAIS)
--------------------------------------------------------- */
function Profissionais({ data, onAdd, onUpdate, onRemove }) {
  const { professionals, appointments } = data;
  const [nome, setNome] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [saving, setSaving] = useState(false);
  const [busyId, setBusyId] = useState(null);
  const [error, setError] = useState("");

  async function submit(e) {
    e.preventDefault();
    if (!nome.trim()) return;
    setSaving(true); setError("");
    try {
      if (editingId) await onUpdate(editingId, { nome });
      else await onAdd({ nome });
      setNome(""); setEditingId(null);
    } catch (err) { setError(err.message); }
    finally { setSaving(false); }
  }

  function edit(p) { setEditingId(p.id); setNome(p.nome); }

  async function toggleAtivo(p) {
    setBusyId(p.id); setError("");
    try { await onUpdate(p.id, { ativo: !p.ativo }); }
    catch (err) { setError(err.message); }
    finally { setBusyId(null); }
  }

  async function remove(p) {
    setBusyId(p.id); setError("");
    try {
      await onRemove(p.id);
      if (editingId === p.id) { setEditingId(null); setNome(""); }
    } catch (err) {
      setError(/foreign key|violat/i.test(err.message)
        ? "Não é possível excluir: esta profissional tem agendamentos no histórico. Desative-a em vez de excluir."
        : err.message);
    }
    finally { setBusyId(null); }
  }

  return (
    <div className="fade-up">
      <h1 className="font-display" style={{ fontSize: 27, margin: "2px 0 16px", fontWeight: 600 }}>Equipe</h1>
      <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginBottom: 16, lineHeight: 1.5 }}>
        Cada profissional aparece no link público de agendamento e tem sua própria agenda e horários.
      </div>
      <ErrorBanner message={error} onDismiss={() => setError("")} />

      <Card style={{ padding: 16, marginBottom: 16 }}>
        <SectionLabel>{editingId ? "Editar profissional" : "Nova profissional"}</SectionLabel>
        <form onSubmit={submit} style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <input placeholder="Nome da profissional" value={nome} onChange={e => setNome(e.target.value)} style={fieldStyle} />
          <PrimaryButton type="submit" loading={saving} style={{ marginTop: 2 }}>
            <Plus size={15} /> {editingId ? "Salvar alterações" : "Adicionar profissional"}
          </PrimaryButton>
          {editingId && (
            <button type="button" onClick={() => { setEditingId(null); setNome(""); }}
              className="font-body" style={{ background: "none", border: "none", color: COLORS.inkFaint, fontSize: 12, cursor: "pointer" }}>
              Cancelar edição
            </button>
          )}
        </form>
      </Card>

      {professionals.length === 0 ? (
        <Card style={{ padding: 18, textAlign: "center", color: COLORS.inkFaint, fontSize: 13 }}>Nenhuma profissional cadastrada ainda.</Card>
      ) : (
        <Card style={{ padding: 4, overflow: "hidden" }}>
          {professionals.map((p, i) => {
            const total = appointments.filter(a => a.profissionalId === p.id && a.status !== "cancelado").length;
            const busy = busyId === p.id;
            return (
              <div key={p.id} className="sd-row" style={{
                display: "flex", alignItems: "center", gap: 12, padding: "13px 12px",
                borderBottom: i < professionals.length - 1 ? `1px solid ${COLORS.border}` : "none", borderRadius: 10,
                opacity: busy ? 0.6 : 1,
              }}>
                <EditableAvatar
                  name={p.nome}
                  photoUrl={p.fotoUrl}
                  size={38}
                  disabled={busy}
                  onChangePhoto={(dataUrl) => onUpdate(p.id, { foto_url: dataUrl })}
                />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontWeight: 700, fontSize: 14, display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                    {p.nome}
                    <Pill fg={p.ativo !== false ? COLORS.sage : COLORS.inkFaint} bg={p.ativo !== false ? COLORS.sageSoft : COLORS.bgAlt} dot>
                      {p.ativo !== false ? "Ativa" : "Inativa"}
                    </Pill>
                  </div>
                  <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>{total} atendimento{total !== 1 ? "s" : ""}</div>
                </div>
                <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                  <button disabled={busy} onClick={() => edit(p)} className="sd-btn" style={{ background: COLORS.primarySoft, border: "none", borderRadius: 9, width: 32, height: 32, cursor: "pointer", color: COLORS.primary }}>
                    <Pencil size={13.5} style={{ display: "block", margin: "0 auto" }} />
                  </button>
                  <button disabled={busy} onClick={() => toggleAtivo(p)} className="font-body sd-btn" style={{
                    background: "transparent", border: `1px solid ${COLORS.border}`, color: COLORS.inkSoft,
                    borderRadius: 9, padding: "0 10px", fontSize: 11, fontWeight: 700, cursor: "pointer", height: 32,
                  }}>
                    {p.ativo !== false ? "Desativar" : "Ativar"}
                  </button>
                  <button disabled={busy} onClick={() => remove(p)} className="sd-btn" style={{ background: COLORS.terraSoft, border: "none", borderRadius: 9, width: 32, height: 32, cursor: "pointer", color: COLORS.terra }}>
                    <Trash2 size={13.5} style={{ display: "block", margin: "0 auto" }} />
                  </button>
                </div>
              </div>
            );
          })}
        </Card>
      )}
    </div>
  );
}

function addDaysToDateStr(dateStr, days) {
  const d = new Date(dateStr + "T00:00:00");
  d.setDate(d.getDate() + days);
  return toLocalIso(d);
}

/* ---------------------------------------------------------
   ADMIN: VAGOS (horários ainda disponíveis no dia)
--------------------------------------------------------- */
// Reaproveita a mesma RPC get_available_slots já usada no modal de
// novo agendamento e no agendamento público — ela já calcula em
// tempo real, a partir do horário de funcionamento, folgas/férias/
// bloqueios e agendamentos existentes, então o que aparece aqui é
// sempre a mesma verdade que o resto do app usa pra marcar horário.
function HorariosLivres({ data, establishment }) {
  const { professionals, services } = data;
  const profsAtivos = professionals.filter(p => p.ativo !== false);

  const [selectedDate, setSelectedDate] = useState(() => todayIso());
  const [servicoId, setServicoId] = useState(services[0]?.id || "");
  const [profissionalId, setProfissionalId] = useState("todos");
  const [slotsPorProf, setSlotsPorProf] = useState({});
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    if (!servicoId || !selectedDate || profsAtivos.length === 0) { setSlotsPorProf({}); return; }
    let cancelled = false;
    setLoading(true); setError("");
    const alvo = profissionalId === "todos" ? profsAtivos : profsAtivos.filter(p => p.id === profissionalId);
    Promise.all(alvo.map(p =>
      rest.rpc("get_available_slots", {
        p_establishment_id: establishment.id,
        p_professional_id: p.id,
        p_service_id: servicoId,
        p_date: selectedDate,
      })
        .then(rows => ({ id: p.id, slots: (rows || []).map(r => (r.slot || "").slice(0, 5)).filter(Boolean) }))
        .catch(() => ({ id: p.id, slots: null }))
    )).then(results => {
      if (cancelled) return;
      const map = {};
      results.forEach(r => { map[r.id] = r.slots; });
      setSlotsPorProf(map);
      if (results.some(r => r.slots === null)) setError("Não deu pra buscar os horários de uma ou mais profissionais agora.");
    }).finally(() => { if (!cancelled) setLoading(false); });
    return () => { cancelled = true; };
  }, [servicoId, profissionalId, selectedDate, establishment.id, profsAtivos.length]);

  const servico = services.find(s => s.id === servicoId);

  return (
    <div className="fade-up">
      <h1 className="font-display" style={{ fontSize: 27, margin: "2px 0 6px", fontWeight: 600 }}>Vagos</h1>
      <div style={{ fontSize: 12.5, color: COLORS.inkFaint, marginBottom: 16 }}>
        Horários ainda disponíveis no dia — já considerando o que está marcado, folgas e bloqueios.
      </div>

      <Card style={{ padding: 16, marginBottom: 16 }}>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <input type="date" value={selectedDate} onChange={e => setSelectedDate(e.target.value)} style={fieldStyle} />
          <select value={servicoId} onChange={e => setServicoId(e.target.value)} style={fieldStyle}>
            {services.length === 0 && <option value="">Cadastre um serviço primeiro</option>}
            {services.map(s => <option key={s.id} value={s.id}>{s.nome} · {formatDuration(s.duracao)}</option>)}
          </select>
          <select value={profissionalId} onChange={e => setProfissionalId(e.target.value)} style={fieldStyle}>
            <option value="todos">Todas as profissionais</option>
            {profsAtivos.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}
          </select>
        </div>
        {servico && (
          <div style={{ fontSize: 11.5, color: COLORS.inkFaint, marginTop: 10 }}>
            Considerando a duração de "{servico.nome}" ({formatDuration(servico.duracao)}) pra calcular o que cabe.
          </div>
        )}
      </Card>

      <ErrorBanner message={error} onDismiss={() => setError("")} />

      {profsAtivos.length === 0 ? (
        <Card style={{ padding: 18, textAlign: "center", color: COLORS.inkFaint, fontSize: 13 }}>Cadastre uma profissional primeiro.</Card>
      ) : loading ? (
        <div style={{ display: "flex", alignItems: "center", gap: 8, color: COLORS.inkFaint, fontSize: 13, padding: "20px 0" }}>
          <Spinner size={16} color={COLORS.inkFaint} /> Buscando horários livres...
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {(profissionalId === "todos" ? profsAtivos : profsAtivos.filter(p => p.id === profissionalId)).map(p => {
            const slots = slotsPorProf[p.id];
            return (
              <Card key={p.id} style={{ padding: 16 }}>
                <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 10 }}>{p.nome}</div>
                {!slots || slots.length === 0 ? (
                  <div style={{ fontSize: 12.5, color: COLORS.inkFaint }}>Nenhum horário livre neste dia.</div>
                ) : (
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
                    {slots.map(s => (
                      <span key={s} style={{
                        border: `1.5px solid ${COLORS.border}`, borderRadius: 999, padding: "6px 12px",
                        fontSize: 12.5, fontWeight: 700, color: COLORS.ink,
                      }}>
                        {s}
                      </span>
                    ))}
                  </div>
                )}
              </Card>
            );
          })}
        </div>
      )}
    </div>
  );
}

function buildDaysState(rows, professionalId) {
  const forThis = rows.filter(r => (r.professionalId || null) === (professionalId || null));
  return Array.from({ length: 7 }, (_, weekday) => {
    const row = forThis.find(r => r.weekday === weekday);
    return row && !row.fechado
      ? { weekday, open: true, start: row.start, end: row.end, hasBreak: !!row.breakStart, breakStart: row.breakStart || "12:00", breakEnd: row.breakEnd || "13:00" }
      : { weekday, open: false, start: "09:00", end: "19:00", hasBreak: false, breakStart: "12:00", breakEnd: "13:00" };
  });
}

function Horarios({ data, onSaveWorkingHours, onAddTimeOff, onRemoveTimeOff }) {
  const { professionals, workingHours, timeOff } = data;
  const [selectedProf, setSelectedProf] = useState(""); // "" = padrão do estabelecimento
  const [days, setDays] = useState(() => buildDaysState(workingHours, null));
  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    setDays(buildDaysState(workingHours, selectedProf || null));
  }, [selectedProf, workingHours]);

  function updateDay(weekday, patch) {
    setDays(ds => ds.map(d => d.weekday === weekday ? { ...d, ...patch } : d));
  }

  async function saveHours() {
    setSaving(true); setError(""); setSaved(false);
    try {
      await onSaveWorkingHours(selectedProf || null, days);
      setSaved(true);
      setTimeout(() => setSaved(false), 2000);
    } catch (err) { setError(err.message); }
    finally { setSaving(false); }
  }

  // --- Folgas / férias / bloqueios ---

  const [tipo, setTipo] = useState("folga");

  const [endDate, setEndDate] = useState("");

  const [endTime, setEndTime] = useState("18:00");

    setSavingTo(true); setToError("");

      const payload = (tipo === "bloqueio" || tipo === "compromisso")

            professional_id: toProf, tipo,
            start_at: new Date(`${startDate}T${startTime}:00`).toISOString(),
            end_at: new Date(`${endDate}T${endTime}:00`).toISOString(),

            end_at: new Date(`${addDaysToDateStr(endDate, 1)}T00:00:00`).toISOString(),

      setStartDate(""); setEndDate(""); setMotivo("");

    finally { setSavingTo(false); }

      </div>

      <select value={selectedProf} onChange={e => setSelectedProf(e.target.value)} style={{ ...fieldStyle, marginBottom: 14 }}>
        <option value="">Padrão do estabelecimento</option>
        {professionals.map(p => <option key={p.id} value={p.id}>{p.nome} (personalizado)</option>)}
      </select>

      <ErrorBanner message={error} onDismiss={() => setError("")} />

      <Card style={{ padding: 4, overflow: "hidden", marginBottom: 14 }}>
        {days.map((d, i) => (
          <div key={d.weekday} style={{ padding: "12px", borderBottom: i < 6 ? `1px solid ${COLORS.border}` : "none" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: d.open ? 10 : 0 }}>
              <span style={{ fontWeight: 700, fontSize: 13.5 }}>{WEEKDAY_FULL[d.weekday]}</span>
              <button onClick={() => updateDay(d.weekday, { open: !d.open })} className="sd-check" style={{
                width: 40, height: 22, borderRadius: 999, border: "none", cursor: "pointer", position: "relative",

                    <input type="time" value={d.breakStart} onChange={e => updateDay(d.weekday, { breakStart: e.target.value })} style={{ ...fieldStyle, padding: "8px 10px", fontSize: 16 }} />
                    <span style={{ color: COLORS.inkFaint, fontSize: 12 }}>até</span>
                    <input type="time" value={d.breakEnd} onChange={e => updateDay(d.weekday, { breakEnd: e.target.value })} style={{ ...fieldStyle, padding: "8px 10px", fontSize: 16 }} />

          <Card style={{ padding: 16, marginBottom: 16 }}>

              <select value={tipo} onChange={e => setTipo(e.target.value)} style={fieldStyle}>

                <option value="ferias">Férias</option>
                <option value="bloqueio">Bloqueio manual (horário específico)</option>

              <div style={{ display: "flex", gap: 8 }}>
                <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} style={fieldStyle} />
                <input type="date" value={endDate} onChange={e => setEndDate(e.target.value)} style={fieldStyle} />
              </div>
              {(tipo === "bloqueio" || tipo === "compromisso") && (
                <div style={{ display: "flex", gap: 8 }}>

                  <input type="time" value={endTime} onChange={e => setEndTime(e.target.value)} style={fieldStyle} />

          ) : (
            <Card style={{ padding: 4, overflow: "hidden" }}>
              {timeOff.map((t, i) => {
                const prof = professionals.find(p => p.id === t.professionalId);
                const [fg, bg] = tipoTone[t.tipo] || [COLORS.inkSoft, COLORS.bgAlt];

                    display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px",

                  }}>
                    <div>
                      <div style={{ display: "flex", alignItems: "center", gap: 7, fontWeight: 700, fontSize: 13 }}>
                        <Pill fg={fg} bg={bg}>{tipoLabel[t.tipo]}</Pill> {prof?.nome}

                      <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 4 }}>
                        {new Date(t.startAt).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: (t.tipo === "bloqueio" || t.tipo === "compromisso") ? "2-digit" : undefined, minute: (t.tipo === "bloqueio" || t.tipo === "compromisso") ? "2-digit" : undefined })}
                        {" → "}
                        {new Date(t.endAt).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: (t.tipo === "bloqueio" || t.tipo === "compromisso") ? "2-digit" : undefined, minute: (t.tipo === "bloqueio" || t.tipo === "compromisso") ? "2-digit" : undefined })}
