function authHeaders(token) {
  return {
    apikey: SUPABASE_ANON_KEY,
    Authorization: `Bearer ${token || SUPABASE_ANON_KEY}`,
    "Content-Type": "application/json",
  };
}

async function sbRequest(path, { method = "GET", token, body, prefer } = {}) {
  const headers = authHeaders(token);
  if (prefer) headers["Prefer"] = prefer;

  let res;
  try {
    res = await fetch(`${SUPABASE_URL}${path}`, {
      method,
      headers,
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
  } catch (networkErr) {
    console.error("[Supabase] falha de rede em", path, networkErr);
    throw new Error("Não foi possível conectar ao Supabase. Confira a URL do projeto, a chave anônima e sua conexão.");
  }

  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }

  if (!res.ok) {
    const msg =
      (data && (data.error_description || data.msg || data.message || data.error)) ||
      `Erro ${res.status}`;
    const finalMsg = typeof msg === "string" ? msg : "Erro inesperado";
    console.error("[Supabase]", method, path, res.status, data);
    throw new Error(finalMsg);
  }
  return data;
}

const SESSION_KEY = "sd_session_v1";
function savePersistedSession(obj) {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(obj)); } catch { /* localStorage indisponível */ }
}
function loadPersistedSession() {
  try { const raw = localStorage.getItem(SESSION_KEY); return raw ? JSON.parse(raw) : null; } catch { return null; }

function clearPersistedSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch { /* noop */ }
}

function translateAuthError(err) {
  console.error("[Auth]", err);
  const msg = (err && err.message) || "";
  if (/email not confirmed/i.test(msg)) return "email_not_confirmed";
  if (/invalid login credentials/i.test(msg)) return "E-mail ou senha incorretos.";
  if (/user already registered|already been registered/i.test(msg)) return "Já existe uma conta com este e-mail. Tente entrar ou recuperar a senha.";
  if (/password.*at least|password.*short/i.test(msg)) return "A senha precisa ter pelo menos 6 caracteres.";
  return msg || "Algo deu errado. Tente novamente.";
}

/* ---------------------------------------------------------
   WHATSAPP AUTOMÁTICO — Evolution API (self-hosted, grátis, por QR Code)
   Diferente do link manual (wa.me), aqui a mensagem é enviada sozinha,
   sem precisar abrir o WhatsApp e apertar enviar. A ligação com o
   WhatsApp é feita escaneando um QR Code (igual ao WhatsApp Web) —
   por isso o celular continua funcionando normalmente, e não tem
   custo por mensagem. Se a conexão cair (o Evolution avisou que pode
   acontecer), é só voltar aqui e ler o QR Code de novo.
--------------------------------------------------------- */
const evolutionApi = {
  async qrCode(est) {
    const url = `${est.waEvolutionUrl.replace(/\/$/, "")}/instance/connect/${est.waEvolutionInstance}`;
    const res = await fetch(url, { headers: { apikey: est.waEvolutionApiKey } });
    const data = await res.json();
    if (!res.ok) throw new Error(data?.message || "Não consegui gerar o QR Code. Confira a URL, a API Key e o nome da instância.");
    return data.base64 || data.qrcode?.base64 || null;
  },
  async status(est) {
    const url = `${est.waEvolutionUrl.replace(/\/$/, "")}/instance/connectionState/${est.waEvolutionInstance}`;
    const res = await fetch(url, { headers: { apikey: est.waEvolutionApiKey } });
    const data = await res.json().catch(() => ({}));
    const estado = data?.instance?.state || data?.state;
    return estado === "open" ? "conectado" : "desconectado";
  },
  async sendText(est, phone, text) {
    const url = `${est.waEvolutionUrl.replace(/\/$/, "")}/message/sendText/${est.waEvolutionInstance}`;
    const res = await fetch(url, {
      method: "POST",
      headers: { apikey: est.waEvolutionApiKey, "Content-Type": "application/json" },
      body: JSON.stringify({ number: phone, text }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data?.message || "Falha ao enviar a mensagem pelo WhatsApp automático.");
    return data;
  },
};

/* Lê um arquivo de imagem escolhido pela pessoa e devolve uma
   versão já reduzida (quadrada, até 240px, JPEG) como data URL —
   pequena o bastante pra guardar direto numa coluna de texto no
   banco, sem precisar de bucket de Storage. */
function readAndResizeImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Não foi possível ler a imagem."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Arquivo de imagem inválido."));
      img.onload = () => {
        const size = 240;
        const canvas = document.createElement("canvas");
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        const side = Math.min(img.width, img.height);
        const sx = (img.width - side) / 2, sy = (img.height - side) / 2;
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
        resolve(canvas.toDataURL("image/jpeg", 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* Avatar clicável: clique abre o seletor de arquivo do aparelho,
   comprime a imagem e chama onChangePhoto(dataUrl). Usado na lista
   de profissionais e de clientes. */
function EditableAvatar({ name, photoUrl, size = 38, onChangePhoto, disabled }) {
  const inputRef = useRef(null);
  const [loading, setLoading] = useState(false);

  async function handleFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setLoading(true);
    try {
      const dataUrl = await readAndResizeImage(file);
      await onChangePhoto(dataUrl);
    } catch (err) {
      // silencioso — se falhar, a foto simplesmente não muda
    } finally {
      setLoading(false);
    }
  }

  return (
    <button
      type="button"
      disabled={disabled || loading}
      onClick={() => inputRef.current && inputRef.current.click()}
      className="sd-btn"
      style={{ background: "none", border: "none", padding: 0, cursor: "pointer", position: "relative", flexShrink: 0, borderRadius: "50%" }}
      title="Clique pra adicionar ou trocar a foto"
    >
      <Avatar name={name} photoUrl={photoUrl} size={size} />
      <div style={{
        position: "absolute", bottom: -2, right: -2, width: size * 0.42, height: size * 0.42, borderRadius: "50%",
        background: COLORS.primary, display: "flex", alignItems: "center", justifyContent: "center",
        border: `1.5px solid ${COLORS.surface}`,
      }}>
        {loading ? <Loader2 size={size * 0.22} color="#fff" className="spin" /> : <Pencil size={size * 0.22} color="#fff" />}
      </div>
      <input ref={inputRef} type="file" accept="image/*" onChange={handleFile} style={{ display: "none" }} />
    </button>
  );
}

/* Duração dos serviços em opções prontas (em minutos), pra secretária
   escolher "1h30" em vez de ter que calcular quantos minutos isso é. */
const DURATION_OPTIONS = [
  { min: 15, label: "15 min" },
  { min: 30, label: "30 min" },
  { min: 45, label: "45 min" },
  { min: 60, label: "1h" },
  { min: 75, label: "1h15" },
  { min: 90, label: "1h30" },
  { min: 105, label: "1h45" },
  { min: 120, label: "2h" },
  { min: 150, label: "2h30" },
  { min: 180, label: "3h" },
  { min: 240, label: "4h" },
];
function formatDuration(min) {
  const found = DURATION_OPTIONS.find(o => o.min === min);
  if (found) return found.label;
  const h = Math.floor(min / 60), m = min % 60;
  if (h === 0) return `${m} min`;
  return m === 0 ? `${h}h` : `${h}h${String(m).padStart(2, "0")}`;
}

function fmtDate(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
const WEEKDAYS = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const WEEKDAY_FULL = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];
function weekday(iso) {
  const d = new Date(iso + "T12:00:00");
  return WEEKDAYS[d.getDay()];
}
function slugify(str) {
  return (str || "")
    .toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-|-$)/g, "")
    .slice(0, 40) || "estabelecimento";
}

/* O link "wa.me/<numero>" só abre a conversa certa se o número
   estiver no formato internacional completo (55 + DDD + número).
   Se a secretária digitar só "11987654321" (sem o 55 na frente),
   o WhatsApp não acha o contato e mostra "não está no WhatsApp" —
   mesmo o número estando certinho. Por isso todo número é
   normalizado pra sempre ter o 55 antes de ser salvo ou usado
   num link de WhatsApp. */
function normalizeWhatsapp(raw) {
  let digits = (raw || "").replace(/\D/g, "");
  digits = digits.replace(/^0+/, "");
  if (digits.length === 10 || digits.length === 11) {
    digits = "55" + digits;
  }
  return digits;
}

/* "Puxar da agenda do celular": o navegador tem uma API nativa
   (Contact Picker) que abre os contatos salvos no telefone e deixa
   escolher um — sem o site nunca ter acesso à agenda inteira, só ao
   contato que a pessoa escolher na hora. Hoje isso só existe no
   Chrome/Android (e navegadores baseados nele); no iPhone e no
   computador o navegador ainda não oferece isso, então o botão só
   aparece quando o celular realmente suporta. */
function contactPickerSuportado() {
  return typeof navigator !== "undefined" && "contacts" in navigator && "ContactsManager" in window;
}
async function importarContatoDoTelefone() {
  const props = ["name", "tel"];
  const [contato] = await navigator.contacts.select(props, { multiple: false });
  if (!contato) return null;
  return {
    nome: (contato.name && contato.name[0]) || "",
    whatsapp: (contato.tel && contato.tel[0]) || "",
  };
}

/* Importação em lote via arquivo .vcf (vCard) — o formato que o
   próprio app Contatos do iPhone exporta quando a pessoa seleciona
   vários contatos e toca em "Compartilhar contato" > "Salvar em
   Arquivos". Como o iPhone não deixa o navegador abrir a agenda de
   contatos diretamente (isso só existe no Chrome/Android), esse é
   o caminho que funciona pra quem usa iPhone: exporta uma vez lá do
   Contatos, e importa aqui de uma vez só. */
function parseVCard(texto) {
  const blocos = texto.split(/BEGIN:VCARD/i).slice(1);
  const contatos = [];
  for (const bloco of blocos) {
    const linhas = bloco.split(/END:VCARD/i)[0].split(/\r\n|\n|\r/).map(l => l.trim()).filter(Boolean);
    let nome = "", sobrenomeN = "", telefone = "";
    for (const linha of linhas) {
      if (/^FN[:;]/i.test(linha)) {
        nome = linha.split(":").slice(1).join(":").trim();
      } else if (/^N[:;]/i.test(linha) && !sobrenomeN) {
        const partes = linha.split(":").slice(1).join(":").split(";");
        sobrenomeN = [partes[1], partes[0]].filter(Boolean).join(" ").trim();
      } else if (!telefone && /^TEL[:;]/i.test(linha)) {
        telefone = linha.split(":").slice(1).join(":").trim();
      }
    }
    const nomeFinal = nome || sobrenomeN || "Sem nome";
    if (telefone) contatos.push({ nome: nomeFinal, whatsapp: telefone });
  }
  return contatos;
}

const MONTH_NAMES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
function formatMonthLabel(monthPrefix) {
  const [y, m] = monthPrefix.split("-").map(Number);
  return `${MONTH_NAMES[m - 1]} de ${y}`;
}
function toLocalIso(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function todayIso() { return toLocalIso(new Date()); }
function ymd(y, m, d) { return `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`; }
function addMinutesToTime(hhmm, minutes) {
  const [h, m] = hhmm.split(":").map(Number);
  const total = h * 60 + m + (minutes || 0);
  const hh = String(Math.floor((total % 1440) / 60)).padStart(2, "0");
  const mm = String(total % 60).padStart(2, "0");
  return `${hh}:${mm}`;
}
function addMonths(year, month, delta) {
  const d = new Date(year, month + delta, 1);
  return { year: d.getFullYear(), month: d.getMonth() };
}
function monthMatrix(year, month) {
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(ymd(year, month, d));
  while (cells.length % 7 !== 0) cells.push(null);
  const weeks = [];
  for (let i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
  return weeks;
}

/* Calendário mensal reutilizável (estilo Google Calendar): navega
   entre meses, respeita uma janela mín/máx de datas selecionáveis,
   e aceita marcações coloridas por dia via getDayMeta(dateStr). */
function MonthCalendar({ year, month, onNavigate, selectedDate, onSelectDate, minDate, maxDate, getDayMeta }) {
  const weeks = useMemo(() => monthMatrix(year, month), [year, month]);
  const today = todayIso();
  const canGoPrev = !minDate || addMonths(year, month, -1).year * 100 + addMonths(year, month, -1).month >= (Number(minDate.slice(0,4)) * 100 + (Number(minDate.slice(5,7)) - 1));
  const canGoNext = !maxDate || (year * 100 + month) < (Number(maxDate.slice(0,4)) * 100 + (Number(maxDate.slice(5,7)) - 1)) || (year === Number(maxDate.slice(0,4)) && month === Number(maxDate.slice(5,7)) - 1);

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
        <button onClick={() => canGoPrev && onNavigate(-1)} disabled={!canGoPrev} className="sd-btn" style={{
          background: COLORS.bgAlt, border: "none", borderRadius: 9, width: 30, height: 30, cursor: canGoPrev ? "pointer" : "not-allowed",
          color: canGoPrev ? COLORS.ink : COLORS.inkFaint, display: "flex", alignItems: "center", justifyContent: "center",
        }}><ChevronLeft size={15} /></button>
        <span className="font-display" style={{ fontSize: 15.5, fontWeight: 600 }}>{MONTH_NAMES[month]} {year}</span>
        <button onClick={() => canGoNext && onNavigate(1)} disabled={!canGoNext} className="sd-btn" style={{
          background: COLORS.bgAlt, border: "none", borderRadius: 9, width: 30, height: 30, cursor: canGoNext ? "pointer" : "not-allowed",
          color: canGoNext ? COLORS.ink : COLORS.inkFaint, display: "flex", alignItems: "center", justifyContent: "center",
        }}><ChevronRight size={15} /></button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 2, marginBottom: 4 }}>
        {WEEKDAYS.map(w => (
          <div key={w} className="font-body" style={{ textAlign: "center", fontSize: 10, fontWeight: 700, color: COLORS.inkFaint, textTransform: "uppercase", padding: "2px 0" }}>{w}</div>
        ))}
      </div>

      {weeks.map((week, wi) => (
        <div key={wi} style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 2, marginBottom: 2 }}>
          {week.map((dateStr, di) => {
            if (!dateStr) return <div key={di} />;
            const disabled = (minDate && dateStr < minDate) || (maxDate && dateStr > maxDate);
            const isToday = dateStr === today;
            const isSelected = dateStr === selectedDate;
            const meta = getDayMeta ? getDayMeta(dateStr) || {} : {};
            const dayNum = Number(dateStr.slice(8, 10));
            return (
              <button
                key={di}
                disabled={disabled}
                onClick={() => onSelectDate(dateStr)}
                className="sd-btn"
                style={{
                  position: "relative", aspectRatio: "1", border: "none", borderRadius: 10, cursor: disabled ? "not-allowed" : "pointer",
                  background: isSelected ? `linear-gradient(155deg, ${COLORS.primary}, ${COLORS.primaryDeep})` : meta.bg || "transparent",
                  color: isSelected ? "#fff" : disabled ? COLORS.inkFaint : (meta.fg || COLORS.ink),
                  fontWeight: isToday ? 800 : 600, fontSize: 12.5, opacity: disabled ? 0.35 : 1,
                  display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 2,
                  outline: isToday && !isSelected ? `1.5px solid ${COLORS.primary}55` : "none",
                }}
              >
                {dayNum}
                {meta.dot && !isSelected && <span style={{ width: 4, height: 4, borderRadius: "50%", background: meta.dot }} />}
              </button>
            );
          })}
        </div>
      ))}
    </div>
  );
}

function ResetPasswordForm({ onReset, loading, error }) {
  const [senha, setSenha] = useState("");
  const [confirmar, setConfirmar] = useState("");
  const [done, setDone] = useState(false);
  const mismatch = confirmar.length > 0 && senha !== confirmar;

  async function submit(e) {
    e.preventDefault();
    if (senha.length < 6 || mismatch) return;
    await onReset(senha);
    setDone(true);
  }

  return (
    <div className="font-body pop-in sd-auth-shell" style={{ background: COLORS.heroGradient, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>

function todaysQuote() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const dayOfYear = Math.floor((now - start) / 86400000);
  return QUOTES[dayOfYear % QUOTES.length];
}

const EARNINGS_PERIODS = ["dia", "semana", "mes", "ano"];
const EARNINGS_CYCLE = ["dia", "mes", "ano"]; // ordem do clique simples no card do painel
const EARNINGS_LABELS = { dia: "hoje", semana: "esta semana", mes: "este mês", ano: "este ano" };

/* ---------------------------------------------------------
   ADMIN: DASHBOARD
--------------------------------------------------------- */
function Dashboard({ data, setPage, announcements = [], quote }) {
  const { appointments, clients, shoppingList, services } = data;
  const todayIso = toLocalIso(new Date());
  const tomorrowIso = toLocalIso(new Date(Date.now() + 86400000));

  const [earningsPeriod, setEarningsPeriod] = useState("dia");
  const earnings = useMemo(() => {
    const priceOf = (servicoId) => services.find(s => s.id === servicoId)?.preco || 0;
    const valid = appointments.filter(a => a.status !== "cancelado");
    const now = new Date();
    const weekStart = new Date(now);
    const dow = weekStart.getDay(); // 0=domingo
    weekStart.setDate(weekStart.getDate() - (dow === 0 ? 6 : dow - 1)); // segunda-feira desta semana
    const weekStartIso = toLocalIso(weekStart);
    const monthPrefix = todayIso.slice(0, 7);
    const yearPrefix = todayIso.slice(0, 4);
    const sum = (predicate) => valid.filter(predicate).reduce((acc, a) => acc + priceOf(a.servicoId), 0);
    return {
      dia: sum(a => a.data === todayIso),
      semana: sum(a => a.data >= weekStartIso && a.data <= todayIso),
      mes: sum(a => a.data.slice(0, 7) === monthPrefix),
      ano: sum(a => a.data.slice(0, 4) === yearPrefix),
    };
  }, [appointments, services, todayIso]);

  // Clique simples: alterna dia → mês → ano. Clique duplo: abre o painel financeiro completo.
  // (o clique simples fica "represado" 260ms esperando um segundo clique antes de agir,
  // pra dar tempo de diferenciar um clique duplo — padrão comum pra essa distinção em web/mobile)
  const clickTimer = useRef(null);
  function handleEarningsClick() {
    if (clickTimer.current) {
      clearTimeout(clickTimer.current);
      clickTimer.current = null;
      setPage("financeiro");
    } else {
      clickTimer.current = setTimeout(() => {
        setEarningsPeriod(p => EARNINGS_CYCLE[(EARNINGS_CYCLE.indexOf(p) + 1) % EARNINGS_CYCLE.length]);
        clickTimer.current = null;
      }, 260);
    }
  }

  const todayAppts = useMemo(
    () => appointments.filter(a => a.data === todayIso && a.status !== "cancelado").sort((a, b) => a.horario.localeCompare(b.horario)),
    [appointments, todayIso]
  );

  const alerts = useMemo(() => {
    const list = [];
    const awaitingTomorrow = appointments.filter(a => a.data === tomorrowIso && a.status === "aguardando");
    if (awaitingTomorrow.length > 0) {
      list.push({ icon: Bell, text: `Você possui ${awaitingTomorrow.length} cliente${awaitingTomorrow.length > 1 ? "s" : ""} que ainda não confirmou o horário de amanhã.`, tone: "amber" });
    }
    const nowHM = new Date().toTimeString().slice(0, 5);
    const upcomingToday = todayAppts.filter(a => a.horario >= nowHM);
    const pastUnrealizedToday = todayAppts.filter(a => a.horario < nowHM && !a.realizado);
    if (upcomingToday.length > 0) {
      const a = upcomingToday[0];
      const c = clients.find(cl => cl.id === a.clienteId);
      if (c) list.push({ icon: Clock, text: `Cliente ${c.nome.split(" ")[0]} tem atendimento hoje às ${a.horario}.`, tone: "primary" });
    } else if (pastUnrealizedToday.length > 0) {
      list.push({
        icon: AlertCircle,
        text: `Confirme se você já realizou ${pastUnrealizedToday.length > 1 ? "os " + pastUnrealizedToday.length + " atendimentos" : "o atendimento"} de hoje.`,
        tone: "amber",
        onClick: () => setPage("agenda"),
      });
    }
    const riskClients = clients.filter(c => c.historicoCancelamento && appointments.some(a => a.clienteId === c.id && a.status !== "cancelado"));
    if (riskClients.length > 0) {
      list.push({ icon: Bell, text: `Existe ${riskClients.length > 1 ? "clientes" : "uma cliente"} com histórico de cancelamento na agenda.`, tone: "terra" });
    }
    const pending = shoppingList.filter(i => !i.comprado);
    if (pending.length > 0) {
      list.push({ icon: ShoppingBag, text: `Você possui ${pending.length} ite${pending.length > 1 ? "ns" : "m"} pendente${pending.length > 1 ? "s" : ""} na lista de compras.`, tone: "gold" });
    }

    // Sempre mostra 3 avisos: se sobrarem menos que 3 avisos "de alerta" de verdade,
    // completa com informações neutras (calculadas dos dados reais, não inventadas).
    if (list.length < 3) {
      if (todayAppts.length === 0) {
        list.push({ icon: Calendar, text: "Você não tem nenhum atendimento marcado para hoje.", tone: "primary" });
      } else {
        list.push({ icon: Calendar, text: `Você tem ${todayAppts.length} atendimento${todayAppts.length > 1 ? "s" : ""} confirmado${todayAppts.length > 1 ? "s" : ""} pra hoje.`, tone: "primary" });
      }
    }
    if (list.length < 3) {
      const in7days = appointments.filter(a => a.status !== "cancelado" && a.data > todayIso && a.data <= addDaysToDateStr(todayIso, 7));
      list.push({ icon: Sparkles, text: `Você tem ${in7days.length} atendimento${in7days.length > 1 ? "s" : ""} agendado${in7days.length > 1 ? "s" : ""} pros próximos 7 dias.`, tone: "sage" });
    }
    if (list.length < 3) {
      list.push({ icon: ShoppingBag, text: "Sua lista de compras está em dia.", tone: "gold" });
    }
    return list.slice(0, 3);
  }, [appointments, clients, shoppingList, todayIso, tomorrowIso, todayAppts]);

  const toneColor = { amber: COLORS.amber, primary: COLORS.primary, terra: COLORS.terra, gold: COLORS.gold, sage: COLORS.sage };
  const toneBg = { amber: COLORS.amberSoft, primary: COLORS.primarySoft, terra: COLORS.terraSoft, gold: COLORS.goldSoft, sage: COLORS.sageSoft };

  const quick = [
    { key: "agenda", label: "Agenda", icon: Calendar, value: appointments.filter(a => a.status !== "cancelado").length, sub: "atendimentos" },
    { key: "clientes", label: "Clientes", icon: Users, value: clients.length, sub: "cadastradas" },
    { key: "compras", label: "Compras", icon: ShoppingBag, value: shoppingList.filter(i => !i.comprado).length, sub: "pendentes" },
  ];

  return (
    <div className="fade-up">
      <div style={{ marginBottom: 18 }}>
        <h1 className="font-display" style={{ fontSize: 31, margin: 0, fontWeight: 600, color: COLORS.ink }}>
          Bom te ver por <span className="font-display-italic" style={{ color: COLORS.accent }}>aqui</span>.
        </h1>
      </div>

      {quote && (
        <Card style={{ padding: "14px 16px", marginBottom: 22, background: COLORS.accentSoft, boxShadow: "none", border: "none" }}>
          <div style={{ fontSize: 13, color: COLORS.primaryDeep, lineHeight: 1.55, fontStyle: "italic", fontWeight: 700 }}>{quote}</div>
        </Card>
      )}

      {announcements.length > 0 && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 22 }}>
          {announcements.map(a => (
            <Card key={a.id} style={{ padding: "13px 14px", background: COLORS.primarySoft, boxShadow: "none", border: "none" }}>
              <div style={{ fontWeight: 700, fontSize: 12.5, color: COLORS.primaryDeep }}>{a.title}</div>
              <div style={{ fontSize: 12.5, color: COLORS.primaryDeep, opacity: 0.85, marginTop: 3, lineHeight: 1.45 }}>{a.message}</div>
            </Card>
          ))}
        </div>
      )}

      <SectionLabel>Avisos de hoje</SectionLabel>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 26 }}>
        {alerts.map((a, i) => {
          const Icon = a.icon;
          const c = toneColor[a.tone];
          const b = toneBg[a.tone];
          return (
            <Card
              key={i}
              className="fade-up sd-btn"
              onClick={a.onClick}
              style={{ padding: "13px 14px", display: "flex", alignItems: "flex-start", gap: 11, animationDelay: `${i * 0.05}s`, cursor: a.onClick ? "pointer" : "default" }}
            >
              <div style={{
                width: 30, height: 30, borderRadius: 9, background: b, flexShrink: 0,
                display: "flex", alignItems: "center", justifyContent: "center",
              }}>
                <Icon size={14.5} color={c} />
              </div>
              <span style={{ fontSize: 13.5, color: COLORS.ink, lineHeight: 1.45, paddingTop: 3 }}>{a.text}</span>
              {a.onClick && <ChevronRight size={14} color={COLORS.inkFaint} style={{ marginLeft: "auto", flexShrink: 0, marginTop: 6 }} />}
            </Card>
          );
        })}
      </div>

      <SectionLabel>Acesso rápido</SectionLabel>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        {quick.map((q, i) => {
          const Icon = q.icon;
          return (
            <button key={q.key} onClick={() => setPage(q.key)} className="sd-btn fade-up" style={{ all: "unset", cursor: "pointer", animationDelay: `${i * 0.04}s` }}>
              <Card style={{ padding: "16px 16px 15px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                  <div style={{
                    width: 32, height: 32, borderRadius: 9, background: COLORS.primarySoft,
                    display: "flex", alignItems: "center", justifyContent: "center",
                  }}>
                    <Icon size={15} color={COLORS.primary} />
                  </div>
                  <ChevronRight size={14} color={COLORS.inkFaint} />
                </div>
                <div className="font-display" style={{ fontSize: 26, fontWeight: 600, marginTop: 14, color: COLORS.ink, lineHeight: 1 }}>{q.value}</div>
                <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginTop: 4, fontWeight: 600 }}>{q.label} · {q.sub}</div>
              </Card>
            </button>
          );
        })}

        <button onClick={handleEarningsClick} className="sd-btn fade-up" style={{ all: "unset", cursor: "pointer", animationDelay: "0.16s" }}>
          <Card style={{ padding: "16px 16px 15px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div style={{
                width: 32, height: 32, borderRadius: 9, background: COLORS.sageSoft,
                display: "flex", alignItems: "center", justifyContent: "center",
              }}>
                <Wallet size={15} color={COLORS.sage} />
              </div>
              <ChevronRight size={14} color={COLORS.inkFaint} />
            </div>
            <div className="font-display" style={{ fontSize: 22, fontWeight: 600, marginTop: 14, color: COLORS.ink, lineHeight: 1 }}>
              {earnings[earningsPeriod].toLocaleString("pt-BR", { style: "currency", currency: "BRL" })}
            </div>
            <div style={{ fontSize: 12.5, color: COLORS.inkSoft, marginTop: 4, fontWeight: 600 }}>Ganhos estimados · {EARNINGS_LABELS[earningsPeriod]}</div>
          </Card>
        </button>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   ADMIN: FINANCEIRO (aberto com clique duplo no card de
   Ganhos estimados do Painel)
--------------------------------------------------------- */
function Financeiro({ data, setPage, onAddBill, onToggleBillPaid, onRemoveBill }) {
  const { appointments, clients, services, shoppingList, bills = [] } = data;
  const todayIso = toLocalIso(new Date());
  const [reportMonth, setReportMonth] = useState(todayIso.slice(0, 7));
  const [showReport, setShowReport] = useState(false);

  const stats = useMemo(() => {
    const priceOf = (servicoId) => services.find(s => s.id === servicoId)?.preco || 0;
    const nameOf = (servicoId) => services.find(s => s.id === servicoId)?.nome || "Serviço removido";
    const valid = appointments.filter(a => a.status !== "cancelado");

    const now = new Date();
    const weekStart = new Date(now);
    const dow = weekStart.getDay();
    weekStart.setDate(weekStart.getDate() - (dow === 0 ? 6 : dow - 1));
    const weekStartIso = toLocalIso(weekStart);
    const monthPrefix = todayIso.slice(0, 7);
    const yearPrefix = todayIso.slice(0, 4);
    const prevMonthDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const prevMonthPrefix = toLocalIso(prevMonthDate).slice(0, 7);

    const sum = (list) => list.reduce((acc, a) => acc + priceOf(a.servicoId), 0);
    const monthAppts = valid.filter(a => a.data.slice(0, 7) === monthPrefix);
    const prevMonthAppts = valid.filter(a => a.data.slice(0, 7) === prevMonthPrefix);
    const monthTotal = sum(monthAppts);
    const prevMonthTotal = sum(prevMonthAppts);
    const variacao = prevMonthTotal > 0 ? ((monthTotal - prevMonthTotal) / prevMonthTotal) * 100 : null;

    const allMonthAppts = appointments.filter(a => a.data.slice(0, 7) === monthPrefix);
    const canceladosNoMes = allMonthAppts.filter(a => a.status === "cancelado").length;
    const taxaCancelamento = allMonthAppts.length > 0 ? (canceladosNoMes / allMonthAppts.length) * 100 : 0;

    const ticketMedio = monthAppts.length > 0 ? monthTotal / monthAppts.length : 0;

    const porServico = {};
    monthAppts.forEach(a => { porServico[a.servicoId] = (porServico[a.servicoId] || 0) + priceOf(a.servicoId); });
    const topServicoId = Object.keys(porServico).sort((a, b) => porServico[b] - porServico[a])[0];

    // Ganhos RECEBIDOS: só os atendimentos que você confirmou que
    // realmente aconteceu, com o preço do serviço + valor extra cobrado.
    const done = appointments.filter(a => a.realizado);
    const recebidoDe = (list) => list.reduce((acc, a) => acc + priceOf(a.servicoId) + (a.valorExtra || 0), 0);
    const doneMonth = done.filter(a => a.data.slice(0, 7) === monthPrefix);
    const porPagamento = { pix: 0, dinheiro: 0, cartao: 0 };
    doneMonth.forEach(a => {
      if (a.formaPagamento && porPagamento[a.formaPagamento] != null) {
        porPagamento[a.formaPagamento] += priceOf(a.servicoId) + (a.valorExtra || 0);
      }
    });
    const ticketMedioRecebido = doneMonth.length > 0 ? recebidoDe(doneMonth) / doneMonth.length : 0;

    // DESPESAS: itens de compra marcados como comprados (com o valor
    // que você informou) + contas a pagar marcadas como pagas.
    const comprasFeitas = shoppingList.filter(i => i.comprado && i.valorGasto != null && i.compradoEm);
    const contasPagas = bills.filter(b => b.pago && b.dataPagamento);
    const despesasDe = (comprasList, contasList) =>
      comprasList.reduce((acc, i) => acc + i.valorGasto, 0) + contasList.reduce((acc, b) => acc + Number(b.valor), 0);

    const despesasMes = despesasDe(
      comprasFeitas.filter(i => toLocalIso(new Date(i.compradoEm)).slice(0, 7) === monthPrefix),
      contasPagas.filter(b => b.dataPagamento.slice(0, 7) === monthPrefix),
    );
    const despesasAno = despesasDe(
      comprasFeitas.filter(i => toLocalIso(new Date(i.compradoEm)).slice(0, 4) === yearPrefix),
      contasPagas.filter(b => b.dataPagamento.slice(0, 4) === yearPrefix),
    );

    const recebidoMes = recebidoDe(doneMonth);

    // Últimos 6 meses, pro gráfico: entrada (recebido), saída (despesas), lucro.
    const last6 = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const prefix = toLocalIso(d).slice(0, 7);
      const entrada = recebidoDe(done.filter(a => a.data.slice(0, 7) === prefix));
      const saida = despesasDe(
        comprasFeitas.filter(i2 => toLocalIso(new Date(i2.compradoEm)).slice(0, 7) === prefix),
        contasPagas.filter(b => b.dataPagamento.slice(0, 7) === prefix),
      );
      last6.push({ label: d.toLocaleDateString("pt-BR", { month: "short" }).replace(".", ""), entrada, saida, lucro: entrada - saida });
    }

    return {
      dia: sum(valid.filter(a => a.data === todayIso)),
      semana: sum(valid.filter(a => a.data >= weekStartIso && a.data <= todayIso)),
      mes: monthTotal,
      ano: sum(valid.filter(a => a.data.slice(0, 4) === yearPrefix)),
      recebidoDia: recebidoDe(done.filter(a => a.data === todayIso)),
      recebidoSemana: recebidoDe(done.filter(a => a.data >= weekStartIso && a.data <= todayIso)),
      recebidoMes,
      recebidoAno: recebidoDe(done.filter(a => a.data.slice(0, 4) === yearPrefix)),
      porPagamento,
      ticketMedio,
      ticketMedioRecebido,
      atendimentosNoMes: monthAppts.length,
      taxaCancelamento,
      variacao,
      topServicoNome: topServicoId ? nameOf(topServicoId) : null,
      topServicoValor: topServicoId ? porServico[topServicoId] : 0,
      despesasMes,
      despesasAno,
      liquidoMes: recebidoMes - despesasMes,
      last6,
    };
  }, [appointments, services, shoppingList, bills, todayIso]);

  // Relatório fechado do mês escolhido, pronto pra imprimir/exportar
  // e mandar pro contador — separado do "stats" acima (que é sempre
  // do mês atual) porque aqui a pessoa pode escolher qualquer mês.
  const report = useMemo(() => {
    const priceOf = (servicoId) => services.find(s => s.id === servicoId)?.preco || 0;
    const nameOf = (servicoId) => services.find(s => s.id === servicoId)?.nome || "Serviço removido";
    const clienteNomeDe = (clienteId) => clients.find(c => c.id === clienteId)?.nome || "Cliente removida";

    const doneMonth = appointments
      .filter(a => a.realizado && a.data.slice(0, 7) === reportMonth)
      .sort((a, b) => (a.data + a.horario).localeCompare(b.data + b.horario));

    const receitaPorPagamento = { pix: 0, dinheiro: 0, cartao: 0 };
    let receitaTotal = 0;
    const linhasReceita = doneMonth.map(a => {
      const valor = priceOf(a.servicoId) + (a.valorExtra || 0);
      receitaTotal += valor;
      if (a.formaPagamento && receitaPorPagamento[a.formaPagamento] != null) receitaPorPagamento[a.formaPagamento] += valor;
      return { data: a.data, cliente: clienteNomeDe(a.clienteId), servico: nameOf(a.servicoId), formaPagamento: a.formaPagamento, valor };
    });

    const comprasDoMes = shoppingList
      .filter(i => i.comprado && i.valorGasto != null && i.compradoEm && toLocalIso(new Date(i.compradoEm)).slice(0, 7) === reportMonth)
      .sort((a, b) => new Date(a.compradoEm) - new Date(b.compradoEm));
    const contasDoMes = bills
      .filter(b => b.pago && b.dataPagamento && b.dataPagamento.slice(0, 7) === reportMonth)
      .sort((a, b) => (a.dataPagamento || "").localeCompare(b.dataPagamento || ""));
    // Custos fixos = contas marcadas como recorrente (água, luz,
    // internet, aluguel...) — o restante fica em "outras contas".
    const contasFixas = contasDoMes.filter(b => b.recorrente);
    const contasAvulsas = contasDoMes.filter(b => !b.recorrente);

    const totalCompras = comprasDoMes.reduce((acc, i) => acc + i.valorGasto, 0);
    const totalContas = contasDoMes.reduce((acc, b) => acc + Number(b.valor), 0);
    const totalFixas = contasFixas.reduce((acc, b) => acc + Number(b.valor), 0);
    const totalAvulsas = contasAvulsas.reduce((acc, b) => acc + Number(b.valor), 0);
    const despesaTotal = totalCompras + totalContas;

    return {
      linhasReceita, receitaTotal, receitaPorPagamento,
      comprasDoMes, contasDoMes, contasFixas, contasAvulsas,
      totalCompras, totalContas, totalFixas, totalAvulsas, despesaTotal,
      liquido: receitaTotal - despesaTotal,
      atendimentos: doneMonth.length,
    };
  }, [appointments, clients, services, shoppingList, bills, reportMonth]);

  const brl = (v) => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

  const periodCards = [
    { label: "Hoje", value: stats.dia },
    { label: "Esta semana", value: stats.semana },
    { label: "Este mês", value: stats.mes },
    { label: "Este ano", value: stats.ano },
  ];

  const recebidoCards = [
    { label: "Hoje", value: stats.recebidoDia },
    { label: "Esta semana", value: stats.recebidoSemana },
    { label: "Este mês", value: stats.recebidoMes },
    { label: "Este ano", value: stats.recebidoAno },
  ];

  // --- Contas a pagar ---
  const [billNome, setBillNome] = useState("");
  const [billValor, setBillValor] = useState("");
  const [billVencimento, setBillVencimento] = useState("");
  const [billRecorrente, setBillRecorrente] = useState(false);
  const [billTipoRecorrencia, setBillTipoRecorrencia] = useState("sempre"); // "sempre" | "parcelas"
  const [billParcelas, setBillParcelas] = useState("");
  const [savingBill, setSavingBill] = useState(false);
  const [busyBillId, setBusyBillId] = useState(null);
  const [billError, setBillError] = useState("");

  const billsPendentes = bills.filter(b => !b.pago).sort((a, b) => (a.vencimento || "9999") < (b.vencimento || "9999") ? -1 : 1);
  const billsPagas = bills.filter(b => b.pago).sort((a, b) => (b.dataPagamento || "") < (a.dataPagamento || "") ? -1 : 1);

  async function addBill(e) {
    e.preventDefault();
    if (!billNome.trim() || !billValor) return;
    if (billRecorrente && billTipoRecorrencia === "parcelas" && !billParcelas) return;
    setSavingBill(true); setBillError("");
    try {
      const payload = {
        nome: billNome, valor: Number(billValor), vencimento: billVencimento || null,
        recorrente: billRecorrente,
        parcela_atual: billRecorrente ? 1 : null,
        parcela_total: billRecorrente && billTipoRecorrencia === "parcelas" ? Number(billParcelas) : null,
        grupo_id: billRecorrente ? crypto.randomUUID() : null,
      };
      await onAddBill(payload);
      setBillNome(""); setBillValor(""); setBillVencimento(""); setBillRecorrente(false); setBillTipoRecorrencia("sempre"); setBillParcelas("");
    } catch (err) { setBillError(err.message); }
    finally { setSavingBill(false); }
  }
  async function toggleBill(bill) {
    setBusyBillId(bill.id);
    try { await onToggleBillPaid(bill.id, !bill.pago); } catch (err) { setBillError(err.message); }
    finally { setBusyBillId(null); }
  }
  async function removeBill(id) {
    setBusyBillId(id);
    try { await onRemoveBill(id); } catch (err) { setBillError(err.message); }
    finally { setBusyBillId(null); }
  }

  const maxChartValue = Math.max(1, ...stats.last6.flatMap(m => [m.entrada, m.saida]));

  return (
    <div className="fade-up">
      <button onClick={() => setPage("dashboard")} className="font-body sd-btn" style={{ background: "none", border: "none", color: COLORS.inkFaint, fontSize: 12.5, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 4, marginBottom: 10, padding: 0 }}>
        <ArrowLeft size={14} /> Voltar ao painel
      </button>

      <div style={{ marginBottom: 20 }}>
        <h1 className="font-display" style={{ fontSize: 27, margin: 0, fontWeight: 600, color: COLORS.ink }}>Financeiro</h1>
        <div style={{ fontSize: 12.5, color: COLORS.inkFaint, marginTop: 3 }}>Ganhos estimados a partir dos preços dos serviços e dos agendamentos não cancelados.</div>
      </div>

      <SectionLabel>Ganhos estimados</SectionLabel>
      <div style={{ fontSize: 12, color: COLORS.inkFaint, marginBottom: 10, marginTop: -6 }}>Tudo que está agendado e não foi cancelado — inclui o que ainda vai acontecer.</div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 22 }}>
        {periodCards.map(p => (
          <Card key={p.label} style={{ padding: "15px 16px" }}>
            <div className="font-display" style={{ fontSize: 21, fontWeight: 600, color: COLORS.ink, lineHeight: 1 }}>{brl(p.value)}</div>
            <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 5, fontWeight: 600 }}>{p.label}</div>
          </Card>
        ))}
      </div>

      <SectionLabel>Ganhos recebidos</SectionLabel>
      <div style={{ fontSize: 12, color: COLORS.inkFaint, marginBottom: 10, marginTop: -6 }}>Só o que você confirmou que realmente aconteceu, na aba Agenda — o dinheiro que já entrou de verdade.</div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 14 }}>
        {recebidoCards.map(p => (
          <Card key={p.label} style={{ padding: "15px 16px", background: COLORS.sageSoft, border: "none" }}>
            <div className="font-display" style={{ fontSize: 21, fontWeight: 600, color: COLORS.sage, lineHeight: 1 }}>{brl(p.value)}</div>
            <div style={{ fontSize: 12, color: "#3E6B4F", marginTop: 5, fontWeight: 600 }}>{p.label}</div>
          </Card>
        ))}
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 22 }}>
        {["pix", "dinheiro", "cartao"].map(fp => (
          <Card key={fp} style={{ padding: "12px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontSize: 13, color: COLORS.inkSoft, fontWeight: 600 }}>Recebido em {PAGAMENTO_LABELS[fp]} (este mês)</span>
            <span style={{ fontSize: 14, color: COLORS.ink, fontWeight: 700 }}>{brl(stats.porPagamento[fp])}</span>
          </Card>
        ))}
      </div>

      <SectionLabel>Saldo do mês (bruto x líquido)</SectionLabel>
      <div style={{ fontSize: 12, color: COLORS.inkFaint, marginBottom: 10, marginTop: -6 }}>Líquido = ganhos recebidos menos as despesas do mês (compras marcadas + contas pagas).</div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 22 }}>
        <Card style={{ padding: "15px 16px" }}>
          <div className="font-display" style={{ fontSize: 19, fontWeight: 600, color: COLORS.ink, lineHeight: 1 }}>{brl(stats.recebidoMes)}</div>
          <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 5, fontWeight: 600 }}>Bruto (recebido)</div>
        </Card>
        <Card style={{ padding: "15px 16px" }}>
          <div className="font-display" style={{ fontSize: 19, fontWeight: 600, color: COLORS.terra, lineHeight: 1 }}>− {brl(stats.despesasMes)}</div>
          <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 5, fontWeight: 600 }}>Despesas (compras + contas)</div>
        </Card>
        <Card style={{ padding: "15px 16px", background: stats.liquidoMes >= 0 ? COLORS.sageSoft : COLORS.terraSoft, border: "none", gridColumn: "1 / -1" }}>
          <div className="font-display" style={{ fontSize: 24, fontWeight: 600, color: stats.liquidoMes >= 0 ? COLORS.sage : COLORS.terra, lineHeight: 1 }}>{brl(stats.liquidoMes)}</div>
          <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 5, fontWeight: 600 }}>Líquido deste mês</div>
        </Card>
      </div>

      <SectionLabel>Entradas x saídas (últimos 6 meses)</SectionLabel>
      <Card style={{ padding: "16px 14px 8px", marginBottom: 22 }}>
        <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: 6, height: 120 }}>
          {stats.last6.map((m, i) => (
            <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center", flex: 1, height: "100%", justifyContent: "flex-end" }}>
              <div style={{ display: "flex", alignItems: "flex-end", gap: 2, height: "100%" }}>
                <div title={brl(m.entrada)} style={{ width: 9, borderRadius: "3px 3px 0 0", background: COLORS.sage, height: `${Math.max(3, (m.entrada / maxChartValue) * 100)}%` }} />
                <div title={brl(m.saida)} style={{ width: 9, borderRadius: "3px 3px 0 0", background: COLORS.terra, height: `${Math.max(3, (m.saida / maxChartValue) * 100)}%` }} />
              </div>
              <div style={{ fontSize: 10.5, color: COLORS.inkFaint, marginTop: 6, fontWeight: 700, textTransform: "capitalize" }}>{m.label}</div>
            </div>
          ))}
        </div>
        <div style={{ display: "flex", gap: 14, justifyContent: "center", marginTop: 12, paddingTop: 10, borderTop: `1px solid ${COLORS.border}` }}>
          <span style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11.5, color: COLORS.inkSoft, fontWeight: 600 }}><span style={{ width: 8, height: 8, borderRadius: 3, background: COLORS.sage, display: "inline-block" }} /> Entrou</span>
          <span style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 11.5, color: COLORS.inkSoft, fontWeight: 600 }}><span style={{ width: 8, height: 8, borderRadius: 3, background: COLORS.terra, display: "inline-block" }} /> Saiu</span>
        </div>
      </Card>

      <SectionLabel>Este mês em detalhe</SectionLabel>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 22 }}>
        <Card style={{ padding: "13px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ fontSize: 13, color: COLORS.inkSoft, fontWeight: 600 }}>Ticket médio (estimado, por atendimento)</span>
          <span style={{ fontSize: 14, color: COLORS.ink, fontWeight: 700 }}>{brl(stats.ticketMedio)}</span>
        </Card>
        <Card style={{ padding: "13px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ fontSize: 13, color: COLORS.inkSoft, fontWeight: 600 }}>Ticket médio recebido (só realizados)</span>
          <span style={{ fontSize: 14, color: COLORS.ink, fontWeight: 700 }}>{brl(stats.ticketMedioRecebido)}</span>
        </Card>
        <Card style={{ padding: "13px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ fontSize: 13, color: COLORS.inkSoft, fontWeight: 600 }}>Atendimentos realizados no mês</span>
          <span style={{ fontSize: 14, color: COLORS.ink, fontWeight: 700 }}>{stats.atendimentosNoMes}</span>
        </Card>
        <Card style={{ padding: "13px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ fontSize: 13, color: COLORS.inkSoft, fontWeight: 600 }}>Taxa de cancelamento do mês</span>
          <span style={{ fontSize: 14, color: stats.taxaCancelamento > 20 ? COLORS.terra : COLORS.ink, fontWeight: 700 }}>{stats.taxaCancelamento.toFixed(0)}%</span>
        </Card>
        {stats.topServicoNome && (
          <Card style={{ padding: "13px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontSize: 13, color: COLORS.inkSoft, fontWeight: 600 }}>Serviço mais rentável do mês</span>
            <span style={{ fontSize: 14, color: COLORS.ink, fontWeight: 700, textAlign: "right" }}>{stats.topServicoNome}<br /><span style={{ fontSize: 12, color: COLORS.inkFaint, fontWeight: 600 }}>{brl(stats.topServicoValor)}</span></span>
          </Card>
        )}
        {stats.variacao !== null && (
          <Card style={{ padding: "13px 14px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontSize: 13, color: COLORS.inkSoft, fontWeight: 600 }}>Comparado ao mês anterior</span>
            <span style={{ fontSize: 14, color: stats.variacao >= 0 ? COLORS.sage : COLORS.terra, fontWeight: 700 }}>{stats.variacao >= 0 ? "+" : ""}{stats.variacao.toFixed(0)}%</span>
          </Card>
        )}
      </div>

      <SectionLabel>Contas a pagar</SectionLabel>
      <Card style={{ padding: 16, marginBottom: 16 }}>

/* ---------------------------------------------------------
